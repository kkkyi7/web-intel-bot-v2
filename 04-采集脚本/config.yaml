          - worldnews
          - geopolitics
          - news
          - Economics
          - InternationalPolitics
        limit_per_sub: 5
        time_range: day

      rss:
        # v2.1：权威时政源走 RSSHub 镜像（rsshub.app 被公共实例限流返回 403）
        # rsshub.rssforever.com 是国内友好的镜像，相对稳定
        # 如果三个 RSSHub 源都挂，36氪 会兜住（limit 低一点，关键词过滤后基本都是时政相关）
        - name: "澎湃新闻"
          url: "https://rsshub.rssforever.com/thepaper/featured"
          region: cn
          limit: 15
        - name: "财新网"
