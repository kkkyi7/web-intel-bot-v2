# ============================================================
# web-intel-bot v2 · 主题与数据源配置
# ============================================================
# 相比 v1 新增：
#   - 每个主题下加 keywords_cn（中文关键词，给国内源预过滤用）
#   - 每个主题下 sources.rss 数组，每条带 region: cn
#   - 海外源（youtube / reddit / arxiv / pubmed）不显式写 region，
#     fetcher 里默认打 region: intl
# ============================================================

# 相关性评分阈值（低于此值的不进最终 Brief）
# v2.8.2 · KIzty 提阈：5 → 6（score 是 LLM 输出的 0-10 整数，6.5 不存在 → 取 6 中庸 / 7 偏严）
min_score: 6

# 每个源（RSS）最多抓多少条用于去噪/过滤
rss_fetch_limit_default: 10

# v2.6.3 · 必跑主题（解锁原本写死的 6 个主题限制）
# 凡是这个列表里的主题名，每天都会强制跑（不让 LLM 决策跳过）
# 加新主题（X 博主 / 英文新闻 等）时：在 topics: 下加配置 → 想必跑就加进这个列表
# 可选主题（不在这个列表里的）由 LLM 决定要不要跑
must_run_topics:
  - AI大事
  - 世界时事
  - 变现路径
  - 技术圈     # v2.8 · KIzty 自评 must-have（HN 热门讨论）
  - GitHub 动态  # v3.3 · 6 大类 × ~3 个 repo 的 release 监控（独立主题防冲淡其他）

# v2.6.3 · 可选主题的最大跑数（必跑之外，LLM 最多再跑几个 optional）
# 默认 2（KIzty 的原设定：必跑 3 + 最多再 2 = 总 5）
# 加新主题想多跑：把这个调大；想保守：调小
optional_topics_cap: 2

# ============================================================
# 订阅者身份卡（v2.5 新增 · LLM 写【对你有啥用】时基于这个）
# ============================================================
# 卖给客户时：每个客户填一份身份卡 → 配进他自己的 v2 →
# 每条新闻【对你有啥用】都基于他的身份。这是 ¥99 配置服务的核心卖点。
subscriber_profile:
  name: KIzty
  role: |
    APS / 供应链优化方向的 PM。
    日常配置 POC + 测试公司产品 RSOPlat。
    职业目标：往顶级 PM 发展。
  company: |
    工业软件公司（资源智能优化协同平台）。
    用 AI + 数学建模把企业问题转成最优计划。
    核心方向：供应链计划决策 / 车间智能排产（APS）/ 物流配送计划。
    客户主要在新能源电池 / 医药 / 钢铁 / 化工 / 汽车 / 电子制造业。
  current_focus: |
    今年最想突破：靠自己的 AI 产品赚小钱（已经在做：路径 1 卖 ¥99 配置服务）。
  interests:
    - 世界大事
    - AI 大事
    - 变现渠道（个人 IP / 副业 / 独立开发）
  blacklist:
    - 广告 / 软广 / 软文
    - 鸡汤 / 励志废话

topics:

  # ========== 主题 1：供应链 / APS（本职方向）==========
