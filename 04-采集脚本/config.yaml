# ============================================================
# web-intel-bot v2 · 主题与数据源配置
# ============================================================
# 相比 v1 新增：
#   - 每个主题下加 keywords_cn（中文关键词，给国内源预过滤用）
#   - 每个主题下 sources.rss 数组，每条带 region: cn
#   - 海外源（youtube / reddit / arxiv / pubmed）不显式写 region，
#     fetcher 里默认打 region: intl
# ============================================================

# 相关性评分阈值（低于此值的不进最终 Brief）
min_score: 5

# 每个源（RSS）最多抓多少条用于去噪/过滤
rss_fetch_limit_default: 10

# ============================================================
# 订阅者身份卡（v2.5 新增 · LLM 写【对你有啥用】时基于这个）
# ============================================================
# 卖给客户时：每个客户填一份身份卡 → 配进他自己的 v2 →
# 每条新闻【对你有啥用】都基于他的身份。这是 ¥99 配置服务的核心卖点。
subscriber_profile:
  name: KIzty
  role: |
    APS / 供应链优化方向的 PM。
    日常配置 POC + 测试公司产品 RSOPlat。
    职业目标：往顶级 PM 发展。
  company: |
    工业软件公司（资源智能优化协同平台）。
    用 AI + 数学建模把企业问题转成最优计划。
    核心方向：供应链计划决策 / 车间智能排产（APS）/ 物流配送计划。
    客户主要在新能源电池 / 医药 / 钢铁 / 化工 / 汽车 / 电子制造业。
  current_focus: |
    今年最想突破：靠自己的 AI 产品赚小钱（已经在做：路径 1 卖 ¥99 配置服务）。
  interests:
    - 世界大事
    - AI 大事
    - 变现渠道（个人 IP / 副业 / 独立开发）
  blacklist:
    - 广告 / 软广 / 软文
    - 鸡汤 / 励志废话

topics:

  # ========== 主题 1：供应链 / APS（本职方向）==========
  供应链:
    keywords:
      - "advanced planning and scheduling"
      - "supply chain optimization"
      - "APS planning"
      - "demand forecasting"
      - "multi-echelon inventory"
      - "digital supply chain"
      - "production scheduling"
      - "inventory optimization"
      - "S&OP planning"
      - "supply chain digital twin"

    # ⭐ v2 新增：中文关键词，给国内源过滤用
    keywords_cn:
      - 供应链
      - 排产
      - APS
      - 高级计划
      - 智能制造
      - 工业软件
      - 生产调度
      - 工业互联网
      - 工业 4.0
      - 数字化转型
      - 制造业

    sources:
      youtube:
        limit: 12
        hours_back: 72
        langs:
          - lang: en
            region: US
          - lang: zh
            region: CN

      reddit:
        subreddits:
          - supplychain
          - logistics
          - OperationsResearch
          - manufacturing
        limit_per_sub: 5
        time_range: week

      arxiv:
        limit: 6
        days_back: 14

      # ⭐ v2 新增：国内 RSS
      rss:
        - name: "36氪"
          url: "https://36kr.com/feed"
          region: cn
          limit: 12
        - name: "InfoQ 中文"
          url: "https://www.infoq.cn/feed"
          region: cn
          limit: 10

