  # ========== 主题 7：技术圈（v2.8 · HackerNews 精华）==========
  # KIzty 自评 must-have。HN top story 按 score 过滤，不依赖 keywords。
  # 抓 top 5 顶层评论喂 LLM，让 summary 能反映社区视角（"为什么这条值得看"）。
  # v3.3：GitHub Release 已移到独立主题「GitHub 动态」（防互相冲淡）
  技术圈:
    keywords: []        # HN 不靠关键词，按 score 自筛
    keywords_cn: []

    sources:
      hackernews:
        enabled: true
        fetch_top_stories: 30        # HN /topstories 取前 30 个 ID
        min_score: 200               # ≥200 分才进 brief（HN 当前热度的中等阈值）
        fetch_top_comments: 5        # 每 story 抓 top 5 顶层评论喂 LLM
        hours_back: 48               # 48 小时内的 story 才算"新"

  # ========== 主题 8：GitHub 动态（v3.3 新增 · 6 大类工具 release 监控）==========
  # 独立主题防止 release 冲淡技术圈 / AI大事 等核心主题。
  # 6 大类 × 3-4 个 repo = 20 个，按 KIzty 实际方向（AI 学习 + 副业 / 独立开发）选
  # days_back=1 = 仅 24 小时内的 release（更严，避免老 release 反复进 brief）
  # 想增删 repo 直接改下面 list；想暂停整个主题 enabled: false 或从 must_run 移除
  GitHub 动态:
    keywords: []        # 按 release 时间自筛
    keywords_cn: []

    sources:
      github_releases:
        enabled: true
        days_back: 1               # 24h 内的 release
        repos:
          # 1. AI 模型 / SDK
          - huggingface/transformers
          - anthropics/anthropic-sdk-python
          - openai/openai-python
          - google/generative-ai-python
          # 2. Agent 工程（你方向）
          - langchain-ai/langchain
          - microsoft/autogen
          - crewAIInc/crewAI
          - mem0ai/mem0
          # 3. 编辑器 / 日常工具
          - anthropics/claude-code
          - getcursor/cursor
          - microsoft/vscode
          # 4. 生产力 / PKM
          - logseq/logseq
          - siyuan-note/siyuan
          - AppFlowy-IO/AppFlowy
          # 5. 副业 / 独立开发
          - calcom/cal.com
          - supabase/supabase
          - vercel/next.js
          # 6. 向量库 / RAG
          - weaviate/weaviate
          - qdrant/qdrant
          - chroma-core/chroma

