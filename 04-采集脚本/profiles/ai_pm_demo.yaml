  - 纯营销软文
  - 没有产品启发的泛科技新闻
mail_to: demo@example.com
topic_priority:
  - AI大事
  - 竞品动态
  - 产品增长
  - 个人效率
  - 变现路径
tone: |
  像一个资深 AI 产品同事帮我筛重点。
  少讲概念，多讲这件事对产品判断、路线图、竞品分析和增长实验有什么用。
