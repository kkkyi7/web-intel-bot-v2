<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 情报流 · web-intel-bot</title>
<style>
  :root{
    --bg:#ffffff; --side:#fbfcfd; --hover:#f4f6f8; --card:#ffffff;
    --line:#ebedf1; --line2:#f1f3f6;
    --txt:#1d2330; --txt2:#3b4252; --dim:#6b7280; --dim2:#9aa3b2;
    --accent:#0fb9a3; --accent-d:#0a8f7e; --accent-soft:#e6f7f4;
    --flame:#f97316; --chip:#f1f3f6;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b0e16; --side:#0e1220; --hover:#141a2c; --card:#10142180;
      --line:#1d2336; --line2:#171c2c;
      --txt:#e8ecf6; --txt2:#c4ccde; --dim:#8b94ab; --dim2:#5f6987;
      --accent:#2dd4bf; --accent-d:#14b8a6; --accent-soft:#0e2a2622;
      --chip:#161c2e;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.62;
  }
  a{color:inherit;text-decoration:none}

  .app{display:flex;min-height:100vh}

  /* ---------------- sidebar ---------------- */
  .side{
    width:212px;flex:0 0 212px;background:var(--side);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px;display:flex;flex-direction:column;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:1.5px;padding:6px 8px 18px;color:var(--txt)}
  .orbit{width:22px;height:22px;position:relative;flex:0 0 22px}
  .orbit::before{content:"";position:absolute;inset:3px;border:2px solid var(--accent);border-radius:50%;border-top-color:transparent;border-right-color:transparent;animation:spin 4s linear infinite}
  .orbit::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);left:8px;top:0;box-shadow:0 0 8px var(--accent)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav .item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;
    color:var(--dim);font-size:13.5px;font-weight:500;user-select:none;transition:.12s;
  }
  .nav .item:hover{background:var(--hover);color:var(--txt2)}
  .nav .item.on{background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .nav .item .ic{width:17px;text-align:center;font-size:15px;opacity:.85}
  .nav .item .ct{margin-left:auto;font-size:11.5px;color:var(--dim2);font-weight:600}
  .nav .item.on .ct{color:var(--accent-d)}
  .nav .sep{height:1px;background:var(--line);margin:10px 6px}
  .nav .label{font-size:11px;color:var(--dim2);font-weight:700;letter-spacing:.5px;padding:4px 10px 2px}
  .side .foot{margin-top:auto;padding:12px 10px 2px;color:var(--dim2);font-size:11px;line-height:1.5}

  /* ---------------- main ---------------- */
  .main{flex:1;min-width:0;max-width:880px;margin:0 auto;padding:26px 30px 90px;width:100%}
  .head h1{font-size:24px;font-weight:800;margin:0 0 3px;letter-spacing:.3px}
  .head .sub{color:var(--dim);font-size:13px;margin-bottom:18px}

  .tools{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--side);border:1px solid var(--line);border-radius:11px;padding:8px 12px}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search input{flex:1;border:none;background:none;outline:none;color:var(--txt);font-size:13.5px}
  .search svg{width:15px;height:15px;fill:var(--dim2)}
  .search kbd{font-size:10.5px;color:var(--dim2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .sortsel{background:var(--side);color:var(--txt2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:none;cursor:pointer}

  /* lead callout */
  .lead{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(110deg,var(--accent-soft),transparent 70%);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius);padding:13px 16px;margin-bottom:22px}
  .lead .bolt{color:var(--accent-d);font-size:15px;margin-top:1px}
  .lead .t{font-weight:700;font-size:15px;color:var(--txt);line-height:1.45}
  .lead .m{color:var(--dim);font-size:12px;margin-top:3px}

  /* date divider */
  .daterow{display:flex;align-items:center;gap:12px;margin:24px 0 12px}
  .daterow:first-child{margin-top:4px}
  .daterow .d{font-size:12.5px;color:var(--dim2);font-weight:700}
  .daterow .ln{flex:1;height:1px;background:var(--line2)}

  /* entry (timeline) */
  .entry{display:flex;gap:16px;padding:4px 0 18px;position:relative}
  .entry .time{flex:0 0 46px;text-align:right;color:var(--dim2);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:2px}
  .entry .col{flex:1;min-width:0;border-bottom:1px solid var(--line2);padding-bottom:16px}
  .entry:last-child .col{border-bottom:none}
  .entry .topline{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .entry .srcmeta{color:var(--dim2);font-size:11.5px;display:flex;align-items:center;gap:6px;min-width:0}
  .entry .srcmeta .b{background:var(--chip);border-radius:5px;padding:1px 6px;color:var(--dim);white-space:nowrap}
  .entry .pills{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:7px;white-space:nowrap}
  .heat{display:flex;align-items:center;gap:3px;color:var(--flame);font-weight:800;font-size:12.5px}
  .heat svg{width:12px;height:12px;fill:var(--flame)}
  .entry h3{font-size:15.5px;font-weight:700;color:var(--txt);margin:2px 0 5px;line-height:1.45}
  .entry h3 a:hover{color:var(--accent-d)}
  .entry .teaser{color:var(--dim);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .entry.open .teaser{-webkit-line-clamp:unset;overflow:visible}
  .entry .more{margin-top:8px;display:inline-flex;align-items:center;gap:4px;color:var(--accent-d);font-size:12.5px;cursor:pointer;user-select:none}
  .entry .more svg{width:13px;height:13px;fill:currentColor;transition:.2s}
  .entry.open .more svg{transform:rotate(180deg)}
  .detail{display:none;margin-top:10px}
  .entry.open .detail{display:block}
  .sec{margin:9px 0}
  .sec .lbl{font-size:11px;font-weight:800;color:var(--accent-d);letter-spacing:.4px;margin-bottom:2px}
  .sec .val{color:var(--txt2);font-size:13.5px;white-space:pre-wrap}
  .sec.use{background:var(--accent-soft);border-radius:10px;padding:9px 12px}
  .sec.link a{color:var(--accent-d);font-size:13px}
  .empty{text-align:center;color:var(--dim2);padding:70px 0}
  mark{background:#ffe9a8;color:#7a5b00;border-radius:3px;padding:0 1px}
  @media (prefers-color-scheme: dark){ mark{background:#5b4a1f;color:#ffe9a8} }

  /* about */
  .about{color:var(--txt2);font-size:14px;line-height:1.8}
  .about code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:13px}
  .about b{color:var(--txt)}

  /* responsive */
  .menu-btn{display:none}
  @media (max-width:760px){
    .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.2s;z-index:50;box-shadow:0 0 40px #0003}
    .side.show{transform:none}
    .main{padding:18px 16px 80px}
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--side);margin-bottom:12px;cursor:pointer;font-size:16px}
    .entry .time{flex-basis:38px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="orbit"></span>AI&nbsp;HOT</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>

  <main class="main">
    <div class="menu-btn" id="menuBtn">☰</div>
    <div class="head">
      <h1 id="ttl">精选</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="tools" id="tools">
      <label class="search">
        <svg viewBox="0 0 24 24"><path d="M21 20l-5.6-5.6a7 7 0 10-1.4 1.4L20 21zM5 10a5 5 0 1110 0 5 5 0 01-10 0z"/></svg>
        <input id="q" type="text" placeholder="搜标题 / 摘要 / 来源…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <select class="sortsel" id="sortSel">
        <option value="auto">默认排序</option>
        <option value="score">按相关性</option>
        <option value="date">按时间</option>
      </select>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
const DATA = __FEED_DATA__;
const GEN  = "__GEN_TIME__";

/* soft tint palette per category */
const TINT = {
  "AI大事":["#e6f7f4","#0a8f7e"], "技术月":["#ede9ff","#6d49d6"], "GitHub动态":["#e7f6ec","#1f9d57"],
  "世界时事":["#ffeaec","#d6455a"], "供应链":["#fff2dd","#b97a12"], "生物学":["#e3f6fb","#0e8aa8"],
  "心理学":["#f0eaff","#7a52d8"], "变现路径":["#ffe9f3","#cc3f86"], "变现路线":["#ffe9f3","#cc3f86"],
  "独立开发":["#e7f6ec","#1f9d57"]
};
const FB=[["#e6f7f4","#0a8f7e"],["#ede9ff","#6d49d6"],["#fff2dd","#b97a12"],["#ffeaec","#d6455a"],["#e3f6fb","#0e8aa8"],["#f0eaff","#7a52d8"]];
function tint(c,i){return TINT[c]||FB[i%FB.length];}

/* parse 【段落】 */
function parseSummary(s){const o={};if(!s)return o;const re=/【([^】]+)】([\s\S]*?)(?=【[^】]+】|$)/g;let m;while((m=re.exec(s))!==null)o[m[1].trim()]=m[2].trim();return o;}
const PICK=(o,...k)=>{for(const x of k)if(o[x])return o[x];return"";};

const cats  = [...new Set(DATA.map(d=>d.category))];
const dates = [...new Set(DATA.map(d=>d.date).filter(Boolean))].sort().reverse();
const STAR_MIN = 7;

let view="star";          // star | all | cat:<name> | about
let sortBy="auto";
let query="";

/* ---- build sidebar ---- */
const nav=document.getElementById('nav');
function navItem(key,icon,label,count){
  const el=document.createElement('div');
  el.className='item'; el.dataset.key=key;
  el.innerHTML=`<span class="ic">${icon}</span><span>${label}</span>`+(count!=null?`<span class="ct">${count}</span>`:'');
  el.onclick=()=>{view=key;closeSide();sync();render();};
  return el;
}
const starCount=DATA.filter(d=>(d.score||0)>=STAR_MIN).length;
nav.appendChild(navItem('star','★','精选',starCount));
nav.appendChild(navItem('all','◷','全部动态',DATA.length));
const lab=document.createElement('div');lab.className='label';lab.textContent='方向';nav.appendChild(lab);
cats.forEach(c=>nav.appendChild(navItem('cat:'+c,'#',c,DATA.filter(d=>d.category===c).length)));
const sep=document.createElement('div');sep.className='sep';nav.appendChild(sep);
nav.appendChild(navItem('about','ⓘ','关于'));
document.getElementById('foot').innerHTML = (GEN?('更新于 '+GEN+'<br>'):'') + DATA.length+' 条 · '+dates.length+' 天';

function sync(){nav.querySelectorAll('.item').forEach(el=>el.classList.toggle('on',el.dataset.key===view));}

/* ---- controls ---- */
const qInput=document.getElementById('q');
qInput.addEventListener('input',()=>{query=qInput.value.trim().toLowerCase();render();});
document.getElementById('sortSel').onchange=e=>{sortBy=e.target.value;render();};
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qInput){e.preventDefault();qInput.focus();}
  if(e.key==='Escape'){qInput.value='';query='';render();qInput.blur();}
});
const side=document.getElementById('side');
document.getElementById('menuBtn').onclick=()=>side.classList.toggle('show');
function closeSide(){side.classList.remove('show');}

/* ---- helpers ---- */
function esc(t){return(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(t){t=esc(t);if(!query)return t;try{const r=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return t.replace(r,'<mark>$1</mark>');}catch(e){return t;}}
function hhmm(p){if(!p)return'--:--';const m=String(p).match(/T(\d{2}:\d{2})/)||String(p).match(/(\d{2}:\d{2})/);return m?m[1]:'--:--';}

/* ---- render ---- */
const content=document.getElementById('content');
const TITLES={star:['精选','相关性高的 AI 与行业动态（评分 ≥ '+STAR_MIN+'）'],all:['全部动态','按时间倒序的所有抓取条目']};
function render(){
  sync();
  if(view==='about'){renderAbout();return;}
  let rows=DATA.slice();
  if(view==='star') rows=rows.filter(d=>(d.score||0)>=STAR_MIN);
  else if(view.startsWith('cat:')) rows=rows.filter(d=>d.category===view.slice(4));
  if(query) rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')+' '+(d.author||'')).toLowerCase().includes(query));

  // titles
  let t,s;
  if(view==='star'){[t,s]=TITLES.star;}
  else if(view==='all'){[t,s]=TITLES.all;}
  else {t=view.slice(4);s='方向：'+t;}
  document.getElementById('ttl').textContent=t;
  document.getElementById('sub').textContent=s+'　·　'+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');

  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的内容，换个关键词或方向试试。</div>';return;}

  // lead (only on star/all, no query)
  let leadHtml='';
  if((view==='star'||view==='all')&&!query){
    const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
    const pool=(rows.filter(d=>d.date===latest).length?rows.filter(d=>d.date===latest):rows);
    const lead=pool.slice().sort((a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''))[0];
    const p=parseSummary(lead.summary);
    leadHtml=`<div class="lead"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(p,'中文标题')||lead.title)}</div>
      <div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)} · 来源 ${esc(lead.source||'—')}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  }

  // group by date
  const groups={};
  rows.forEach(d=>{(groups[d.date||'未注明']=groups[d.date||'未注明']||[]).push(d);});
  const order=Object.keys(groups).sort().reverse();

  const useScore = sortBy==='score' || (sortBy==='auto' && view==='star');
  const cmp = useScore
            ? (a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||'')
            : (a,b)=>(b.published||'').localeCompare(a.published||'');

  let html=leadHtml;
  order.forEach(date=>{
    const items=groups[date].sort(cmp);
    html+=`<div class="daterow"><span class="d">${esc(fmtDate(date))}</span><span class="ln"></span></div>`;
    html+=items.map(renderEntry).join('');
  });
  content.innerHTML=html;
  content.querySelectorAll('.more').forEach(m=>m.onclick=()=>m.closest('.entry').classList.toggle('open'));
}
function fmtDate(d){const m=/(\d{4})-(\d{2})-(\d{2})/.exec(d);return m?`${+m[2]}月${+m[3]}日 · ${m[1]}`:d;}

function renderEntry(d){
  const ci=cats.indexOf(d.category), [bg,fg]=tint(d.category,ci);
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话')||(d.summary?'':'（无摘要）');
  const detail=PICK(p,'详细讲给你听','详细'), terms=PICK(p,'关键术语小词典','关键术语'),
        useful=PICK(p,'对你有啥用'), dig=PICK(p,'想深入可以搜'), spoken=PICK(p,'口播版');
  const hasDetail=detail||terms||useful||dig||spoken;
  return `<div class="entry">
    <div class="time">${hhmm(d.published)}</div>
    <div class="col">
      <div class="topline">
        <div class="srcmeta">${d.source?`<span class="b">${hl(d.source)}</span>`:''}${d.author?`<span>${esc(String(d.author).slice(0,42))}</span>`:''}</div>
        <div class="pills">
          <span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span>
          ${d.score?`<span class="heat"><svg viewBox="0 0 24 24"><path d="M12 2s5 4 5 9a5 5 0 01-10 0c0-1 .3-2 .8-2.8C8 9 9 8 9 8s-.3 2 .7 2.8C10 9 12 6 12 6s-1 3 .5 4.2C13 9 13 7 13 7s2 2 2 4a3 3 0 01-6 0"/></svg>${d.score}</span>`:''}
        </div>
      </div>
      <h3><a href="${esc(d.url)}" target="_blank" rel="noopener">${hl(title)}</a></h3>
      <div class="teaser">${hl(teaser)}</div>
      ${hasDetail?`<div class="more">展开 <svg viewBox="0 0 24 24"><path d="M12 15l-6-6h12z"/></svg></div>`:''}
      <div class="detail">
        ${detail?sec('详细',detail):''}${terms?sec('关键术语',terms):''}
        ${useful?sec('对你有啥用',useful,'use'):''}${dig?sec('想深入可以搜',dig):''}
        ${spoken?sec('口播版',spoken):''}
        <div class="sec link"><a href="${esc(d.url)}" target="_blank" rel="noopener">↗ 看原文</a></div>
      </div>
    </div></div>`;
}
function sec(l,v,c){return `<div class="sec ${c||''}"><div class="lbl">${esc(l)}</div><div class="val">${hl(v)}</div></div>`;}

function renderAbout(){
  document.getElementById('ttl').textContent='关于';
  document.getElementById('sub').textContent='本地情报流 · 数据来自 web-intel-bot';
  document.getElementById('tools').style.display='none';
  content.innerHTML=`<div class="about">
    <p>这是一个 <b>本地、自包含</b> 的情报阅读器：把 web-intel-bot 抓取并由 AI 摘要打分后的 <code>items.json</code> 全部焊进这一个 HTML 文件，<b>双击即开，无需服务器</b>。</p>
    <p>形式参考了 <b>aihot</b>：左侧栏导航 + 时间线 feed + 相关性热度。但数据是你自己的三方向（供应链 / 生物 / 心理）+ AI 与世界动态，且<b>不公开、不上数据库、不部署</b>。</p>
    <p>刷新数据：bot 每天跑完后运行 <code>python feed_build.py</code>，或双击 <code>看情报流.bat</code>。</p>
    <p style="color:var(--dim)">当前共 ${DATA.length} 条 / ${dates.length} 天 / ${cats.length} 个方向${GEN?('，更新于 '+GEN):''}。</p>
  </div>`;
}
document.getElementById('q').addEventListener('focus',()=>{document.getElementById('tools').style.display='';});

render();
</script>
</body>
</html>
