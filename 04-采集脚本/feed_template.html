<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 情报流 · web-intel-bot</title>
<style>
  :root{
    --bg:#ffffff; --side:#fbfcfd; --hover:#f5f7f9; --line:#edeff3; --line2:#f4f6f8;
    --txt:#1d2330; --txt2:#3b4252; --dim:#6b7280; --dim2:#9aa3b2;
    --accent:#e0822f; --accent-d:#b25e16; --accent-soft:#fdf3e8;
    --flame:#e0822f; --chip:#f3f4f6;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0e16; --side:#0d1120; --hover:#141a2c; --line:#1c2236; --line2:#161b2a;
      --txt:#e8ecf6; --txt2:#c2cadb; --dim:#8b94ab; --dim2:#5f6987;
      --accent:#f0a04b; --accent-d:#f0a04b; --accent-soft:#2a1c0f; --chip:#161c2e;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-size:15.5px;line-height:1.62}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  /* 来源头像 */
  .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;flex:0 0 auto;width:26px;height:26px;font-size:11px;line-height:1}
  .av.sm{width:21px;height:21px;font-size:9.5px}
  .av.lg{width:36px;height:36px;font-size:14px}
  /* 相关性分数徽标 */
  .sb{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--accent-d);background:var(--accent-soft);border-radius:6px;padding:1.5px 7px 1.5px 5px;line-height:1.5;flex:0 0 auto}
  .sb svg{width:11px;height:11px;fill:var(--accent-d)}
  .sb.lg{font-size:13px;padding:3px 9px 3px 7px}
  .sb.lg svg{width:13px;height:13px}

  /* ---- sidebar ---- */
  .side{width:216px;flex:0 0 216px;background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px;display:flex;flex-direction:column}
  /* ---- Apple 风报头 ---- */
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px;margin-bottom:2px}
  .mk{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:linear-gradient(140deg,#f4a553,#df7d27);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px rgba(220,125,39,.32)}
  .mk svg{width:18px;height:18px;display:block}
  .bn{display:flex;flex-direction:column;line-height:1.1}
  .bn .cn{font-size:18.5px;font-weight:680;letter-spacing:-.4px;color:var(--txt)}
  .bn .en{font-size:9.5px;font-weight:600;letter-spacing:2.4px;color:var(--dim2);margin-top:3px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--dim);font-size:14.5px;font-weight:500;user-select:none;transition:.12s}
  .item:hover{background:var(--hover);color:var(--txt2)}
  .item.on{background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .item .ic{width:16px;text-align:center;font-size:14px}
  .item .ct{margin-left:auto;font-size:11px;color:var(--dim2);font-weight:600}
  .item.on .ct{color:var(--accent-d)}
  .item.sub{font-size:12.5px;padding:5px 10px 5px 30px;color:var(--dim2)}
  .item.sub.on{background:transparent;color:var(--accent-d);font-weight:700}
  .item.sub .dotc{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .label{font-size:10.5px;color:var(--dim2);font-weight:700;letter-spacing:.6px;padding:12px 10px 3px}
  .sep{height:1px;background:var(--line);margin:9px 6px}
  .foot{margin-top:auto;padding:12px 10px 2px;color:var(--dim2);font-size:11px;line-height:1.5}

  /* ---- main ---- */
  .main{flex:1;min-width:0;max-width:1700px;margin:0 auto;padding:26px 56px 90px;width:100%}
  .menu-btn{display:none}
  h1{font-size:27px;font-weight:800;margin:0 0 3px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--side);border:1px solid var(--line);border-radius:11px;padding:8px 12px}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search input{flex:1;border:none;background:none;outline:none;color:var(--txt);font-size:13.5px}
  .search svg{width:15px;height:15px;fill:var(--dim2)}
  .search kbd{font-size:10.5px;color:var(--dim2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .sortsel{background:var(--side);color:var(--txt2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:none;cursor:pointer}

  .lead{display:flex;gap:11px;align-items:flex-start;background:linear-gradient(110deg,var(--accent-soft),transparent 72%);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:12px 15px;margin-bottom:18px;cursor:pointer}
  .lead:hover{border-left-color:var(--accent-d)}
  .lead .bolt{color:var(--accent-d);font-size:14px;margin-top:2px}
  .lead .t{font-weight:700;font-size:17px;line-height:1.45}
  .lead .m{color:var(--dim);font-size:12.5px;margin-top:3px}

  .daterow{display:flex;align-items:center;gap:12px;margin:18px 0 4px}
  .daterow:first-child{margin-top:2px}
  .daterow .d{font-size:12px;color:var(--dim2);font-weight:700}
  .daterow .ln{flex:1;height:1px;background:var(--line2)}

  /* ---- feed row · 时间线 + 紧凑 ---- */
  .daygroup{position:relative}
  .row{display:flex;cursor:pointer}
  .row:hover .col{background:var(--hover)}
  .row .time{flex:0 0 44px;text-align:right;color:var(--dim2);font-size:12px;font-variant-numeric:tabular-nums;padding:14px 0 0}
  .row .col{flex:1;min-width:0;margin-left:13px;padding:13px 14px 15px 22px;border-left:2px solid var(--line2);border-radius:0 9px 9px 0;position:relative}
  .row .col::before{content:'';position:absolute;left:-6px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--dotc,var(--dim2))}
  .row:hover .col::before{background:var(--hover)}
  .row .meta{display:flex;align-items:center;gap:7px;margin-bottom:3px;font-size:12.5px}
  .row .src{color:var(--txt2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;max-width:40%}
  .row .au{color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  .row .right{margin-left:auto;display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .heat{display:flex;align-items:center;gap:3px;color:var(--flame);font-weight:800;font-size:12px}
  .heat svg{width:11px;height:11px;fill:var(--flame)}
  .row h3{font-size:16.5px;font-weight:700;margin:2px 0 4px;line-height:1.45}
  .row .teaser{color:var(--dim);font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---- 精选：分版块精华（克制用色 + 头条层级）---- */
  .feat-sec{margin:28px 0 10px}
  .feat-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .feat-ic{font-size:18px}
  .feat-name{font-size:17px;font-weight:800}
  .feat-count{font-size:12px;color:var(--dim2);font-weight:600}
  .feat-more{margin-left:auto;font-size:13px;color:var(--accent-d);cursor:pointer;font-weight:600}
  .feat-more:hover{text-decoration:underline}
  /* 头条：每版块第一条，放大当重点 */
  .feat-lead{cursor:pointer;padding:2px 0 16px;margin-bottom:10px;border-bottom:1px dashed var(--line)}
  .fl-title{font-size:20px;font-weight:800;line-height:1.4;margin:0 0 6px}
  .feat-lead:hover .fl-title{color:var(--accent-d)}
  .fl-teaser{font-size:15px;color:var(--txt2);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fl-meta{font-size:12.5px;color:var(--dim2);margin-top:11px;display:flex;align-items:center;gap:9px}
  /* 其余：紧凑双列，灰，无彩标签，左侧来源头像当落点 */
  .feat-items{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
  .frow{display:flex;gap:11px;padding:10px 8px;border-radius:9px;cursor:pointer;align-items:flex-start}
  .frow:hover{background:var(--hover)}
  .frow .av{margin-top:1px}
  .fcol{min-width:0;flex:1}
  .frow h4{font-size:15px;font-weight:600;line-height:1.46;margin:0 0 2px;color:var(--txt)}
  .frow:hover h4{color:var(--accent-d)}
  .fmeta{font-size:11.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{text-align:center;color:var(--dim2);padding:70px 0}
  mark{background:#ffe9a8;color:#7a5b00;border-radius:3px;padding:0 1px}
  @media (prefers-color-scheme:dark){mark{background:#5b4a1f;color:#ffe9a8}}

  /* ---- reading drawer ---- */
  .backdrop{position:fixed;inset:0;background:#0b1020;opacity:0;visibility:hidden;transition:.18s;z-index:40}
  .backdrop.show{opacity:.42;visibility:visible}
  .reader{position:fixed;top:0;right:0;width:560px;max-width:94vw;height:100vh;background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 40px #0002;transform:translateX(100%);transition:.22s cubic-bezier(.4,0,.2,1);z-index:41;overflow:auto}
  .reader.open{transform:none}
  .reader .rhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:10px;z-index:2}
  .reader .rhead .x{cursor:pointer;font-size:20px;color:var(--dim);line-height:1;padding:2px 6px;border-radius:8px}
  .reader .rhead .x:hover{background:var(--hover);color:var(--txt)}
  .reader .rhead .rmeta{font-size:11.5px;color:var(--dim2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .reader .rbody{padding:20px 26px 60px}
  .reader h2{font-size:21px;font-weight:800;line-height:1.4;margin:4px 0 10px}
  .lede{font-size:19px;color:var(--txt2);line-height:1.78;border-left:3px solid var(--accent);padding-left:16px;margin:10px 0 26px}
  /* ---- 详情整页 ---- */
  .article{max-width:1000px;margin:2px auto 0}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--accent-d);font-size:15px;font-weight:600;cursor:pointer;margin-bottom:20px}
  .backlink:hover{text-decoration:underline}
  .amenu{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim);margin-bottom:14px;flex-wrap:wrap}
  .atitle{font-size:32px;font-weight:800;line-height:1.38;margin:2px 0 10px}
  .rsec{margin:24px 0}
  .rsec .lbl{font-size:12.5px;font-weight:800;color:var(--accent-d);letter-spacing:.6px;margin-bottom:8px;text-transform:uppercase}
  .rsec .val{color:var(--txt2);font-size:16.5px;line-height:1.85;white-space:pre-wrap}
  .rsec.use{padding:18px 20px}
  .rsec.use{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
  .rsec.use .lbl{color:var(--accent-d)}
  .rlinks{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--line);color:var(--txt2);cursor:pointer}
  .btn.pri{background:var(--accent);color:#fff;border-color:transparent}
  .btn:hover{background:var(--hover)}
  .btn.pri:hover{background:var(--accent-d)}
  .spoken-t{margin-top:18px;font-size:12.5px;color:var(--accent-d);cursor:pointer;user-select:none}
  .spoken{display:none;margin-top:8px}
  .spoken.show{display:block}

  .about{color:var(--txt2);font-size:14px;line-height:1.85}
  .about code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:13px}
  .about b{color:var(--txt)}

  @media (max-width:760px){
    .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.2s;z-index:50;box-shadow:0 0 40px #0003}
    .side.show{transform:none}
    .main{padding:16px 16px 80px}
    .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--side);margin-bottom:12px;cursor:pointer;font-size:16px}
    .feat-items{grid-template-columns:1fr}
    .article{max-width:none}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mk"><svg viewBox="0 0 24 24" fill="none"><path d="M4 15.5l4.5-5 3.5 3.5L20 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="6" r="2.2" fill="#fff"/></svg></span><span class="bn"><span class="cn">情报流</span><span class="en">DAILY INTEL</span></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="menu-btn" id="menuBtn">☰</div>
    <h1 id="ttl">精选</h1>
    <div class="sub" id="sub"></div>
    <div class="tools" id="tools">
      <label class="search">
        <svg viewBox="0 0 24 24"><path d="M21 20l-5.6-5.6a7 7 0 10-1.4 1.4L20 21zM5 10a5 5 0 1110 0 5 5 0 01-10 0z"/></svg>
        <input id="q" type="text" placeholder="搜标题 / 摘要 / 来源…" autocomplete="off"><kbd>/</kbd>
      </label>
      <select class="sortsel" id="sortSel"><option value="auto">默认排序</option><option value="score">按相关性</option><option value="date">按时间</option></select>
    </div>
    <div id="content"></div>
  </main>
</div>


<script>
const DATA = __FEED_DATA__;
const GEN  = "__GEN_TIME__";

/* ---- 把 bot 的乱话题桶归成 3 个干净领域（卡片上仍保留精确分类）---- */
const GROUPS=[
  {key:'g-ai',  label:'AI · 技术', ic:'🤖', cats:['AI大事','技术圈','GitHub 动态','GitHub动态']},
  {key:'g-ind', label:'行业 · 世界', ic:'🌐', cats:['供应链','世界时事']},
  {key:'g-mind',label:'认知 · 个人', ic:'🧠', cats:['心理学','生物学','变现路径','变现路线']},
];
const TINT={
  "AI大事":["#e6f7f4","#0a8f7e"],"技术圈":["#ede9ff","#6d49d6"],"GitHub 动态":["#e7f6ec","#1f9d57"],"GitHub动态":["#e7f6ec","#1f9d57"],
  "世界时事":["#ffeaec","#d6455a"],"供应链":["#fff2dd","#b97a12"],"生物学":["#e3f6fb","#0e8aa8"],
  "心理学":["#f0eaff","#7a52d8"],"变现路径":["#ffe9f3","#cc3f86"],"变现路线":["#ffe9f3","#cc3f86"]
};
const FB=[["#e6f7f4","#0a8f7e"],["#ede9ff","#6d49d6"],["#fff2dd","#b97a12"],["#ffeaec","#d6455a"],["#e3f6fb","#0e8aa8"],["#f0eaff","#7a52d8"]];
const allCats=[...new Set(DATA.map(d=>d.category))];
function tint(c){return TINT[c]||FB[allCats.indexOf(c)%FB.length];}
function groupOf(cat){for(const g of GROUPS)if(g.cats.includes(cat))return g.key;return 'g-other';}
// 把未归类的塞进「其他」
const known=new Set(GROUPS.flatMap(g=>g.cats));
const others=allCats.filter(c=>!known.has(c));
const GROUPS2=others.length?[...GROUPS,{key:'g-other',label:'其他',ic:'#',cats:others}]:GROUPS;

function parseSummary(s){const o={};if(!s)return o;const re=/【([^】]+)】([\s\S]*?)(?=【[^】]+】|$)/g;let m;while((m=re.exec(s))!==null)o[m[1].trim()]=m[2].trim();return o;}
const PICK=(o,...k)=>{for(const x of k)if(o[x])return o[x];return"";};
const dates=[...new Set(DATA.map(d=>d.date).filter(Boolean))].sort().reverse();
const STAR=7;

let view='star',sortBy='auto',query='';

/* ---- sidebar ---- */
const nav=document.getElementById('nav');
function item(key,ic,label,count,sub,color){
  const el=document.createElement('div');
  el.className='item'+(sub?' sub':'');el.dataset.key=key;
  const dot=color?`<span class="dotc" style="background:${color}"></span>`:`<span class="ic">${ic}</span>`;
  el.innerHTML=dot+`<span>${label}</span>`+(count!=null?`<span class="ct">${count}</span>`:'');
  el.onclick=()=>{view=key;closeSide();render();};
  return el;
}
function cnt(fn){return DATA.filter(fn).length;}
nav.appendChild(item('star','★','精选',cnt(d=>(d.score||0)>=STAR)));
nav.appendChild(item('all','◷','全部动态',DATA.length));
const lb=document.createElement('div');lb.className='label';lb.textContent='领域';nav.appendChild(lb);
GROUPS2.forEach(g=>{
  const gcats=g.cats.filter(c=>allCats.includes(c));
  if(!gcats.length && g.key!=='g-other')return;
  nav.appendChild(item('group:'+g.key,g.ic,g.label,cnt(d=>gcats.includes(d.category))));
  gcats.forEach(c=>nav.appendChild(item('cat:'+c,'',c,cnt(d=>d.category===c),true,tint(c)[1])));
});
const sp=document.createElement('div');sp.className='sep';nav.appendChild(sp);
nav.appendChild(item('about','ⓘ','关于'));
document.getElementById('foot').innerHTML=(GEN?('更新于 '+GEN+'<br>'):'')+DATA.length+' 条 · '+dates.length+' 天';

/* ---- controls ---- */
const qI=document.getElementById('q');
qI.addEventListener('input',()=>{query=qI.value.trim().toLowerCase();render();});
document.getElementById('sortSel').onchange=e=>{sortBy=e.target.value;render();};
const side=document.getElementById('side');
document.getElementById('menuBtn').onclick=()=>side.classList.toggle('show');
function closeSide(){side.classList.remove('show');}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qI){e.preventDefault();qI.focus();}
  if(e.key==='Escape'){if(String(view).startsWith('item:')){view=prevView;render();}else{qI.value='';query='';render();qI.blur();}}
});

function esc(t){return(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(t){t=esc(t);if(!query)return t;try{const r=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return t.replace(r,'<mark>$1</mark>');}catch(e){return t;}}
function hhmm(p){const m=String(p||'').match(/T(\d{2}:\d{2})/)||String(p||'').match(/\b(\d{2}:\d{2})\b/);return m?m[1]:'';}
function fmtDate(d){const m=/(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${+m[2]}月${+m[3]}日 · ${m[1]}`:(d||'');}
/* 来源头像：按来源名确定性配柔和色 + 取首字 */
const AV=[['#fdebd6','#b25e16'],['#e4edfb','#3560a8'],['#e5f4ec','#1f7a4d'],['#efe8fb','#6b46c1'],['#fde7ef','#bd3b6e'],['#e2f2f5','#0e7490'],['#f1ece2','#7d6a44']];
function avatar(d,cls){
  const s=String(d.source||d.author||'·').trim();
  let ini;
  if(/^[A-Za-z]/.test(s)) ini=(s.match(/[A-Za-z]+/)[0]).slice(0,2).toUpperCase();
  else{const c=s.match(/[一-龥]/);ini=c?c[0]:s.slice(0,2);}
  let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  const [bg,fg]=AV[h%AV.length];
  return `<span class="av ${cls||''}" style="background:${bg};color:${fg}">${esc(ini)}</span>`;
}
/* 相关性分数徽标（琥珀色，醒目但不抢戏）*/
function scoreBadge(d,cls){
  if(!d.score)return '';
  return `<span class="sb ${cls||''}"><svg viewBox="0 0 24 24"><path d="M13 2L4.5 13h6l-1 9L19 11h-6z"/></svg>${d.score}</span>`;
}

/* ---- reading drawer ---- */
let idIndex={}, prevView='star';
function openItem(uid){
  if(!String(view).startsWith('item:')) prevView=view;
  view='item:'+uid; render();
  try{window.scrollTo(0,0);}catch(e){}
}
function rsec(l,v,c){return `<div class="rsec ${c||''}"><div class="lbl">${esc(l)}</div><div class="val">${esc(v)}</div></div>`;}
function renderItem(uid){
  const d=idIndex[uid];
  if(!d){view=prevView;return render();}
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const detail=PICK(p,'详细讲给你听','详细'),terms=PICK(p,'关键术语小词典','关键术语'),useful=PICK(p,'对你有啥用'),dig=PICK(p,'想深入可以搜'),spoken=PICK(p,'口播版'),one=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  const heat=d.score?`<span class="heat"><svg viewBox="0 0 24 24"><path d="M12 2s5 4 5 9a5 5 0 01-10 0c0-1 .3-2 .8-2.8C8 9 9 8 9 8s-.3 2 .7 2.8C10 9 12 6 12 6s-1 3 .5 4.2C13 9 13 7 13 7s2 2 2 4a3 3 0 01-6 0"/></svg>${d.score}</span>`:'';
  let h=`<div class="article"><div class="backlink" id="backlink">← 返回</div>`;
  h+=`<div class="amenu">${avatar(d,'lg')}<span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span><span>${esc(d.source||'')}</span>${d.author?`<span>· ${esc(d.author)}</span>`:''}<span>· ${esc((d.published||d.date||'').replace('T',' ').slice(0,16))}</span>${scoreBadge(d,'lg')}</div>`;
  h+=`<h2 class="atitle">${esc(PICK(p,'中文标题')||d.title)}</h2>`;
  if(one)h+=`<div class="lede">${esc(one)}</div>`;
  if(detail)h+=rsec('详细',detail);
  if(terms)h+=rsec('关键术语',terms);
  if(useful)h+=rsec('对你有啥用',useful,'use');
  if(dig)h+=rsec('想深入可以搜',dig);
  h+=`<div class="rlinks"><a class="btn pri" href="${esc(d.url)}" target="_blank" rel="noopener">↗ 看原文</a>`;
  if(spoken)h+=`<span class="btn" id="spokenBtn">🎧 口播版</span>`;
  h+=`</div>`;
  if(spoken)h+=`<div class="spoken rsec" id="spokenBox"><div class="lbl">口播版</div><div class="val">${esc(spoken)}</div></div>`;
  h+=`</div>`;
  content.innerHTML=h;
  document.getElementById('backlink').onclick=()=>{view=prevView;render();};
  const sb=document.getElementById('spokenBtn');if(sb)sb.onclick=()=>document.getElementById('spokenBox').classList.toggle('show');
}

/* ---- 精选：按领域分版块的精华（不是时间流）---- */
function featLead(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="feat-lead" data-uid="${d._uid}">
    <div class="fl-title">${hl(title)}</div>
    ${teaser?`<div class="fl-teaser">${hl(teaser)}</div>`:''}
    <div class="fl-meta">${avatar(d)}<span>${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</span>${scoreBadge(d)}</div>
  </div>`;
}
function featRow(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  return `<div class="frow" data-uid="${d._uid}">
    ${avatar(d,'sm')}
    <div class="fcol"><h4>${hl(title)}</h4><div class="fmeta">${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</div></div>
    ${scoreBadge(d)}
  </div>`;
}
function renderFeatured(){
  document.getElementById('ttl').textContent='精选';
  let rows=DATA.filter(d=>(d.score||0)>=STAR);
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));
  document.getElementById('sub').textContent='各领域最值得看的 · '+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  idIndex={};rows.forEach((d,i)=>{d._uid='f'+i;idIndex['f'+i]=d;});
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的精选，换个关键词试试。</div>';return;}
  const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
  const pool=rows.filter(d=>d.date===latest);
  const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
  const lp=parseSummary(lead.summary);
  let html=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(lp,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  const K=7;  // 1 头条 + 6 紧凑
  GROUPS2.forEach(g=>{
    const items=rows.filter(d=>g.cats.includes(d.category)).sort((a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''));
    if(!items.length)return;
    html+=`<div class="feat-sec"><div class="feat-head"><span class="feat-ic">${g.ic}</span><span class="feat-name">${esc(g.label)}</span><span class="feat-count">${items.length} 条</span>`+
      (items.length>K?`<span class="feat-more" data-go="group:${g.key}">查看全部 →</span>`:'')+
      `</div>`+featLead(items[0]);
    const rest=items.slice(1,K);
    if(rest.length)html+=`<div class="feat-items">`+rest.map(featRow).join('')+`</div>`;
    html+=`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-go]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();view=el.dataset.go;render();try{window.scrollTo(0,0);}catch(x){}});
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}

/* ---- render ---- */
const content=document.getElementById('content');
function render(){
  nav.querySelectorAll('.item').forEach(el=>el.classList.toggle('on',el.dataset.key===view));
  const isItem=String(view).startsWith('item:');
  document.getElementById('tools').style.display=(view==='about'||isItem)?'none':'';
  document.getElementById('ttl').style.display=isItem?'none':'';
  document.getElementById('sub').style.display=isItem?'none':'';
  // 精选按版块固定排（领域 + 相关性），排序选择器在这页无意义 → 隐藏（搜索保留）
  document.getElementById('sortSel').style.display=(view==='star')?'none':'';
  if(isItem)return renderItem(view.slice(5));
  if(view==='about')return renderAbout();
  if(view==='star')return renderFeatured();

  let rows=DATA.slice();let t='精选',s='相关性高的动态（评分 ≥ '+STAR+'）';
  if(view==='star'){rows=rows.filter(d=>(d.score||0)>=STAR);}
  else if(view==='all'){t='全部动态';s='按时间倒序的所有抓取条目';}
  else if(view.startsWith('group:')){const g=GROUPS2.find(x=>x.key===view.slice(6));const cs=g?g.cats:[];rows=rows.filter(d=>cs.includes(d.category));t=g?g.label:'领域';s='领域聚合 · '+(g?g.cats.filter(c=>allCats.includes(c)).join(' / '):'');}
  else if(view.startsWith('cat:')){const c=view.slice(4);rows=rows.filter(d=>d.category===c);t=c;s='方向：'+c;}
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));

  document.getElementById('ttl').textContent=t;
  document.getElementById('sub').textContent=s+'　·　'+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的内容，换个关键词或领域试试。</div>';return;}

  // index for reader
  idIndex={};rows.forEach((d,i)=>{d._uid='u'+i;idIndex['u'+i]=d;});

  let leadHtml='';
  if((view==='star'||view==='all')&&!query){
    const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
    const pool=rows.filter(d=>d.date===latest);const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
    const p=parseSummary(lead.summary);
    leadHtml=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(p,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  }
  const useScore=sortBy==='score'||(sortBy==='auto'&&view==='star');
  const cmp=useScore?(a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''):(a,b)=>(b.published||'').localeCompare(a.published||'');

  const groups={};rows.forEach(d=>{(groups[d.date||'未注明']=groups[d.date||'未注明']||[]).push(d);});
  let html=leadHtml;
  Object.keys(groups).sort().reverse().forEach(date=>{
    html+=`<div class="daterow"><span class="d">${esc(fmtDate(date))}</span><span class="ln"></span></div>`;
    html+=`<div class="daygroup">`+groups[date].sort(cmp).map(rowHtml).join('')+`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}
function rowHtml(d){
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="row" data-uid="${d._uid}">
    <div class="time">${hhmm(d.published)}</div>
    <div class="col">
      <div class="meta">
        ${avatar(d,'sm')}
        <span class="src">${hl(d.source||'')}</span>
        ${d.author?`<span class="au">${hl(d.author)}</span>`:''}
        <span class="right">
          <span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span>
          ${scoreBadge(d)}
        </span>
      </div>
      <h3>${hl(title)}</h3>
      ${teaser?`<div class="teaser">${hl(teaser)}</div>`:''}
    </div></div>`;
}
function renderAbout(){
  document.getElementById('ttl').textContent='关于';document.getElementById('sub').textContent='本地情报流 · 数据来自 web-intel-bot';
  content.innerHTML=`<div class="about">
  <p>把 web-intel-bot 抓取并 AI 摘要打分后的内容，做成一个 <b>能翻、能筛、能搜</b> 的情报流。形式参考 aihot，但数据是你自己的。</p>
  <p><b>怎么读不累：</b>列表只给标题 + 一句话，点任意一条 → 右侧滑出阅读面板看全文（详细 / 术语 / 对你有啥用 / 口播版）。列表永远清爽。</p>
  <p><b>分类：</b>bot 的话题桶归成 3 个领域（AI·技术 / 行业·世界 / 认知·个人），卡片上仍保留精确分类。</p>
  <p>刷新：<code>python feed_build.py</code> 或双击 <code>看情报流.bat</code>。</p>
  <p style="color:var(--dim)">共 ${DATA.length} 条 / ${dates.length} 天 / ${allCats.length} 个方向${GEN?('，更新于 '+GEN):''}。</p></div>`;
}
render();
</script>
