  const el=document.createElement('div');
  el.className='item'+(sub?' sub':'');el.dataset.key=key;
  const dot=color?`<span class="dotc" style="background:${color}"></span>`:`<span class="ic">${ic}</span>`;
  el.innerHTML=dot+`<span>${label}</span>`+(count!=null?`<span class="ct">${count}</span>`:'');
  el.onclick=()=>{view=key;closeSide();render();};
  return el;
}
function cnt(fn){return DATA.filter(fn).length;}
nav.appendChild(item('star','★','精选',cnt(d=>(d.score||0)>=STAR)));
nav.appendChild(item('all','◷','全部动态',DATA.length));
const lb=document.createElement('div');lb.className='label';lb.textContent='领域';nav.appendChild(lb);
GROUPS2.forEach(g=>{
  const gcats=g.cats.filter(c=>allCats.includes(c));
  if(!gcats.length && g.key!=='g-other')return;
  nav.appendChild(item('group:'+g.key,g.ic,g.label,cnt(d=>gcats.includes(d.category))));
  gcats.forEach(c=>nav.appendChild(item('cat:'+c,'',c,cnt(d=>d.category===c),true,tint(c)[1])));
});
const sp=document.createElement('div');sp.className='sep';nav.appendChild(sp);
nav.appendChild(item('about','ⓘ','关于'));
document.getElementById('foot').innerHTML=(GEN?('更新于 '+GEN+'<br>'):'')+DATA.length+' 条 · '+dates.length+' 天';

/* ---- controls ---- */
const qI=document.getElementById('q');
qI.addEventListener('input',()=>{query=qI.value.trim().toLowerCase();render();});
document.getElementById('sortSel').onchange=e=>{sortBy=e.target.value;render();};
const side=document.getElementById('side');
document.getElementById('menuBtn').onclick=()=>side.classList.toggle('show');
function closeSide(){side.classList.remove('show');}
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qI){e.preventDefault();qI.focus();}
  if(e.key==='Escape'){if(String(view).startsWith('item:')){view=prevView;render();}else{qI.value='';query='';render();qI.blur();}}
});

function esc(t){return(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(t){t=esc(t);if(!query)return t;try{const r=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return t.replace(r,'<mark>$1</mark>');}catch(e){return t;}}
function hhmm(p){const m=String(p||'').match(/T(\d{2}:\d{2})/)||String(p||'').match(/\b(\d{2}:\d{2})\b/);return m?m[1]:'';}
function fmtDate(d){const m=/(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${+m[2]}月${+m[3]}日 · ${m[1]}`:(d||'');}
/* 来源头像：按来源名确定性配柔和色 + 取首字 */
const AV=[['#fdebd6','#b25e16'],['#e4edfb','#3560a8'],['#e5f4ec','#1f7a4d'],['#efe8fb','#6b46c1'],['#fde7ef','#bd3b6e'],['#e2f2f5','#0e7490'],['#f1ece2','#7d6a44']];
function avatar(d,cls){
  const s=String(d.source||d.author||'·').trim();
  let ini;
  if(/^[A-Za-z]/.test(s)) ini=(s.match(/[A-Za-z]+/)[0]).slice(0,2).toUpperCase();
  else{const c=s.match(/[一-龥]/);ini=c?c[0]:s.slice(0,2);}
  let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  const [bg,fg]=AV[h%AV.length];
  return `<span class="av ${cls||''}" style="background:${bg};color:${fg}">${esc(ini)}</span>`;
}
/* 相关性分数徽标（琥珀色，醒目但不抢戏）*/
function scoreBadge(d,cls){
  if(!d.score)return '';
  return `<span class="sb ${cls||''}"><svg viewBox="0 0 24 24"><path d="M13 2L4.5 13h6l-1 9L19 11h-6z"/></svg>${d.score}</span>`;
}

/* ---- reading drawer ---- */
let idIndex={}, prevView='star';
function openItem(uid){
  if(!String(view).startsWith('item:')) prevView=view;
  view='item:'+uid; render();
  try{window.scrollTo(0,0);}catch(e){}
}
function rsec(l,v,c){return `<div class="rsec ${c||''}"><div class="lbl">${esc(l)}</div><div class="val">${esc(v)}</div></div>`;}
function renderItem(uid){
  const d=idIndex[uid];
  if(!d){view=prevView;return render();}
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const detail=PICK(p,'详细讲给你听','详细'),terms=PICK(p,'关键术语小词典','关键术语'),useful=PICK(p,'对你有啥用'),dig=PICK(p,'想深入可以搜'),spoken=PICK(p,'口播版'),one=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  const heat=d.score?`<span class="heat"><svg viewBox="0 0 24 24"><path d="M12 2s5 4 5 9a5 5 0 01-10 0c0-1 .3-2 .8-2.8C8 9 9 8 9 8s-.3 2 .7 2.8C10 9 12 6 12 6s-1 3 .5 4.2C13 9 13 7 13 7s2 2 2 4a3 3 0 01-6 0"/></svg>${d.score}</span>`:'';
  let h=`<div class="article"><div class="backlink" id="backlink">← 返回</div>`;
  h+=`<div class="amenu">${avatar(d,'lg')}<span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span><span>${esc(d.source||'')}</span>${d.author?`<span>· ${esc(d.author)}</span>`:''}<span>· ${esc((d.published||d.date||'').replace('T',' ').slice(0,16))}</span>${scoreBadge(d,'lg')}</div>`;
  h+=`<h2 class="atitle">${esc(PICK(p,'中文标题')||d.title)}</h2>`;
  if(one)h+=`<div class="lede">${esc(one)}</div>`;
  if(detail)h+=rsec('详细',detail);
  if(terms)h+=rsec('关键术语',terms);
  if(useful)h+=rsec('对你有啥用',useful,'use');
  if(dig)h+=rsec('想深入可以搜',dig);
  h+=`<div class="rlinks"><a class="btn pri" href="${esc(d.url)}" target="_blank" rel="noopener">↗ 看原文</a>`;
  if(spoken)h+=`<span class="btn" id="spokenBtn">🎧 口播版</span>`;
  h+=`</div>`;
  if(spoken)h+=`<div class="spoken rsec" id="spokenBox"><div class="lbl">口播版</div><div class="val">${esc(spoken)}</div></div>`;
  h+=`</div>`;
  content.innerHTML=h;
  document.getElementById('backlink').onclick=()=>{view=prevView;render();};
  const sb=document.getElementById('spokenBtn');if(sb)sb.onclick=()=>document.getElementById('spokenBox').classList.toggle('show');
}

/* ---- 精选：按领域分版块的精华（不是时间流）---- */
function featLead(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="feat-lead" data-uid="${d._uid}">
    <div class="fl-title">${hl(title)}</div>
    ${teaser?`<div class="fl-teaser">${hl(teaser)}</div>`:''}
    <div class="fl-meta">${avatar(d)}<span>${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</span>${scoreBadge(d)}</div>
  </div>`;
}
function featRow(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  return `<div class="frow" data-uid="${d._uid}">
    ${avatar(d,'sm')}
    <div class="fcol"><h4>${hl(title)}</h4><div class="fmeta">${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</div></div>
    ${scoreBadge(d)}
  </div>`;
}
function renderFeatured(){
  document.getElementById('ttl').textContent='精选';
  let rows=DATA.filter(d=>(d.score||0)>=STAR);
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));
  document.getElementById('sub').textContent='各领域最值得看的 · '+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  idIndex={};rows.forEach((d,i)=>{d._uid='f'+i;idIndex['f'+i]=d;});
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的精选，换个关键词试试。</div>';return;}
  const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
  const pool=rows.filter(d=>d.date===latest);
  const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
  const lp=parseSummary(lead.summary);
  let html=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(lp,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  const K=7;  // 1 头条 + 6 紧凑
  GROUPS2.forEach(g=>{
    const items=rows.filter(d=>g.cats.includes(d.category)).sort((a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''));
    if(!items.length)return;
    html+=`<div class="feat-sec"><div class="feat-head"><span class="feat-ic">${g.ic}</span><span class="feat-name">${esc(g.label)}</span><span class="feat-count">${items.length} 条</span>`+
      (items.length>K?`<span class="feat-more" data-go="group:${g.key}">查看全部 →</span>`:'')+
      `</div>`+featLead(items[0]);
    const rest=items.slice(1,K);
    if(rest.length)html+=`<div class="feat-items">`+rest.map(featRow).join('')+`</div>`;
    html+=`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-go]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();view=el.dataset.go;render();try{window.scrollTo(0,0);}catch(x){}});
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}

/* ---- render ---- */
const content=document.getElementById('content');
function render(){
  nav.querySelectorAll('.item').forEach(el=>el.classList.toggle('on',el.dataset.key===view));
  const isItem=String(view).startsWith('item:');
  document.getElementById('tools').style.display=(view==='about'||isItem)?'none':'';
  document.getElementById('ttl').style.display=isItem?'none':'';
  document.getElementById('sub').style.display=isItem?'none':'';
  // 精选按版块固定排（领域 + 相关性），排序选择器在这页无意义 → 隐藏（搜索保留）
  document.getElementById('sortSel').style.display=(view==='star')?'none':'';
  if(isItem)return renderItem(view.slice(5));
  if(view==='about')return renderAbout();
  if(view==='star')return renderFeatured();

  let rows=DATA.slice();let t='精选',s='相关性高的动态（评分 ≥ '+STAR+'）';
  if(view==='star'){rows=rows.filter(d=>(d.score||0)>=STAR);}
  else if(view==='all'){t='全部动态';s='按时间倒序的所有抓取条目';}
  else if(view.startsWith('group:')){const g=GROUPS2.find(x=>x.key===view.slice(6));const cs=g?g.cats:[];rows=rows.filter(d=>cs.includes(d.category));t=g?g.label:'领域';s='领域聚合 · '+(g?g.cats.filter(c=>allCats.includes(c)).join(' / '):'');}
  else if(view.startsWith('cat:')){const c=view.slice(4);rows=rows.filter(d=>d.category===c);t=c;s='方向：'+c;}
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));

  document.getElementById('ttl').textContent=t;
  document.getElementById('sub').textContent=s+'　·　'+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的内容，换个关键词或领域试试。</div>';return;}

  // index for reader
  idIndex={};rows.forEach((d,i)=>{d._uid='u'+i;idIndex['u'+i]=d;});

  let leadHtml='';
  if((view==='star'||view==='all')&&!query){
    const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
    const pool=rows.filter(d=>d.date===latest);const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
    const p=parseSummary(lead.summary);
    leadHtml=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(p,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  }
  const useScore=sortBy==='score'||(sortBy==='auto'&&view==='star');
  const cmp=useScore?(a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''):(a,b)=>(b.published||'').localeCompare(a.published||'');

  const groups={};rows.forEach(d=>{(groups[d.date||'未注明']=groups[d.date||'未注明']||[]).push(d);});
  let html=leadHtml;
  Object.keys(groups).sort().reverse().forEach(date=>{
    html+=`<div class="daterow"><span class="d">${esc(fmtDate(date))}</span><span class="ln"></span></div>`;
    html+=`<div class="daygroup">`+groups[date].sort(cmp).map(rowHtml).join('')+`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}
function rowHtml(d){
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="row" data-uid="${d._uid}">
    <div class="time">${hhmm(d.published)}</div>
    <div class="col">
      <div class="meta">
        ${avatar(d,'sm')}
        <span class="src">${hl(d.source||'')}</span>
        ${d.author?`<span class="au">${hl(d.author)}</span>`:''}
        <span class="right">
          <span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span>
          ${scoreBadge(d)}
        </span>
      </div>
      <h3>${hl(title)}</h3>
      ${teaser?`<div class="teaser">${hl(teaser)}</div>`:''}
    </div></div>`;
}
function renderAbout(){
  document.getElementById('ttl').textContent='关于';document.getElementById('sub').textContent='本地情报流 · 数据来自 web-intel-bot';
  content.innerHTML=`<div class="about">
  <p>把 web-intel-bot 抓取并 AI 摘要打分后的内容，做成一个 <b>能翻、能筛、能搜</b> 的情报流。形式参考 aihot，但数据是你自己的。</p>
  <p><b>怎么读不累：</b>列表只给标题 + 一句话，点任意一条 → 右侧滑出阅读面板看全文（详细 / 术语 / 对你有啥用 / 口播版）。列表永远清爽。</p>
  <p><b>分类：</b>bot 的话题桶归成 3 个领域（AI·技术 / 行业·世界 / 认知·个人），卡片上仍保留精确分类。</p>
  <p>刷新：<code>python feed_build.py</code> 或双击 <code>看情报流.bat</code>。</p>
  <p style="color:var(--dim)">共 ${DATA.length} 条 / ${dates.length} 天 / ${allCats.length} 个方向${GEN?('，更新于 '+GEN):''}。</p></div>`;
}
render();
</script>
</body>
</html>
