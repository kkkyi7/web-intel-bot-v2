性大幅提升；二是增加了命令行界面，对开发者更友好，可以脚本化操作；三是全新的设置界面和默认主题，用户体验更现代。另外，桌面端新增安全模式启动，方便排查问题；Windows 下数据同步失败时会自动刷新本地 DNS 缓存并重试，这是针对网络不稳定场景的实用优化。整体看，这次更新偏向底层能力和开发者生态建设，而非面向普通用户的新功能。\n\n【关键术语小词典】\n- Kernel plugin system / 内核插件系统：允许插件直接访问软件核心功能的架构，比普通插件更强大。\n- CLI / 命令行界面：通过输入文字命令来操作软件，适合自动化脚本和开发者。\n- Safe Mode / 安全模式：启动软件时禁用所有插件和自定义设置，用于排查故障。\n\n【对你有啥用】第一，思源笔记的内核插件系统是一个很好的产品设计案例。你做的决策智能平台如果也想开放插件生态，可以研究它如何平衡核心稳定性和扩展性，这对你们平台的 API 设计有参考价值。第二，命令行界面的加入说明工具产品正在向“可编程”演进，你在做供应链排程产品时，也可以考虑给客户提供 CLI 或脚本接口，让技术用户能自动化批量操作，这会成为差异化卖点。第三，安全模式和 DNS 自动重试这类“防御性功能”值得注意，工业软件客户对稳定性极其敏感，下次跟客户聊产品可靠性时，可以举这类例子说明你们对异常场景的处理思路。\n\n【想深入可以搜】思源笔记插件开发文档；知识管理工具产品对比；工业软件 CLI 设计最佳实践\n\n【口播版】思源笔记发布了 v3.7.0 候选版，这次更新对普通用户来说可能只是界面变好看了，但对咱们做产品的来说，有几个点值得琢磨。它加入了内核插件系统和命令行界面，这意味着思源正在从个人笔记工具向可扩展平台转型。咱们做决策智能平台的，可以想想自己的产品是不是也需要类似的插件架构。另外，它加了安全模式和 DNS 自动重试，这些看似不起眼的功能，在工业客户眼里就是稳定性的保障。下次跟客户聊产品可靠性，可以拿这类细节举例。总的来说，一个开源笔记软件的版本更新，背后反映的是产品从工具到平台的进化逻辑，这事儿挺值得琢磨。", "score": 6, "category": "GitHub 动态", "date": "2026-06-29"}, {"title": "The curious case of the disappearing Polish S (2015)", "source": "HackerNews", "author": "colinprince · 227 pts · 74 comments", "published": "2026-06-28T12:44:24Z", "url": "https://aresluna.org/the-curious-case-of-the-disappearing-polish-s/", "summary": "【中文标题】波兰字母S消失的奇怪案例（2015）\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】一篇2015年的技术文章，讲波兰语字母“ś”在网页输入时经常被浏览器或软件拦截，导致用户无法正常输入，背后涉及键盘快捷键冲突、Unicode编码和开发者习惯问题。\n\n【详细讲给你听】背景是波兰语使用拉丁字母加变音符号，比如“ś”是s加一个尖音符。但在很多网页或应用中，用户按Alt+S或Ctrl+S时，浏览器或软件会优先触发“保存”或“另存为”等快捷键，导致“ś”无法输入。核心是开发者没有考虑非英语用户的输入需求，尤其是波兰语这种有变音字母的语言。关键细节：1）波兰语有9个特殊字母，其中8个在Unicode分解后会变成基础字母加组合变音符号，但“ł”是个例外，无法用标准方法去掉变音。2）评论区有人吐槽微软Copilot 365，每次打“Ć”就会弹出Copilot，得手动关掉。3）浏览器没有提供简单的方法让开发者检查按键组合，导致问题长期存在。影响是：这不仅是波兰语的问题，任何使用变音符号的语言（如法语、德语、西班牙语）都面临类似困境。对开发者来说，这是一个提醒：国际化输入需要更细致的处理，不能只考虑英语用户。\n\n【关键术语小词典】无特殊术语（但可提：Unicode Normalization Form Canonical Decomposition / Unicode规范化分解：把带变音符号的字母拆成基础字母和变音符号，用于文本标准化处理。）\n\n【对你有啥用】1. 产品设计启示：你做工业软件和决策智能平台，客户可能来自全球，包括波兰、德国等非英语国家。如果产品有输入框或快捷键，一定要测试变音字母输入，避免像Copilot那样干扰用户。2. 客户沟通素材：下次和欧洲制造业客户聊时，可以提这个案例，展示你对国际化细节的关注，能拉近关系。3. 学习路径：研究一下Unicode规范化（NFC/NFD）和输入法处理，这对AI Agent处理多语言数据很有用，比如供应链数据中的非英语字段。\n\n【想深入可以搜】Polish diacritics keyboard shortcut conflict；Unicode normalization NFC NFD difference；Internationalization input handling best practices\n\n【口播版】今天聊一个2015年的技术老帖，但问题到今天都没完全解决。波兰语字母“ś”在网页里经常打不出来，因为浏览器或软件把Alt+S或Ctrl+S抢去当快捷键用了。评论区有人吐槽，微软Copilot 365每次打“Ć”就弹出来，得手动关掉。这背后是开发者习惯只考虑英语用户，没处理变音符号输入。咱们做产品的，如果客户在欧洲，比如德国或波兰，输入框和快捷键一定要测一下变音字母。不然客户一边排产一边弹Copilot，体验直接崩。这事儿挺值得琢磨，国际化不只是翻译界面，得从按键级别开始想。", "score": 6, "category": "技术圈", "date": "2026-06-29"}, {"title": "给记忆一个归处：我为什么开始使用 Apple 手记", "source": "少数派", "author": "ElijahLee", "published": "2026-06-25T07:40:12", "url": "https://sspai.com/post/111421", "summary": "【中文标题】给记忆一个归处：我为什么开始使用 Apple 手记\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】作者分享了自己从抗拒到频繁使用 Apple 原生日记应用“手记”的过程，认为它通过低门槛的碎片记录和回顾功能，帮助自己对抗遗忘、培养反思习惯。\n\n【详细讲给你听】这篇文章的背景是 Apple 在 iOS 17.2 中推出了原生“手记”应用，但很多人（包括作者）一开始觉得它功能简单、不如第三方日记应用。核心转折是作者发现“手记”的核心价值不在于写长篇日记，而在于“随手记”和“自动回顾”。关键细节有三：第一，它利用手机里的照片、位置、音乐等数据自动生成“建议”，用户只需点一下就能记录，极大降低了启动成本。第二，作者强调“记录”比“写日记”更重要，因为大脑会遗忘，而手记充当了外部记忆库。第三，作者通过定期回顾（比如每周看一次）来强化对生活的感知，而不是追求每日更新。机制上，这其实利用了心理学中的“蔡格尼克效应”和“峰终定律”——记录下未完成或高光时刻，能减少认知负担并提升幸福感。对普通人来说，这提供了一个对抗数字碎片化、培养正念的轻量工具。\n\n【关键术语小词典】\n- 蔡格尼克效应：人对未完成任务的记忆比已完成任务更清晰的心理现象。\n- 峰终定律：人对一段体验的评价主要基于高峰时刻和结束时的感受。\n\n【对你有啥用】第一，这个思路可以迁移到你的产品设计里。如果你在做决策智能平台，可以考虑给用户提供“自动建议”功能，比如根据历史数据或操作日志，自动生成“决策回顾”或“异常快照”，降低用户记录和复盘的门槛。第二，作为 PM，你经常需要跟客户沟通“价值”，这篇文章的“低启动成本”逻辑可以直接用在产品推广话术里，强调“不用刻意操作，系统自动帮你沉淀经验”。第三，对你个人产能提升也有启发：可以用类似“手记”的逻辑，在 Cursor 或 Claude 里设置一个“每日工作日志”模板，每天花 30 秒记录一个关键决策或失败点，长期积累就是你的个人产品案例库。\n\n【想深入可以搜】\n- Apple 手记 应用 使用技巧\n- 蔡格尼克效应 产品设计\n- 数字日记 习惯养成 心理学\n\n【口播版】今天聊一篇少数派的文章，讲的是 Apple 原生的“手记”应用。作者一开始觉得这玩意儿功能太简单，但后来发现它的核心价值根本不是写日记，而是帮你随手记。怎么记呢？它自动抓你手机里的照片、位置、音乐，生成一个“建议”，你点一下就能存下来。说白了，就是把你从“我要写一篇好日记”的压力里解放出来。然后你每周翻一翻，就能对抗遗忘，还能培养反思习惯。咱们做产品的，这个思路其实挺值得琢磨。你想想，你的决策智能平台能不能也搞个“自动建议”功能？比如根据用户的操作日志，自动生成一个“决策回顾”或者“异常快照”，让用户不用刻意操作就能沉淀经验。这比你逼着客户写周报好用多了。另外，你自己也可以试试，在 Cursor 里设个模板，每天花 30 秒记一个关键决策或失败点，长期下来就是你的个人案例库。这事儿挺值得琢磨。", "score": 6, "category": "心理学", "date": "2026-06-28"}, {"title": "派早报：豆包推出专业版、GTA VI 开启预售等", "source": "少数派", "author": "少数派编辑部", "published": "2026-06-25T00:51:49", "url": "https://sspai.com/post/111476", "summary": "【中文标题】\n派早报：豆包推出专业版、GTA VI 开启预售等\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n少数派早报汇总了豆包推出付费专业版、GTA VI 开启预售、OpenAI 发布推理芯片 Jalapeño 等几条科技新闻，属于信息速览。\n\n【详细讲给你听】\n背景：少数派是中文科技媒体，每天会发早报汇总前一天的科技动态，方便读者快速了解行业新闻。核心是几条独立新闻的罗列：豆包（字节跳动的 AI 助手）推出了专业版，意味着从免费转向订阅制收费；GTA VI 开启预售，这是游戏圈大事件；OpenAI 发布了名为 Jalapeño 的 AI 推理芯片，说明他们开始自研硬件来降低推理成本。关键细节：豆包专业版的具体定价和功能差异没有在摘要里展开，但“专业版”三个字暗示了产品分层策略。OpenAI 的芯片消息是重点，Jalapeño 应该是针对推理场景优化的专用芯片，类似 Google 的 TPU 或 AWS 的 Trainium。影响：对开发者来说，OpenAI 自研芯片可能意味着未来 API 调用成本下降；对产品经理来说，豆包专业版是 AI 助手商业化的重要信号，值得关注定价模型和用户转化率。\n\n【关键术语小词典】\n- OpenAI：美国人工智能研究公司，开发了 GPT 系列模型。\n- Jalapeño：OpenAI 发布的 AI 推理芯片名称，用于加速模型运行。\n- 豆包：字节跳动推出的 AI 对话助手，类似 ChatGPT。\n- GTA VI：游戏《侠盗猎车手 VI》，知名开放世界游戏系列新作。\n\n【对你有啥用】\n1. 豆包推出专业版，说明国内 AI 助手开始走订阅制路线。你作为决策智能平台的产品经理，可以关注字节的定价策略和功能分层，下次跟客户聊 AI 产品商业化时，拿这个案例说明“免费+付费”的可行性。\n2. OpenAI 自研推理芯片，意味着未来 API 成本可能下降。这对你公司做 AI 决策平台是利好，因为底层推理成本降低后，你们可以给客户报更低的价格，或者把省下来的钱投入算法优化。建议你跟进 Jalapeño 的性能数据，评估是否会影响你们的模型部署策略。\n3. 这条早报本身信息密度低，但“GTA VI 预售”这种跨行业新闻值得留意。游戏行业的预售模式（限量版、预购奖励）可以启发你设计工业软件的产品发布策略，比如给早期客户提供“决策智能平台抢先体验版”或“排程算法定制服务”。\n\n【想深入可以搜】\n- 豆包专业版 定价 功能对比\n- OpenAI Jalapeño 芯片 性能 成本\n- GTA VI 预售 商业模式 分析\n\n【口播版】\n今天少数派早报里几条新闻值得你扫一眼。豆包出专业版了，字节的 AI 助手开始搞订阅制，说明免费模式撑不住了，得靠付费功能赚钱。咱们做产品的可以琢磨一下，他们怎么设计功能分层，哪些能力放免费版，哪些放付费版。另一个重点是 OpenAI 发了自己的推理芯片，叫 Jalapeño。这玩意儿要是真能降成本，对你们公司做决策平台是直接利好，API 调用费低了，客户更愿意用。至于 GTA VI 预售，虽然跟工业软件不沾边，但游戏行业的预售策略，比如限量版、预购奖励，其实能启发你怎么设计工业软件的首发方案。给客户一个“早期合作者专属排程算法包”，说不定能提高转化率。这条早报信息比较碎，但里面藏着产品商业化的信号，值得你花十分钟深挖一下豆包专业版的定价细节。", "score": 6, "category": "AI大事", "date": "2026-06-27"}, {"title": "Sex and gender classification in clinical decision-support tools: a cross-sectional review of tools on MDCalc.", "source": "PubMed", "author": "Brototo Deb, Timothy Lim, Ian K Everitt, Carl G Streed", "published": "2026", "url": "https://pubmed.ncbi.nlm.nih.gov/42366422/", "summary": "【中文标题】临床决策支持工具中的性别分类：MDCalc 工具横断面研究\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇论文检查了 MDCalc 网站上 84 个临床决策工具，发现五分之一工具在“生理性别”和“社会性别”的标签、选项和底层数据之间存在混淆，可能影响 AI 诊断的准确性和公平性。\n\n【详细讲给你听】背景是现在越来越多的临床决策工具开始用算法和 AI 来辅助医生做判断，比如根据病人的性别、年龄等变量给出诊断建议。但问题来了：这些工具里“sex”（生理性别，男/女）和“gender”（社会性别，男性/女性）经常被混用。核心发现是：研究者扫了 MDCalc 上 821 个工具，只有 84 个（10.2%）用了性别变量。其中 98.8% 的工具只给二元选项（男/女或男性/女性），但 19% 的工具存在标签和选项不匹配——比如标签写“sex”但选项是“man/woman”。更关键的是，有 25.7% 的工具在引用原始研究时，原始数据收集方式（比如是问生理性别还是自我认同的性别）跟工具界面上的标签也对不上。这些工具中 84.5% 被评估为有中到高临床影响。机制上，这种混淆会导致算法输入变量定义不清晰，比如一个工具把“女性”当成生理性别，但底层数据其实是基于社会性别收集的，那模型输出的风险评分就可能不准，尤其对跨性别或非二元性别群体影响更大。说白了，这不是咬文嚼字，而是变量规格错误，会直接污染 AI 模型的训练和推理。\n\n【关键术语小词典】\n- Sex / 生理性别：基于生物学特征（染色体、激素）的男/女分类。\n- Gender / 社会性别：基于社会角色、身份认同的男性/女性/非二元分类。\n- MDCalc：一个医生常用的在线临床决策工具数据库，类似医疗界的“计算器库”。\n- Sex-gender conflation / 性别混淆：工具中生理性别和社会性别的标签、选项或数据来源不一致。\n\n【对你有啥用】第一，你做供应链排程算法，客户数据里可能也有类似问题。比如工厂的“物料类别”标签（原材料 vs 半成品）和实际数据采集方式（是仓库扫码还是人工录入）如果不一致，你的 AI 模型就会学偏。下次跟客户聊数据治理时，可以拿这个研究当案例，强调“变量定义一致性”对算法落地的关键性。第二，你关注 AI Agent 应用，这提醒你：任何 AI 工具在接入真实业务数据时，必须做“变量规格审计”。比如你给电池厂做排产，如果“设备状态”这个字段有的来自传感器（连续值）、有的来自人工填报（离散值），那你的 Agent 在推理时就会产生歧义。第三，从产品角度，这篇论文展示了“界面设计”如何影响算法公平性。你在设计决策智能平台时，用户输入界面的标签、选项和底层数据模型必须严格对齐，否则用户（比如计划员）可能无意中输错数据，导致排程结果偏差。\n\n【想深入可以搜】\n- sex vs gender variable specification in clinical AI\n- MDCalc sex gender conflation study\n- 变量定义一致性 算法公平性 工业软件\n\n【口播版】今天聊一篇关于临床决策工具的论文，但我觉得对咱们做工业软件和 AI 产品的也很有启发。研究者检查了 MDCalc 上 84 个工具，发现五分之一存在性别变量混淆的问题。比如标签写的是生理性别，但选项却是社会性别的叫法，或者底层数据来源跟界面标签对不上。这听起来像文字游戏，但问题很实在：变量定义不一致，AI 模型就会学偏。咱们做供应链排程的，想想看，如果物料类别字段，有的来自传感器自动采集，有的来自人工录入，那算法输出的排产建议能准吗？所以这篇论文的核心结论是，变量规格审计必须前置。下次你跟客户聊数据治理时，完全可以拿这个当案例，强调标签、选项和底层数据三者的对齐。这对你设计决策智能平台的用户界面也有直接参考：输入框的标签和下拉选项，必须跟后端数据模型严格对应，否则用户一个误操作，整个排程结果就偏了。这事儿挺值得琢磨，尤其你今年想深化工业软件加 AI 的产品理解，变量定义一致性就是个容易被忽略但很关键的切入点。", "score": 6, "category": "心理学", "date": "2026-06-29"}, {"title": "A fellows first night on call: managing the chaos in the storm.", "source": "PubMed", "author": "Daniel B Hanna, Douglas W Harrington, Sankalp Patel, Mazen Albaghdadi", "published": "2026", "url": "https://pubmed.ncbi.nlm.nih.gov/42374426/", "summary": "【中文标题】心脏科住院总医师首个夜班：在风暴中管理混乱\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇论文讲的是用高仿真模拟训练让新来的心脏科住院总医师提前体验夜班高压场景，结果发现这种训练能显著提升他们在紧急情况下的决策和领导能力。\n\n【详细讲给你听】背景是传统的心脏科岗前培训很少让新人直接面对高认知负荷下的夜间紧急决策，这就像让一个刚拿到驾照的人直接上高速开夜车，风险很高。核心是研究者设计了一套多场景、高保真的“夜班模拟训练”，让新住院总医师在模拟环境中处理一连串急性心血管急症，旁边有模拟护士和标准化病人配合，结束后用PEARLS框架进行结构化复盘。关键细节有三：一是只有五位住院总医师参与，样本很小但效果明显；二是训练后所有领域的信心都提升了，其中决策和领导力提升最大；三是带教老师观察到随着场景推进，学员的情境意识和优先级排序能力在增强。影响在于这种模拟训练被证明是可行、可复制的，能作为高效的岗前培训模型，让带教老师提前发现学员的薄弱点，给出个性化反馈，从而帮助学员更快达到“掌握学习”水平，为真正的夜班责任做好准备。\n\n【关键术语小词典】\n- PEARLS框架：一种结构化复盘方法，用于引导学员反思和总结模拟训练中的经验教训。\n- 高保真模拟：高度还原真实临床环境的模拟训练，包括设备、场景和人员互动。\n- 掌握学习：一种教学理念，确保学员在进入下一阶段前完全掌握当前内容。\n\n【对你有啥用】1. 这个“高保真模拟+结构化复盘”的思路，可以直接搬到工业软件的产品演示或客户培训中。比如给电池厂客户演示排程算法时，不要只讲PPT，而是搭建一个模拟产线故障的沙盘环境，让客户亲自操作并复盘决策，这比任何文档都更能建立信任。2. 你关注AI Agent在供应链中的应用，这篇论文里“多场景连续压力测试”的方法，可以借鉴来设计Agent的评估体系。别只测单点任务，要模拟一连串突发状况（比如原料断供+设备故障+订单加急），看Agent如何动态调整排产策略，这才能真正验证产品在客户现场的鲁棒性。3. 从产品经理视角看，这篇论文展示了“如何用低成本、高复用的方式解决高风险的培训问题”。你在做决策智能平台时，可以思考能否把这种“模拟环境”做成产品的一个模块，让客户自己用历史数据跑“如果-那么”场景，这既是卖点，也是降低客户决策门槛的工具。\n\n【想深入可以搜】\n- PEARLS debriefing framework healthcare\n- high-fidelity simulation cardiology training\n- mastery learning in medical education\n\n【口播版】今天聊一篇心理学方向的论文，讲的是怎么让心脏科住院总医师在真正值夜班之前，先在高仿真模拟环境里经历一场“风暴”。传统培训很少让新人直接面对高认知负荷的紧急决策，就像让新手直接上高速。研究者设计了一套多场景的夜班模拟训练，让学员连续处理急性心血管急症，结束后用PEARLS框架做结构化复盘。结果呢，虽然只有五个学员参与，但训练后他们在决策和领导力上的信心提升最大。带教老师还观察到，随着场景推进，学员的情境意识和优先级排序能力在增强。说白了，这种模拟训练不仅可行，还能让老师提前发现每个人的薄弱点，给出个性化反馈。咱们做产品的可以想想，给客户演示排程算法时，能不能也搭一个模拟产线故障的沙盘环境，让客户亲手操作并复盘。这比任何PPT都更能建立信任。另外，你关注AI Agent在供应链中的应用，这篇论文里“多场景连续压力测试”的思路，完全可以用来设计Agent的评估体系。别只测单点任务，要模拟一连串突发状况，看Agent怎么动态调整。这事儿挺值得琢磨。", "score": 6, "category": "心理学", "date": "2026-06-30"}, {"title": "Resilience among family caregivers of women with breast cancer: a systematic review and meta-synthesis of qualitative studies.", "source": "PubMed", "author": "Silas Selorm Daniels-Donkor, Beth Epstein, Emma McKim Mitchell", "published": "2026", "url": "https://pubmed.ncbi.nlm.nih.gov/42378788/", "summary": "【中文标题】乳腺癌家庭照护者韧性研究：系统综述与质性整合\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇综述分析了乳腺癌患者家庭照护者的韧性来源，发现韧性不是固定特质，而是由精神信仰、社会支持、角色调整和认知重构四个动态过程共同塑造的。\n\n【详细讲给你听】背景上，乳腺癌照护者长期承受心理和体力压力，但之前的研究多关注负面结果，很少系统梳理他们如何“撑住”甚至“变强”。核心是这篇2026年的系统综述，从2000年到2025年的文献中筛选出10项质性研究，覆盖8个国家、161名照护者，用主题综合法提炼出四个韧性机制。关键细节：第一，精神信仰是“锚”，照护者通过宗教或灵性找到意义和稳定感。第二，关系缓冲——主动调动家人、朋友的实际和情感支持。第三，适应性灵活——重新分配家庭角色，把照护融入日常生活，比如调整工作时间。第四，认知重构——把照护看作有目的的事，从中找到积极面。机制上，这颠覆了“韧性=天生坚强”的旧认知，说明韧性是情境驱动的动态过程，像拼图一样由不同资源拼凑而成。影响上，对护士和社工来说，可以针对这些维度设计干预，比如帮助照护者建立支持网络或进行认知训练。但研究也指出，现有样本多为西方文化背景，缺乏长期追踪，跨文化适用性待验证。\n\n【关键术语小词典】\n- Resilience / 韧性：在压力下适应并维持功能的能力，非固定特质。\n- Meta-synthesis / 整合性综述：对多个质性研究进行再分析和主题归纳的方法。\n- Cognitive reframing / 认知重构：改变对事件的看法，从中找到意义或积极面。\n- Relational buffering / 关系缓冲：通过社会支持网络缓解压力的机制。\n\n【对你有啥用】第一，产品启发。你做决策智能平台，客户是制造业企业。照护者的“适应性灵活”和“认知重构”可以类比到供应链排产中的动态调整——当原料短缺或订单变更时，系统是否也能像照护者一样“重构优先级”而非死守原计划？下次跟电池或医药客户聊排程算法时，可以提“韧性排产”概念，强调系统不是固定规则，而是动态适应。第二，沟通技巧。这篇研究强调“关系缓冲”对韧性的作用。你在推动AI产品落地时，客户内部往往有“照护者”角色（如生产经理），他们需要支持网络。可以建议客户建立内部“AI应用支持小组”，类似照护者的关系缓冲，降低采纳阻力。第三，学习路径。你关注AI Agent和LLM应用，这篇关于“韧性是动态过程”的结论，可以迁移到Agent设计上——好的Agent不是预设所有场景，而是像照护者一样，通过外部工具调用（关系缓冲）和自我反思（认知重构）来适应异常。可以在Claude或Cursor里试一个“韧性Agent”原型，输入供应链异常事件，让它输出多步适应方案。\n\n【想深入可以搜】\n- 供应链韧性 动态适应 算法\n- 家庭照护者 韧性 认知重构 质性研究\n- AI Agent 异常处理 动态规划\n\n【口播版】最近读到一篇2026年的系统综述，讲乳腺癌患者家庭照护者的韧性。核心发现是，韧性不是天生特质，而是由四个动态过程拼出来的：精神信仰当锚、靠关系缓冲压力、灵活调整角色、还有认知重构找意义。这跟咱们做产品的有什么关系呢。你看，制造业客户面对供应链波动时，生产经理其实就像照护者，他们需要系统帮他们“动态适应”而不是死守计划。你设计的排程算法能不能也引入这种韧性思维，当原料短缺或订单变更时，自动重构优先级而不是报错。这跟AI Agent的设计也相通，好的Agent应该像照护者一样，通过调用外部工具和自我反思来适应异常。下次跟客户聊，可以提“韧性排产”这个概念，强调你的平台不是固定规则引擎，而是动态适应系统。这事儿挺值得琢磨，尤其对你做决策智能产品直接相关。", "score": 6, "category": "心理学", "date": "2026-07-01"}];

function fmtDate(d){const m=/(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${+m[2]}月${+m[3]}日 · ${m[1]}`:(d||'');}
/* 来源头像：按来源名确定性配柔和色 + 取首字 */
const AV=[['#fdebd6','#b25e16'],['#e4edfb','#3560a8'],['#e5f4ec','#1f7a4d'],['#efe8fb','#6b46c1'],['#fde7ef','#bd3b6e'],['#e2f2f5','#0e7490'],['#f1ece2','#7d6a44']];
function avatar(d,cls){
  const s=String(d.source||d.author||'·').trim();
  let ini;
  if(/^[A-Za-z]/.test(s)) ini=(s.match(/[A-Za-z]+/)[0]).slice(0,2).toUpperCase();
  else{const c=s.match(/[一-龥]/);ini=c?c[0]:s.slice(0,2);}
  let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  const [bg,fg]=AV[h%AV.length];
  return `<span class="av ${cls||''}" style="background:${bg};color:${fg}">${esc(ini)}</span>`;
}
/* 相关性分数徽标（琥珀色，醒目但不抢戏）*/
function scoreBadge(d,cls){
  if(!d.score)return '';
  return `<span class="sb ${cls||''}"><svg viewBox="0 0 24 24"><path d="M13 2L4.5 13h6l-1 9L19 11h-6z"/></svg>${d.score}</span>`;
}

/* ---- reading drawer ---- */
let idIndex={}, prevView='star';
function openItem(uid){
  if(!String(view).startsWith('item:')) prevView=view;
  view='item:'+uid; render();
  try{window.scrollTo(0,0);}catch(e){}
}
function rsec(l,v,c){return `<div class="rsec ${c||''}"><div class="lbl">${esc(l)}</div><div class="val">${esc(v)}</div></div>`;}
function renderItem(uid){
  const d=idIndex[uid];
  if(!d){view=prevView;return render();}
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const detail=PICK(p,'详细讲给你听','详细'),terms=PICK(p,'关键术语小词典','关键术语'),useful=PICK(p,'对你有啥用'),dig=PICK(p,'想深入可以搜'),spoken=PICK(p,'口播版'),one=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  const heat=d.score?`<span class="heat"><svg viewBox="0 0 24 24"><path d="M12 2s5 4 5 9a5 5 0 01-10 0c0-1 .3-2 .8-2.8C8 9 9 8 9 8s-.3 2 .7 2.8C10 9 12 6 12 6s-1 3 .5 4.2C13 9 13 7 13 7s2 2 2 4a3 3 0 01-6 0"/></svg>${d.score}</span>`:'';
  let h=`<div class="article"><div class="backlink" id="backlink">← 返回</div>`;
  h+=`<div class="amenu">${avatar(d,'lg')}<span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span><span>${esc(d.source||'')}</span>${d.author?`<span>· ${esc(d.author)}</span>`:''}<span>· ${esc((d.published||d.date||'').replace('T',' ').slice(0,16))}</span>${scoreBadge(d,'lg')}</div>`;
  h+=`<h2 class="atitle">${esc(PICK(p,'中文标题')||d.title)}</h2>`;
  if(one)h+=`<div class="lede">${esc(one)}</div>`;
  if(detail)h+=rsec('详细',detail);
  if(terms)h+=rsec('关键术语',terms);
  if(useful)h+=rsec('对你有啥用',useful,'use');
  if(dig)h+=rsec('想深入可以搜',dig);
  h+=`<div class="rlinks"><a class="btn pri" href="${esc(d.url)}" target="_blank" rel="noopener">↗ 看原文</a>`;
  if(spoken)h+=`<span class="btn" id="spokenBtn">🎧 口播版</span>`;
  h+=`</div>`;
  if(spoken)h+=`<div class="spoken rsec" id="spokenBox"><div class="lbl">口播版</div><div class="val">${esc(spoken)}</div></div>`;
  h+=`</div>`;
  content.innerHTML=h;
  document.getElementById('backlink').onclick=()=>{view=prevView;render();};
  const sb=document.getElementById('spokenBtn');if(sb)sb.onclick=()=>document.getElementById('spokenBox').classList.toggle('show');
}

/* ---- 精选：按领域分版块的精华（不是时间流）---- */
function featLead(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="feat-lead" data-uid="${d._uid}">
    <div class="fl-title">${hl(title)}</div>
    ${teaser?`<div class="fl-teaser">${hl(teaser)}</div>`:''}
    <div class="fl-meta">${avatar(d)}<span>${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</span>${scoreBadge(d)}</div>
  </div>`;
}
function featRow(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  return `<div class="frow" data-uid="${d._uid}">
    ${avatar(d,'sm')}
    <div class="fcol"><h4>${hl(title)}</h4><div class="fmeta">${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</div></div>
    ${scoreBadge(d)}
  </div>`;
}
function renderFeatured(){
  document.getElementById('ttl').textContent='精选';
  let rows=DATA.filter(d=>(d.score||0)>=STAR);
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));
  document.getElementById('sub').textContent='各领域最值得看的 · '+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  idIndex={};rows.forEach((d,i)=>{d._uid='f'+i;idIndex['f'+i]=d;});
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的精选，换个关键词试试。</div>';return;}
  const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
  const pool=rows.filter(d=>d.date===latest);
  const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
  const lp=parseSummary(lead.summary);
  let html=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(lp,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  const K=7;  // 1 头条 + 6 紧凑
  GROUPS2.forEach(g=>{
    const items=rows.filter(d=>g.cats.includes(d.category)).sort((a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''));
    if(!items.length)return;
    html+=`<div class="feat-sec"><div class="feat-head"><span class="feat-ic">${g.ic}</span><span class="feat-name">${esc(g.label)}</span><span class="feat-count">${items.length} 条</span>`+
      (items.length>K?`<span class="feat-more" data-go="group:${g.key}">查看全部 →</span>`:'')+
      `</div>`+featLead(items[0]);
    const rest=items.slice(1,K);
    if(rest.length)html+=`<div class="feat-items">`+rest.map(featRow).join('')+`</div>`;
    html+=`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-go]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();view=el.dataset.go;render();try{window.scrollTo(0,0);}catch(x){}});
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}

/* ---- render ---- */
const content=document.getElementById('content');
function render(){
  nav.querySelectorAll('.item').forEach(el=>el.classList.toggle('on',el.dataset.key===view));
  const isItem=String(view).startsWith('item:');
  document.getElementById('tools').style.display=(view==='about'||isItem)?'none':'';
  document.getElementById('ttl').style.display=isItem?'none':'';
  document.getElementById('sub').style.display=isItem?'none':'';
  // 精选按版块固定排（领域 + 相关性），排序选择器在这页无意义 → 隐藏（搜索保留）
  document.getElementById('sortSel').style.display=(view==='star')?'none':'';
  if(isItem)return renderItem(view.slice(5));
  if(view==='about')return renderAbout();
  if(view==='star')return renderFeatured();

  let rows=DATA.slice();let t='精选',s='相关性高的动态（评分 ≥ '+STAR+'）';
  if(view==='star'){rows=rows.filter(d=>(d.score||0)>=STAR);}
  else if(view==='all'){t='全部动态';s='按时间倒序的所有抓取条目';}
  else if(view.startsWith('group:')){const g=GROUPS2.find(x=>x.key===view.slice(6));const cs=g?g.cats:[];rows=rows.filter(d=>cs.includes(d.category));t=g?g.label:'领域';s='领域聚合 · '+(g?g.cats.filter(c=>allCats.includes(c)).join(' / '):'');}
  else if(view.startsWith('cat:')){const c=view.slice(4);rows=rows.filter(d=>d.category===c);t=c;s='方向：'+c;}
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));

  document.getElementById('ttl').textContent=t;
  document.getElementById('sub').textContent=s+'　·　'+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的内容，换个关键词或领域试试。</div>';return;}

  // index for reader
  idIndex={};rows.forEach((d,i)=>{d._uid='u'+i;idIndex['u'+i]=d;});

  let leadHtml='';
  if((view==='star'||view==='all')&&!query){
    const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
    const pool=rows.filter(d=>d.date===latest);const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
    const p=parseSummary(lead.summary);
    leadHtml=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(p,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  }
  const useScore=sortBy==='score'||(sortBy==='auto'&&view==='star');
  const cmp=useScore?(a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''):(a,b)=>(b.published||'').localeCompare(a.published||'');

  const groups={};rows.forEach(d=>{(groups[d.date||'未注明']=groups[d.date||'未注明']||[]).push(d);});
  let html=leadHtml;
  Object.keys(groups).sort().reverse().forEach(date=>{
    html+=`<div class="daterow"><span class="d">${esc(fmtDate(date))}</span><span class="ln"></span></div>`;
    html+=`<div class="daygroup">`+groups[date].sort(cmp).map(rowHtml).join('')+`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}
function rowHtml(d){
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="row" data-uid="${d._uid}">
    <div class="time">${hhmm(d.published)}</div>
    <div class="col">
      <div class="meta">
        ${avatar(d,'sm')}
        <span class="src">${hl(d.source||'')}</span>
        ${d.author?`<span class="au">${hl(d.author)}</span>`:''}
        <span class="right">
          <span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span>
          ${scoreBadge(d)}
        </span>
      </div>
      <h3>${hl(title)}</h3>
      ${teaser?`<div class="teaser">${hl(teaser)}</div>`:''}
    </div></div>`;
}
function renderAbout(){
  document.getElementById('ttl').textContent='关于';document.getElementById('sub').textContent='本地情报流 · 数据来自 web-intel-bot';
  content.innerHTML=`<div class="about">
  <p>把 web-intel-bot 抓取并 AI 摘要打分后的内容，做成一个 <b>能翻、能筛、能搜</b> 的情报流。形式参考 aihot，但数据是你自己的。</p>
  <p><b>怎么读不累：</b>列表只给标题 + 一句话，点任意一条 → 右侧滑出阅读面板看全文（详细 / 术语 / 对你有啥用 / 口播版）。列表永远清爽。</p>
  <p><b>分类：</b>bot 的话题桶归成 3 个领域（AI·技术 / 行业·世界 / 认知·个人），卡片上仍保留精确分类。</p>
  <p>刷新：<code>python feed_build.py</code> 或双击 <code>看情报流.bat</code>。</p>
  <p style="color:var(--dim)">共 ${DATA.length} 条 / ${dates.length} 天 / ${allCats.length} 个方向${GEN?('，更新于 '+GEN):''}。</p></div>`;
}
render();
</script>
</body>
</html>
