", "date": "2026-07-02"}, {"title": "《奔流》第三季纽约场启幕，中美嘉宾共探“机遇之源”", "source": "澎湃新闻", "author": "澎湃新闻记者 邵媛媛", "published": "2026-07-02T01:12:01", "url": "https://m.thepaper.cn/detail/33467961", "summary": "【中文标题】\n《奔流》第三季纽约场启幕，中美嘉宾共探“机遇之源”\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n上海和纽约搞了个城市对话论坛，两边政府、企业、经济学家聊金融开放、AI投资、消费活力，核心是想在中美关系缓和期，给双方企业找合作机会。\n\n【详细讲给你听】\n背景是中美关系刚经历了一轮高层会晤，两边都想在贸易摩擦之外找点实际合作。这个《奔流》论坛已经是第三季了，前两季跟巴黎、伦敦聊过，这次选纽约，明显是冲着金融和科技去的。核心事件就是2026年6月30号在彭博总部开的这场会，来了不少大人物：布隆伯格、中国驻美公使、彭博首席经济学家、高盛策略师，还有姚明。关键细节有三：一是圆桌讨论里明确说中国资产的吸引力从传统增长转向了AI、高端制造和金融开放，高盛的人直接说AI是A股核心主线；二是上海要试点离岸交易市场，建人民币资产全球配置中心，这是金融开放的具体动作；三是消费圆桌里姚明和品牌高管聊体育赛事怎么变成城市体验，强调国际品牌在中国成功必须本地化适配。影响方面，这事短期是给中美企业界释放信号——别光盯着地缘政治，具体业务还能做。长期看，上海在借这类对话把金融开放和AI产业故事讲给全球资本听，对制造业、供应链相关的投资决策会有间接影响。\n\n【关键术语小词典】\n- CAZ / 中央活力区：比CBD更强调生活、消费、文化融合的城市核心区概念。\n- QFII / 合格境外机构投资者：境外机构投资中国A股的通道，上海是主要服务窗口。\n- 陆家嘴论坛：上海每年举办的金融政策风向标会议，常释放开放信号。\n\n【对你有啥用】\n1. 对你关注的供应链+AI落地有直接信号：高盛和彭博经济学家都提到AI是当前中国资产的核心主线，且上海在聚集AI上市公司。这意味着你所在公司的决策智能平台，在跟制造业客户（电池、医药、钢铁）聊项目时，可以引用这个宏观趋势来论证“AI+供应链优化”是资本和政策都看好的方向，不是小打小闹。2. 圆桌里提到“中国在AI基础设施、能源供给及实体应用层面具备差异性优势”，这正好是你做排程算法和决策智能产品时，跟客户强调“中国制造场景的数据和落地能力比海外强”的论据。下次跟电池或化工客户沟通，可以说“连高盛都认为中国AI强在实体应用，咱们的排产优化就是典型实体场景”。3. 金融开放和离岸交易市场试点，对你公司融资或客户预算有间接影响：如果外资更容易配置中国资产，你们这类科技公司拿融资或客户扩产投资的概率会提升，值得留意后续政策落地。\n\n【想深入可以搜】\n- 上海离岸交易市场试点 2026\n- 高盛 AI 中国核心主线 2026\n- 中国资产吸引力 从传统增长转向AI 高端制造\n\n【口播版】\n上海和纽约最近搞了个城市对话论坛，叫《奔流》第三季。说白了就是两边政府、经济学家、企业大佬坐一块，聊怎么在中美关系缓和期找点实际合作。重点来了，高盛的首席中国股票策略师直接说，AI现在是中国市场的一条核心主线，而且中国在基础设施、能源供给和实体应用上有差异化优势。这对你做工业软件和决策智能平台意味着什么？意味着你跟电池、医药、钢铁这些客户聊项目时，可以拿这个宏观趋势当背书，说AI+供应链优化是资本和政策都看好的方向，不是小打小闹。另外，上海要试点离岸交易市场，建人民币资产全球配置中心，这对外资配置中国资产是利好，间接影响你们公司融资和客户扩产投资的概率。说白了，这场论坛释放的信号挺明确：别光盯着地缘政治，具体业务还能做。这事儿值得你跟进后续政策落地。", "score": 6, "category": "世界时事", "date": "2026-07-02"}, {"title": "Global review confirms mRNA vaccines are safe, effective and full of promise", "source": "HackerNews", "author": "coloneltcb · 257 pts · 215 comments", "published": "2026-07-02T00:40:14Z", "url": "https://news.ubc.ca/2026/06/mrna-vaccines-are-safe-effective-and-full-of-promise/", "summary": "【中文标题】全球综述确认mRNA疫苗安全有效且前景广阔\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】一项全球综述研究确认mRNA疫苗安全有效，并指出其制造能力已从实验室规模跃升至数十亿剂，未来可用于癌症、流感等多种疾病。\n\n【详细讲给你听】背景是mRNA疫苗在新冠疫情期间首次大规模使用，但围绕其安全性和有效性一直有争议。这项来自UBC的全球综述综合了大量数据，给出了明确结论。核心发现是mRNA疫苗不仅安全有效，而且其制造技术已成熟。关键细节包括：1）制造规模从实验室级别跃升至数十亿剂，这是最难的跨越；2）针对新冠原始毒株的序列设计仅用了一个周末完成；3）未来应用前景广阔，包括针对癌症的定制疫苗、半通用流感疫苗等。影响方面，这意味着mRNA平台已准备好应对下一百种应用，包括快速应对病毒突变和个性化医疗。但评论中也指出，单纯说“安全有效”可能不够，需要更透明地分享统计风险和收益数据，才能更好地与公众沟通。\n\n【关键术语小词典】\n- mRNA疫苗 / 信使核糖核酸疫苗：一种利用信使RNA指导细胞产生抗原，从而激发免疫反应的疫苗技术。\n- 免疫失忆 / Immune amnesia：麻疹病毒会破坏免疫系统记忆，使人体对其他病原体的抵抗力下降。\n- T细胞计数 / T-cell count：衡量免疫系统健康程度的关键指标，常被用于评估疫苗或疾病对免疫的影响。\n\n【对你有啥用】1. 供应链启发：mRNA制造从实验室到数十亿剂的规模化过程，与工业软件中的排产算法高度相似。你可以在与电池或医药客户沟通时，用这个案例说明“从原型到规模化生产”的算法优化价值，比如如何通过排程算法缩短疫苗生产周期。2. 产品判断：评论中提到的“单纯说安全有效不够，需要透明分享风险收益数据”，直接对应你做决策智能平台时的客户沟通策略。工业客户（如钢铁、化工）同样需要看到算法的统计风险和置信区间，而不是笼统的“优化结果”。3. 学习路径：mRNA技术的快速迭代（一周设计序列）展示了AI+生物领域的敏捷开发模式。你可以研究这种“快速原型+规模化验证”的流程，看能否迁移到工业AI产品的MVP设计上。\n\n【想深入可以搜】mRNA vaccine manufacturing scale-up challenges；AI-driven vaccine design sequence optimization；industrial software production scaling case study\n\n【口播版】一项全球综述研究确认mRNA疫苗安全有效，而且前景广阔。但真正值得咱们做产品的关注的，是它背后的制造规模化故事。从实验室级别到几十亿剂的产能，这中间最难的不是技术本身，而是怎么把生产流程排好、跑通。就像咱们做工业软件，客户最头疼的往往不是算法理论，而是怎么把排产算法落地到实际产线上。另外，评论里有个观点挺有意思，说单纯讲安全有效不够，得把风险和收益数据透明地摆出来。这对咱们跟客户沟通很有启发，工业客户也一样，他们需要看到算法的置信区间和统计风险，而不是一个模糊的优化结果。这事儿挺值得琢磨，尤其是你正在做供应链和AI落地，mRNA的规模化路径可以直接拿来当案例。", "score": 6, "category": "技术圈", "date": "2026-07-02"}, {"title": "8点1氪丨宾利低至27万，二手豪华燃油车价格大跳水；Anthropic回应暗藏代码检测中国用户；寒武纪市值一日蒸发700亿", "source": "36氪", "author": "", "published": "2026-07-02T00:10:58", "url": "https://36kr.com/p/3877746956611847?f=rss", "summary": "【中文标题】8点1氪丨二手豪车价格大跳水；Anthropic回应暗藏代码检测中国用户；寒武纪市值蒸发700亿\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】今天的热点包括二手豪华燃油车价格暴跌，Anthropic承认在Claude Code里加了检测中国用户的代码并承诺删除，以及寒武纪股价大跌市值蒸发700亿。\n\n【详细讲给你听】先说二手豪车这事。青岛二手车市场里，8年车龄的宾利飞驰挂牌价只要26.8万，保时捷Macan低至15万，大众途锐二手价6.8万。以前二手豪车全年折旧不超过30%，今年5月单月就跌了30%。这背后是新能源车冲击和消费降级，对供应链和制造业来说，意味着传统燃油车产业链的资产贬值速度在加快。然后是Anthropic的争议。有用户逆向分析发现，Claude Code从4月起内置了针对中国时区和147个特定域名的检测机制，把结果隐蔽编码在请求里。Anthropic回应说是为了防止账户转售和模型蒸馏攻击的实验性措施，计划在新版本删除。这对做AI产品的人来说是个信号：大模型厂商在合规和防滥用上的动作越来越隐蔽，也说明中国用户的使用行为被高度关注。最后是寒武纪，前一天刚破万亿市值，第二天就跌了7%，蒸发700亿。公司发了风险提示公告，说股价短期涨幅过大。这反映了AI芯片概念股的高波动性，对做决策智能平台的人来说，意味着上游算力供应链的不确定性在增加。\n\n【关键术语小词典】\n- 模型蒸馏攻击：通过大量调用大模型API，用输出数据训练一个性能接近的廉价模型，属于盗用行为。\n- 寒武纪：中国AI芯片公司，主营智能处理器IP和芯片，科创板上市公司。\n\n【对你有啥用】1. 二手豪车价格跳水这事，表面是消费新闻，但背后是传统制造业供应链的资产贬值逻辑。你跟电池、钢铁客户聊时，可以提这个趋势：新能源和AI驱动的自动化正在加速传统产线设备的折旧，客户做排产和投资决策时得重新算ROI。2. Anthropic检测中国用户这事，直接关系到你用Claude Code做开发。如果你或团队在用Claude Code，要留意后续更新是否真的删除了检测机制，以及是否影响API调用的稳定性和数据隐私。这也能提醒你，选型AI工具时，合规和地域限制是硬门槛。3. 寒武纪市值波动说明AI芯片赛道的高风险。你做决策智能平台，上游算力成本是客户考量的关键因素。可以跟客户聊时强调：算力供应链的波动会影响AI项目的落地周期和预算，建议客户在选型时考虑多云或混合架构来对冲风险。\n\n【想深入可以搜】二手豪华车价格跳水原因；Anthropic Claude Code 中国检测；寒武纪市值波动 AI芯片\n\n【口播版】今天的热点有三条值得咱们做产品的关注。第一条是二手豪华燃油车价格大跳水，宾利只要27万，保时捷15万。这背后是新能源车冲击和消费降级，传统燃油车产业链的资产贬值速度在加快。你跟电池、钢铁客户聊的时候，可以提这个趋势，新能源和AI驱动的自动化正在加速传统产线设备的折旧，客户做排产和投资决策时得重新算ROI。第二条是Anthropic承认在Claude Code里加了检测中国用户的代码，说是为了防止模型被盗用，但承诺会删除。如果你在用Claude Code，得留意后续更新，这提醒我们选型AI工具时，合规和地域限制是硬门槛。第三条是寒武纪市值一天蒸发700亿，AI芯片概念股波动大。你做决策智能平台，上游算力成本是客户考量的关键因素，可以跟客户聊时强调算力供应链的不确定性，建议他们考虑多云或混合架构来对冲风险。这几件事都挺值得琢磨。", "score": 6, "category": "AI大事", "date": "2026-07-02"}, {"title": "沃什称美国通胀风险下降 缩表或需较长时间", "source": "财新网", "author": "", "published": "2026-07-02T00:02:29", "url": "https://international.caixin.com/2026-07-02/102459853.html", "summary": "【中文标题】\n沃什称美国通胀风险下降 缩表或需较长时间\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n美联储主席沃什说最近美国通胀没那么危险了，但缩表（减少印钞）会拖很久。消息一出，美债收益率跌了，黄金涨了，因为市场觉得降息可能快了。\n\n【详细讲给你听】\n背景是美联储这两年一直在加息缩表打压通胀，但效果时好时坏。核心是沃什在7月1日欧洲央行论坛上表态：近几周通胀风险下降，但缩表（减少资产负债表规模）需要更长时间。关键细节有三：一是他拒绝给未来利率走向做“前瞻指引”，说现在不适合；二是讲话后两年期美债收益率跌到4.137%，黄金涨超2%到4115美元；三是美国核心PCE通胀仍高达3.4%，是2023年最高。影响上，市场解读为“鸽派信号”——通胀没那么急，缩表慢点，降息预期升温。但沃什同时强调要把通胀拉回2%，说明美联储还在“既要又要”：既不想让市场恐慌，又不想放弃紧缩。对全球来说，美元流动性收紧速度放缓，可能缓解新兴市场资金外流压力，但缩表拉长意味着长期利率不会快速下降。\n\n【关键术语小词典】\n- 缩表：美联储减少持有的国债等资产，相当于回收市场上的美元，是紧缩政策的一种。\n- PCE：个人消费支出价格指数，美联储最看重的通胀指标，比CPI更全面。\n- 前瞻指引：央行提前告诉市场未来利率走向，用来稳定预期。\n\n【对你有啥用】\n1. 供应链视角：通胀风险下降+缩表放缓，意味着制造业客户（电池、钢铁等）的融资成本可能见顶。下次跟客户聊排产算法时，可以提“宏观资金面改善，企业更愿意投资数字化，现在推APS（高级计划排程）时机更好”。\n2. 产品判断：沃什拒绝前瞻指引，说明不确定性仍是常态。你做决策智能平台，可以强调“AI排程能实时响应市场波动，比依赖固定预测更抗风险”——这正好切中客户对宏观不确定性的焦虑。\n3. 学习路径：关注美联储政策如何影响工业软件采购周期。建议把“利率与制造业IT支出关联”作为研究课题，下次写产品文档或客户沟通时能拿出数据支撑。\n\n【想深入可以搜】\n- 美联储缩表进度 2026\n- 核心PCE与制造业投资关系\n- 霍尔木兹海峡油价影响供应链\n\n【口播版】\n美联储主席沃什最近说了句话，直接让美债收益率跌了，黄金涨了。他说美国通胀风险在下降，但缩表会拖很久。咱们做产品的，得看懂这背后的信号。通胀没那么急了，意味着加息可能接近尾声，制造业客户的融资成本压力会变小。这对你卖APS或者排程算法是个好消息，因为企业更愿意掏钱做数字化了。但沃什同时拒绝给未来利率做预测，说白了，不确定性还在。这正好是你跟客户聊产品时的切入点：AI排程能实时应对市场变化，比死板的预测模型靠谱。另外，缩表拉长意味着长期利率不会快速降，客户做投资决策时会更谨慎。这事儿挺值得琢磨，下次跟客户聊宏观环境时，可以拿这个当引子。", "score": 6, "category": "世界时事", "date": "2026-07-02"}, {"title": "What to learn to be a graphics programmer", "source": "HackerNews", "author": "atan2 · 281 pts · 150 comments", "published": "2026-07-01T17:53:44Z", "url": "https://blog.demofox.org/2026/07/01/what-to-learn-to-be-a-graphics-programmer/", "summary": "【中文标题】学什么才能成为图形程序员\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】HackerNews上讨论想入行图形编程该学什么。核心分歧是：你是想做游戏（用现成引擎），还是想做底层3D引擎开发（自己写渲染器）。后者门槛高、发展快、竞争激烈。\n\n【详细讲给你听】这篇讨论来自HackerNews，标题是“学什么才能成为图形程序员”。评论区里最有价值的观点来自几位资深开发者。一位叫Animats的用户直接抛出了关键问题：你到底是想做游戏，还是做3D引擎编程？如果目标是做游戏，那就用Unreal、Unity、Godot这些现成引擎，学的是更高层的问题，比如怎么让游戏好玩，而不是怎么操作像素。如果想做底层引擎开发，那就要有心理准备——这个领域失败的项目非常多。他提到在Rust生态里，就有三个失败的渲染器、一个没做完的，以及Bevy引擎里那个还在用的。另一位叫KellyCriterion的用户从2001年就开始做图形编程，他直言现在不建议新人入行。原因是这个领域发展速度太恐怖了，25年来的进步令人惊叹，但随之而来的是极高的学习成本和激烈的竞争。还有用户补充说，讨论里缺少了对设计原则和人类感知特性的强调，认为图形程序员不能只懂技术，还得理解艺术家的视角。整体来看，这篇讨论的核心不是一份学习路线图，而是一个职业选择提醒：先想清楚你要解决什么问题，再决定学什么。\n\n【关键术语小词典】\n- 3D engine programming / 3D引擎编程：写底层渲染代码，控制GPU怎么画像素，而不是用现成工具搭场景。\n- CRDT / 无冲突复制数据类型：一种让多人同时编辑同一份数据而不冲突的技术，常用于协同办公软件。\n- Bevy / Bevy引擎：一个用Rust写的开源游戏引擎，强调数据驱动和模块化。\n\n【对你有啥用】1. 这篇讨论的核心逻辑——“先想清楚你要解决什么问题，再决定学什么”——完全可以迁移到你的工作中。你在做决策智能平台，面对客户时，客户经常分不清“我要一个排程算法”和“我要解决生产延误问题”。你可以用这个框架帮客户理清需求：你是想优化现有流程，还是想重构整个决策体系？2. 讨论里提到“用现成引擎学更高层问题”的思路，对你学习AI Agent和LLM应用很有启发。不要一上来就研究Transformer架构或手写RAG，而是先用LangChain、AutoGPT这些现成工具，快速理解“智能体怎么规划任务”这个高层问题。3. 评论区对“领域发展速度太快”的提醒，也适用于工业软件+AI这个交叉领域。你在跟客户沟通时，可以主动帮他们评估技术风险：哪些模块适合用成熟方案，哪些需要自研，避免客户被“AI万能论”带偏。\n\n【想深入可以搜】“Bevy engine architecture”、“game engine vs renderer career choice”、“CRDT application in collaborative tools”\n\n【口播版】HackerNews上有个讨论挺有意思，标题是学什么才能成为图形程序员。但点进去发现，大家根本没在列学习清单，而是在争一个更根本的问题：你到底是想做游戏，还是想做3D引擎编程？一位叫Animats的老哥说得特别直白，如果目标是做游戏，那就用Unreal、Unity这些现成引擎，学的是怎么让游戏好玩，而不是怎么操作像素。如果想做底层引擎开发，那就要有心理准备，这个领域失败的项目太多了。另一位2001年就入行的开发者甚至说，现在不建议新人进图形编程，因为发展速度太恐怖了，学习成本极高。咱们做产品的，其实特别能理解这个逻辑。你在跟客户聊供应链优化的时候，是不是也经常遇到类似的情况？客户说我要一个排程算法，但实际他要的是解决生产延误问题。先想清楚要解决什么问题，再决定学什么或者做什么，这个思路对你的客户沟通和产品判断都挺直接的。", "score": 6, "category": "技术圈", "date": "2026-07-02"}, {"title": "Argo CD 3.5 推出内部双向 TLS 与源码完整性校验支持，强化软件供应链安全", "source": "InfoQ 中文", "author": "作者：Claudio Masolo", "published": "2026-07-01T17:32:00", "url": "https://www.infoq.cn/article/MfHAiaeQbq6VWPHLD4pB?utm_source=rss\u0026utm_medium=article", "summary": "【中文标题】\nArgo CD 3.5 推出内部双向 TLS 与源码完整性校验支持，强化软件供应链安全\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\nArgo CD 3.5 版本新增了两个安全功能：内部组件之间用双向 TLS 加密通信，以及能校验源码是否被篡改。这主要是为了加固软件供应链，防止开发到部署的链条被攻击。\n\n【详细讲给你听】\n背景上，Argo CD 是 Kubernetes 生态里最主流的 GitOps 工具，很多企业用它来自动化部署应用。之前版本在安全上有个隐患：内部组件之间的通信默认没加密，而且只校验了部署后的镜像签名，没管源码本身是否被改过。核心变化是 3.5 版引入了两个机制：一是内部双向 TLS，让 Argo CD 的各个服务组件（比如 API Server、Repo Server）之间强制加密握手，防止中间人攻击；二是源码完整性校验，在拉取 Git 仓库代码时，会验证提交签名或文件哈希，确保你看到的代码就是开发者写的代码，没被中间人注入恶意内容。关键细节有两个：这个双向 TLS 是默认开启的，用户不用额外配置；源码校验支持 GPG 签名和 OCI 工件校验两种模式。影响上，这对工业软件公司很重要——你的排程算法或决策平台如果跑在 K8s 上，用 Argo CD 做部署，那这次更新直接堵住了供应链攻击的一个常见入口。说白了，就是让你的部署流水线更可信，客户审计时也更有底气。\n\n【关键术语小词典】\n- Argo CD：一个基于 GitOps 的 Kubernetes 部署工具，帮你自动同步代码和配置到集群。\n- 双向 TLS：通信双方都出示证书验证身份，防止冒充和窃听。\n- 源码完整性校验：检查代码从提交到拉取过程中有没有被篡改。\n- GitOps：用 Git 仓库作为唯一事实来源，通过 Pull Request 管理基础设施和应用部署。\n\n【对你有啥用】\n1. 下次跟电池或医药客户聊部署安全时，可以提这个点。他们工厂的产线系统如果上云，供应链攻击是合规审计的高频问题。Argo CD 这个更新能直接作为你平台的安全背书，证明你的部署链路是可信的。\n2. 你团队内部如果也在用 GitOps 管理排程算法的配置和模型版本，建议评估升级到 3.5。源码完整性校验能防止开发环境到生产环境的配置被篡改，这对工业场景的稳定性和可追溯性很关键。\n3. 从产品视角看，这个功能说明安全正在从“外挂”变成“默认内置”。你设计决策智能平台时，也可以考虑把类似的双向认证和完整性校验做成默认功能，而不是让客户自己去配——这能降低客户的使用门槛，也减少售后问题。\n\n【想深入可以搜】\n- Argo CD 3.5 双向 TLS 配置指南\n- GitOps 供应链安全最佳实践\n- 源码完整性校验 GPG 签名\n\n【口播版】\nArgo CD 3.5 发布了，这次主要强化了软件供应链安全。两个核心更新：一个是内部组件之间默认开启双向 TLS 加密，防止中间人攻击。另一个是源码完整性校验，拉代码的时候会检查签名和哈希，确保代码没被改过。说白了，就是从开发到部署的链条上，堵住了两个常见的攻击入口。咱们做工业软件和决策平台的，如果客户工厂对安全审计要求高，比如电池、医药这些行业，这个功能就很有价值。你可以直接拿它跟客户说，我们的部署链路是经过签名校验和加密的，不是裸奔的。另外，如果你团队内部在用 GitOps 管理排程算法的配置，建议评估升级到 3.5，能防止配置被篡改。这事儿挺值得琢磨，安全正在从“可选配置”变成“默认标配”，你设计产品时也可以参考这个思路。", "score": 6, "category": "供应链", "date": "2026-07-02"}, {"title": "FFmpeg 9.1's new AAC encoder", "source": "HackerNews", "author": "ledoge · 324 pts · 102 comments", "published": "2026-07-01T14:10:28Z", "url": "https://hydrogenaudio.org/index.php/topic,129691.0.html", "summary": "【中文标题】FFmpeg 9.1 新版 AAC 编码器发布\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】FFmpeg 9.1 终于有了一个能用的 AAC 编码器，但只支持固定码率和 48kHz 采样率。Opus 编码器在测试中全面碾压所有 AAC 编码器，包括苹果的。\n\n【详细讲给你听】背景是 FFmpeg 之前的 AAC 编码器质量很差，有烦人的啁啾声伪影，导致做视频录制的人必须额外装苹果的 Core Audio 编码器才能获得可接受的音质。这次 FFmpeg 9.1 发布了一个新编码器，算是解决了这个历史遗留问题。核心发现是，新编码器主要针对 48kHz 采样率优化，并且只支持固定码率（CBR），不支持基于质量的动态码率（VBR）。关键细节有三个：第一，有用户在 A/B/X 盲听测试中发现，320kbps 的 MP3 听起来比 320kbps 的旧版 FFmpeg AAC 好，但和 256kbps 的苹果 Core Audio AAC 差不多，说明旧编码器有多拉胯。第二，新编码器为了绕过一个存在了 20 年的立体声 PNS 解码器 bug，做了特殊处理，这个 bug 之前没人发现因为其他编码器根本不用 PNS。第三，Opus 编码器在 64kbps 的极低码率下就吊打了所有 AAC 编码器。影响是，对于普通用户，如果你用 FFmpeg 处理音频，现在终于有一个不装第三方库就能用的 AAC 选项了。但如果你是做音乐或专业音频的，44.1kHz 的 CD 标准采样率支持不佳，且没有 VBR，这仍然是个硬伤。\n\n【关键术语小词典】\n- AAC / 高级音频编码：一种有损数字音频压缩标准，比 MP3 更新，通常在同码率下音质更好。\n- Opus / Opus 编码器：一个开源、免专利费的音频编码格式，在低码率下音质表现极佳。\n- CBR / 固定码率：编码时每秒钟输出的数据量固定，文件大小可预测，但音质会随音频复杂度波动。\n- VBR / 动态码率：编码时根据音频复杂度动态调整数据量，音质更稳定，但文件大小不可预测。\n\n【对你有啥用】第一，这条信息对你做产品决策有直接启发。如果你在做的工业软件或决策智能平台涉及音视频处理（比如工厂的监控录像分析、质检视频流），FFmpeg 是底层基础设施。现在它的 AAC 编码器终于能用了，意味着你可以减少对第三方商业编码器的依赖，降低集成成本和许可风险。第二，从技术选型角度看，Opus 的碾压性表现值得关注。如果你在考虑为产品增加语音交互或实时通讯功能，Opus 在低码率下的高质量意味着更低的带宽成本和更好的用户体验，这比 AAC 更适合 AI 应用场景。第三，这个案例展示了开源社区解决历史技术债务的过程。作为 PM，你可以跟团队聊：我们产品里有没有类似“20 年没人发现的 bug”或“一直凑合用的模块”？这种技术债的清理往往能带来意外的性能提升，值得排入迭代计划。\n\n【想深入可以搜】FFmpeg AAC encoder comparison 2026；Opus vs AAC blind test；CBR vs VBR audio quality\n\n【口播版】FFmpeg 9.1 终于发布了一个能用的 AAC 编码器。这事儿对做音视频处理的人来说挺重要。之前 FFmpeg 自带的 AAC 编码器质量特别差，有那种烦人的啁啾声，导致很多人做视频录制时不得不额外装苹果的 Core Audio 编码器。新编码器算是解决了这个历史遗留问题，但有两个硬伤。第一，它只支持固定码率，不支持动态码率，这意味着音质会随着音频复杂度波动。第二，它主要针对 48kHz 采样率优化，而 CD 音频标准是 44.1kHz，所以做音乐的朋友可能还得等等。更有意思的是，测试里 Opus 编码器在 64kbps 的超低码率下就吊打了所有 AAC 编码器。说白了，如果你在做产品涉及到音频处理，现在可以少依赖一个第三方库了。但如果你追求极致音质，Opus 才是更值得押注的方向。这事儿挺值得琢磨，尤其是当你考虑产品里的语音交互或实时通讯功能时，带宽成本和质量之间怎么平衡。", "score": 6, "category": "技术圈", "date": "2026-07-02"}, {"title": "“人归心不归”已成往事，香港首个五年规划开始答题", "source": "观察者网", "author": "", "published": "2026-07-01T02:56:11", "url": "https://www.guancha.cn/dengfei/2026_07_01_822185_s.shtml", "summary": "【中文标题】\n人归心不归已成往事，香港首个五年规划开始答题\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n这篇对话讲香港回归29年后的变化，从“黑暴”创伤中恢复，首位香港航天员升空，以及特区政府首次制定五年规划，标志治理思路从“大市场小政府”转向主动规划。\n\n【详细讲给你听】\n背景是香港回归29周年，文章通过采访立法会议员邓飞，梳理香港近年来的深层变化。核心事件有三：一是香港社会从2019年“黑暴”中恢复，邓飞认为“人归心不归”的说法已过时，年轻一代对那段历史没有直接记忆，身份认同也不再被“香港人vs中国人”的二元对立绑架。二是首位香港航天员黎家盈随神舟二十三号升空，邓飞强调这种“参与感”比宏大叙事更能触动人心，建议后续多分享她的个人故事。三是特区政府首次启动五年规划公众咨询，这是治理范式的重大转变——以前香港奉行“积极不干预”，现在要学习内地用财政、金融、产业政策工具主动推动发展。关键细节：邓飞指出最大难度是开发“政策工具”，比如招商引资过去只是规管，现在要加KPI、设专班；他还提到知识产权交易平台，让大学教授的科研成果对接产业。影响上，这标志着香港从“由乱到治”进入“由治及兴”，但五年规划落地需要摸索，尤其是如何平衡“一国两制”与规划性发展。\n\n【关键术语小词典】\n- 五年规划：中国每五年制定的国家发展蓝图，设定经济、社会等目标，香港首次对标此模式。\n- 大市场小政府：香港传统治理理念，政府不干预市场，让企业自由竞争。\n- 黑暴：指2019年香港的暴力示威事件，导致社会秩序混乱。\n- KPI：关键绩效指标，用于衡量政府或企业的工作成果。\n\n【对你有啥用】\n1. 供应链与AI产品视角：香港五年规划强调“政策工具”开发，这对你做的决策智能平台是个信号——政府和企业客户可能从“被动合规”转向“主动规划”。你可以思考：如何把排程算法、供应链优化产品包装成“规划工具”，帮客户从短期利润转向中长期目标？比如在电池、医药行业，客户可能需要预测性规划而非单纯排产。\n2. 客户沟通启发：邓飞提到“参与感”比宏大叙事有效，这对你与制造业客户沟通很有用。别只讲AI技术多牛，要讲“你的工厂能像香港航天员一样参与国家重大项目”——用具体故事（如某客户用你的平台降本20%）打动对方，而不是堆术语。\n3. 学习路径参考：文章提到香港从“无产业政策”到学习内地工具，这和你从工业软件向AI Agent转型类似。你可以关注“政策工具”在供应链中的应用，比如政府补贴如何影响排产算法设计，或LLM如何帮客户解读政策变化。这能深化你对“AI+工业”的产品理解。\n\n【想深入可以搜】\n1. 香港五年规划 2026-2030 公众咨询\n2. 香港航天员 黎家盈 神舟二十三号\n3. 香港 大市场小政府 治理转型\n\n【口播版】\n香港回归29周年，有一篇对话挺值得咱们做产品的琢磨。核心是三个变化。第一，所谓“人归心不归”的说法过时了，年轻一代对黑暴没记忆，身份认同也不再被二元对立绑架。第二，首位香港航天员黎家盈升空，邓飞说参与感比宏大叙事更管用，建议多分享她的个人故事。第三，也是对你最相关的，香港首次搞五年规划，从“大市场小政府”转向主动规划。最大难度是开发政策工具，以前政府只管规管，现在要加KPI、设专班招商引资。问题来了，这对你做的决策智能平台意味着什么。客户可能从被动合规转向主动规划，你的排程算法能不能包装成“规划工具”，帮他们从短期利润转向中长期目标。另外，邓飞强调参与感，你下次跟制造业客户聊，别光讲技术，讲具体故事，比如哪个工厂用你的平台降本20%。这事儿挺值得琢磨，尤其是你想在工业软件加AI的交叉领域深化产品理解。", "score": 6, "category": "世界时事", "date": "2026-07-02"}, {"title": "派早报：Google 推出 Eclipsa Video 视频标准等", "source": "少数派", "author": "少数派编辑部", "published": "2026-06-30T23:48:54", "url": "https://sspai.com/post/111773", "summary": "【中文标题】\n派早报：Google 推出 Eclipsa Video 视频标准等\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n这篇早报汇总了科技圈几件事：Anthropic 发布了新模型 Claude Sonnet 5 和 Claude Science，Google 则推出了新视频标准 Eclipsa Video 和几款轻量级模型。\n\n【详细讲给你听】\n背景：科技巨头每周都会发布一堆新东西，但大部分对普通用户没直接影响。这篇早报就是帮你快速扫一眼，知道谁又出了什么。核心：Anthropic 这次动作不小，Claude Sonnet 5 应该是他们主力模型的升级版，而 Claude Science 听起来像是专门为科研场景优化的版本，可能更擅长处理论文、数据、公式这类内容。Google 这边，Eclipsa Video 是个新视频标准，目标是让视频在低带宽下更清晰，或者让视频编辑更高效。同时他们还发了 Nano Banana 2 Lite 和 Gemini Omni Flash，看名字就知道是轻量级模型，主打端侧部署或低成本推理。关键细节：没具体参数，但“Lite”和“Flash”通常意味着牺牲一点精度换速度和成本，适合做实时任务或嵌入到小设备里。影响：对咱们做产品的来说，这些新模型和标准意味着更多技术选型。比如 Claude Science 如果真能理解科研论文，那做知识库或决策支持系统时就能用它来解析专业文档。Eclipsa Video 标准如果推广开，可能会影响工业软件里的视频监控或质检模块。\n\n【关键术语小词典】\n- Claude Sonnet 5 / 克劳德十四行诗 5：Anthropic 发布的最新主力大语言模型，性能更强。\n- Claude Science / 克劳德科学：Anthropic 针对科研场景优化的模型，可能擅长处理学术内容。\n- Eclipsa Video / 蚀视频标准：Google 推出的新视频编码或处理标准，旨在提升视频效率。\n- Nano Banana 2 Lite / 纳米香蕉 2 精简版：Google 的轻量级 AI 模型，适合在手机或边缘设备运行。\n\n【对你有啥用】\n1. 产品判断：Claude Science 这个细分方向值得关注。如果你在做工业软件里的知识管理或决策支持，可以研究它是否能解析化工配方、电池参数或钢铁工艺文档，这直接关系到产品能否“理解”行业数据。2. 客户沟通：下次和制造业客户聊时，可以提一嘴“现在有专门做科研的 AI 模型了，咱们的排产算法如果能结合这类模型，自动读工艺文档生成约束条件，效率能提不少”。3. 学习路径：Google 的轻量模型（Nano Banana 2 Lite）说明边缘计算在 AI 里越来越重要。你可以花点时间了解模型量化、蒸馏技术，这对未来做端侧供应链优化或实时决策产品是加分项。\n\n【想深入可以搜】\nClaude Science 科研能力评测\nGoogle Eclipsa Video 技术细节\n轻量级大模型 边缘部署 供应链\n\n【口播版】\n今天早报里有两件事值得咱们做产品的留意。Anthropic 发了 Claude Sonnet 5 和 Claude Science，后者是专门为科研场景优化的。问题来了，如果你在帮电池厂或药厂做决策平台，能不能用这个模型自动读取工艺文档里的配方和参数，然后直接生成排产约束条件。这比手动整理数据快多了。另一件事是 Google 推出了 Eclipsa Video 视频标准，还有轻量级模型 Nano Banana 2 Lite。说白了，轻量模型意味着可以在工厂的工控机上跑 AI，不用每次都连云端。这对实时质检或边缘端的供应链优化直接相关。你可以去搜一下 Claude Science 的评测，或者轻量模型在工业场景的落地案例，这事儿挺值得琢磨。", "score": 6, "category": "AI大事", "date": "2026-07-01"}, {"title": "logseq/logseq 发布 Desktop app Nightly Release 20260630", "source": "GitHubRelease", "author": "github-actions[bot]", "published": "2026-06-30T20:22:41Z", "url": "https://github.com/logseq/logseq/releases/tag/nightly", "summary": "【中文标题】Logseq 桌面版夜间构建版 20260630 发布\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】Logseq 这个笔记软件发布了最新的夜间测试版，功能可能不稳定，主要让想尝鲜的用户提前体验新特性。\n\n【详细讲给你听】Logseq 是一个开源的知识管理和笔记工具，很多人用它来做个人知识库或项目管理。这次发布的版本是“夜间构建版”，也就是开发团队每天自动生成的测试版本。背景是这类软件通常有稳定版和测试版两条线，夜间版比正式版更新更频繁，但可能包含未修复的 bug。核心就是 GitHub 的自动化流程打包了一个新版本，并提醒用户谨慎使用。关键细节：第一，这是桌面应用版本，不是网页版。第二，它明确标注了“不稳定”，意味着可能崩溃或数据丢失。第三，夜间版通常包含最新功能，比如可能集成了 AI 辅助写作或更好的图谱视图。对普通用户来说，如果你不是重度依赖 Logseq 做日常工作，不建议升级；但如果你是开发者或想提前体验新功能，可以下载试试。\n\n【关键术语小词典】\n- Logseq / 无中文通用译名：一款开源的知识管理和笔记应用，支持双向链接和本地存储。\n- Nightly Release / 夜间构建版：每天自动生成的测试版本，功能最新但稳定性差。\n\n【对你有啥用】第一，Logseq 这类工具是个人知识管理的典型产品，作为 PM 你可以关注它如何通过夜间版快速迭代功能，这对你设计决策智能平台的版本发布策略有参考价值。第二，如果你在用 Logseq 管理自己的学习笔记或产品文档，可以下载这个版本提前体验新特性，比如可能更新的图谱或 AI 集成，这能帮你判断类似功能是否值得引入到你的供应链优化产品中。第三，注意它“不稳定”的提示，这提醒你在给客户做产品演示时，必须用稳定版，避免因测试版 bug 影响客户信任。\n\n【想深入可以搜】\n- Logseq 新功能 2026\n- 知识管理工具 版本发布策略\n- 夜间构建版 产品测试\n\n【口播版】Logseq 发布了最新的夜间测试版。说白了，就是他们每天自动打包的一个版本，功能最新，但可能不太稳定。如果你是重度用户，想提前试试新功能，比如更好的图谱或者 AI 辅助，可以下载看看。但注意，千万别拿它做重要的工作，容易翻车。咱们做产品的，可以琢磨一下他们这种快速迭代的发布方式，对你自己的产品版本管理有没有启发。比如你做的决策智能平台，能不能也搞个类似的测试通道，让核心客户提前体验新算法。这事儿挺值得琢磨。", "score": 6, "category": "GitHub 动态", "date": "2026-07-01"}, {"title": "独家对话RT总编辑|遭三次暗杀又身患癌症，她如何让RT在制裁下逆势翻盘？", "source": "观察者网", "author": "", "published": "2026-06-30T10:54:24", "url": "https://www.guancha.cn/internation/2026_06_30_822116_s.shtml", "summary": "【中文标题】独家对话RT总编辑|遭三次暗杀又身患癌症，她如何让RT在制裁下逆势翻盘？\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇专访讲RT总编辑玛格丽塔·西蒙尼扬从战地记者到媒体掌舵人的经历。重点是她如何在西方全面封锁和制裁下，让RT浏览量逆势翻番，以及她个人面对癌症和家庭变故的韧性。\n\n【详细讲给你听】这篇文章是观察者网对RT总编辑玛格丽塔·西蒙尼扬的深度专访。背景是RT作为俄罗斯的国际媒体，在俄乌冲突后面临西方前所未有的制裁，包括平台封禁、个人被列入制裁名单，甚至遭遇三次未遂暗杀。核心内容是她讲述自己的职业生涯：19岁因报道车臣战争成名，24岁冒着枪林弹雨直播别斯兰人质危机，25岁被任命为RT总编辑。关键细节有三点：第一，她提到西方主流媒体如BBC和CNN的议程几乎一模一样，RT存在的意义就是提供不同的叙事视角。第二，面对制裁，RT的浏览量反而逆势翻番，说明封锁反而激发了受众的好奇心和反向关注。第三，她个人层面，身患癌症、丈夫去世，但她从别斯兰人质事件幸存者身上学到“在绝望中寻找快乐”的韧性。影响方面，这篇文章展示了在极端地缘政治压力下，一个媒体机构如何通过差异化定位和内容策略实现逆势增长，这对理解信息战和媒体运营有直接参考价值。\n\n【关键术语小词典】\n- RT / 今日俄罗斯：俄罗斯的国有国际新闻频道，提供多语种新闻报道。\n- 别斯兰人质事件：2004年发生在俄罗斯北奥塞梯的恐怖袭击，导致超过330人死亡。\n- 克里姆林宫记者团：专门报道俄罗斯总统和政府活动的记者团队。\n\n【对你有啥用】第一，从产品角度看，RT在制裁下逆势翻番的案例，本质上是一个“被封锁但需求反而爆发”的经典场景。这跟你做企业级AI决策智能平台时，客户对“数据安全”和“国产替代”的焦虑很像。下次跟电池或医药客户聊排程算法时，可以提这个逻辑：当外部环境越封锁、越复杂，企业对内部决策智能的需求反而越刚性。第二，西蒙尼扬反复强调“提供不同于BBC和CNN的叙事”，这启发你思考产品定位。你的决策智能平台面对SAP、西门子等巨头时，差异化不是功能堆砌，而是对特定行业（如电池、钢铁）的深度理解和本土化服务。第三，她个人面对癌症和家庭变故的韧性，虽然听起来像鸡汤，但做工业软件PM需要这种长期主义。工业软件落地周期长、客户决策链复杂，没有这种“在绝望中找快乐”的心态，很难撑过产品打磨期。\n\n【想深入可以搜】“RT 制裁 浏览量 增长 策略”、“信息战 媒体 差异化 定位”、“工业软件 国产替代 客户焦虑 产品策略”\n\n【口播版】今天聊一篇专访，主角是RT总编辑玛格丽塔·西蒙尼扬。她19岁报道车臣战争一战成名，25岁当上RT总编辑。俄乌冲突后RT被西方全面封杀，她本人被制裁，还遭遇三次暗杀。但神奇的是，RT的浏览量反而逆势翻番。说白了，封锁反而让更多人想去看。这跟咱们做产品很像，当客户被巨头封锁或者对现有方案不满时，你的差异化定位反而成了突破口。她提到一个观点挺有意思，说BBC和CNN的议程几乎一模一样，RT存在的意义就是提供不同视角。咱们做决策智能平台面对西门子、SAP这些巨头时，道理一样。别想着功能堆砌，要学她那样，找到客户最痛的那个点，比如电池行业的排程算法，或者钢铁行业的供应链优化。然后深耕下去。另外她个人经历也值得琢磨，身患癌症、丈夫去世，但她从别斯兰人质事件的幸存者身上学会了在绝望中找快乐。做工业软件PM，项目周期长、客户决策慢，没有这种韧性真撑不住。这事儿挺值得琢磨。", "score": 6, "category": "世界时事", "date": "2026-07-01"}, {"title": "美国最高法推翻百年判例 允许特朗普解雇独立机构雇员", "source": "财新网", "author": "", "published": "2026-06-30T04:55:06", "url": "https://international.caixin.com/2026-06-30/102459148.html", "summary": "【中文标题】\n美国最高法推翻百年判例 允许特朗普解雇独立机构雇员\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n美国最高法院推翻了1926年的一个关键判例，从此总统可以随意解雇美联储等独立机构的负责人，但随后又驳回了特朗普立即解雇美联储理事的请求，局面很矛盾。\n\n【详细讲给你听】\n背景是1926年有个叫“汉弗莱遗嘱执行人”的判例，它保护了像美联储、证券交易委员会这类独立机构的负责人不被总统随便炒鱿鱼。这些机构本来设计成独立于白宫，避免政治干预。核心事件是最高法院在6月29日以5比4推翻了那个百年判例，理论上总统现在有权解雇这些机构的头儿。但紧接着6月30日，法院又驳回了特朗普立即解雇美联储理事丽莎·库克的请求，理由是程序问题。关键细节：一是投票是5比4，说明分歧极大；二是特朗普一直抱怨美联储降息太慢，想通过换人施压；三是这个裁决被称作“数十年来美国政府组织框架最大的变革之一”，影响深远。直接影响是总统权力大幅扩张，独立机构的独立性被削弱。连锁反应可能包括美联储货币政策受政治干扰、监管机构（如证监会）决策被白宫左右，甚至引发全球对美国制度稳定性的质疑。\n\n【关键术语小词典】\n- 汉弗莱遗嘱执行人判例：1926年判例，保护独立机构负责人不被总统随意解雇。\n- 美联储：美国央行，负责制定货币政策，传统上独立于白宫。\n- 独立机构：如美联储、证监会，法律上不受总统直接控制，旨在保持专业性和中立性。\n\n【对你有啥用】\n1. 供应链和决策智能产品高度依赖稳定的政策环境。美联储独立性被削弱意味着利率政策可能更受政治周期影响，制造业客户的融资成本和投资节奏会变得更难预测。你跟客户聊排程算法或供应链优化方案时，可以主动提醒他们关注政策风险，并建议在模型中增加“利率波动”或“政策不确定性”的敏感性分析模块，这会显得你比竞品更懂行业痛点。\n2. 作为PM，这个案例展示了“制度设计”如何被技术或政治力量颠覆。你在设计AI决策平台时，也可以思考：如果客户的组织架构或决策权突然变化（比如CEO直接干预排产），你的产品能否快速适应？这启发你在产品架构上预留“权限弹性”和“规则热更新”能力，而不是写死一套流程。\n3. 长期关注世界大事，这个裁决是理解美国政治经济走向的关键信号。如果美联储独立性受损，美元汇率、大宗商品价格都可能波动，进而影响你服务的电池、钢铁、化工行业的原材料成本。建议你把这个案例加入你的“宏观风险清单”，定期跟踪后续发展。\n\n【想深入可以搜】\n- Humphrey's Executor v. United States 判例解读\n- 美联储独立性 政治干预 历史\n- 美国最高法院 独立机构 2026年裁决\n\n【口播版】\n美国最高法院最近干了一件大事，推翻了1926年的一个老判例。这个判例本来保护美联储、证监会这些独立机构的负责人不被总统随便炒鱿鱼。现在判例一推翻，理论上总统想换谁就换谁。但有意思的是，法院紧接着又驳回了特朗普立即解雇美联储理事的请求，说程序不对。说白了，就是给了总统一把枪，但暂时没让他扣扳机。这事儿对咱们做工业软件和AI决策的来说，直接相关。因为美联储独立性一弱，利率政策就容易受政治影响，你服务的那些电池厂、钢铁厂客户，他们的融资成本和投资节奏就会变得很不确定。下次你跟客户聊排产算法或者供应链优化方案的时候，可以主动提一嘴这个风险，建议他们在模型里加上利率波动的敏感性分析。这会让客户觉得你不仅懂技术，还懂他们的生意环境。这事儿挺值得琢磨，建议你持续关注后续发展。", "score": 6, "category": "世界时事", "date": "2026-06-30"}, {"title": "siyuan-note/siyuan 发布 SiYuan v3.7.0-rc.2", "source": "GitHubRelease", "author": "github-actions[bot]", "published": "2026-06-29T08:05:04Z", "url": "https://github.com/siyuan-note/siyuan/releases/tag/v3.7.0-rc.2", "summary": "【中文标题】思源笔记发布 v3.7.0-rc.2 版本\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】思源笔记发布了新版本，主要更新包括支持配置密钥和变量、新的设置界面、命令行界面、内核插件系统，以及新的默认主题和图标。\n\n【详细讲给你听】思源笔记是一款开源的个人知识管理工具，类似 Notion 或 Obsidian。这次 v3.7.0-rc.2 是一个候选发布版本，意味着功能基本稳定，正在做最后打磨。核心变化有几个值得关注：一是新增了命令行界面，这对开发者或高级用户来说，意味着可以用脚本批量操作笔记，比如自动备份或批量导出。二是支持了内核插件系统，这比之前的插件机制更底层，允许开发者直接修改笔记软件的核心行为，比如自定义同步逻辑或集成外部 AI 服务。三是新的设置界面和默认主题，提升了用户体验的一致性。另外，桌面端支持安全模式启动，方便排查插件冲突问题。Windows 用户在数据同步失败时会自动刷新本地 DNS 缓存并重试，这是一个很实用的体验优化。整体来看，这次更新更偏向底层架构和开发者体验，普通用户可能感受不到太大变化，但为后续功能扩展打下了基础。\n\n【关键术语小词典】\n- Kernel plugin system / 内核插件系统：允许插件直接访问和修改软件核心功能的机制，比普通插件更强大。\n- CLI / 命令行界面：通过输入文字命令来操作软件的方式，适合自动化脚本和高级用户。\n- DNS / 域名系统：将网址转换为 IP 地址的系统，DNS 问题会导致无法访问网络服务。\n\n【对你有啥用】第一，思源笔记的内核插件系统值得关注。你研究 AI Agent 和 LLM 应用，这个架构允许你直接在笔记软件里集成 AI 功能，比如自动摘要、知识图谱生成。可以把它当成一个实验平台，测试你的产品思路。第二，命令行界面的加入，意味着你可以把笔记操作嵌入到工作流里。比如用脚本自动把产品需求文档从思源导出为 Markdown，再喂给 AI 做分析。这对你提升个人产能很有帮助。第三，作为 PM，你可以观察思源这种开源工具的产品迭代节奏。他们优先打磨底层架构，再优化用户体验，这种思路在工业软件里也适用——先保证系统稳定可扩展，再考虑界面美观。\n\n【想深入可以搜】思源笔记 插件开发、个人知识管理 工具对比、开源笔记 内核插件系统\n\n【口播版】思源笔记发布了 v3.7.0-rc.2 版本。这次更新有几个点值得咱们做产品的留意。首先是新增了命令行界面，这意味着你可以用脚本批量操作笔记，比如自动备份或者批量导出。然后是内核插件系统，这个比较底层，允许开发者直接修改笔记软件的核心行为。如果你在研究 AI Agent 和 LLM 应用，这个架构可以当实验平台，比如在里面集成自动摘要或者知识图谱生成。另外，Windows 用户在同步失败时会自动刷新 DNS 缓存并重试，这个细节很实用。整体来看，这次更新更偏向底层架构和开发者体验，为后续功能扩展打了基础。对咱们来说，可以观察这种开源工具的迭代节奏，先打磨底层再优化界面，这个思路在工业软件里也适用。", "score": 6, "category": "GitHub 动态", "date": "2026-06-30"}, {"title": "派早报：微软改口称 8GB 足够运行 Windows 11", "source": "少数派", "author": "少数派编辑部", "published": "2026-06-28T23:13:43", "url": "https://sspai.com/post/111639", "summary": "【中文标题】\n派早报：微软改口称 8GB 足够运行 Windows 11\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n微软改口说8GB内存就能流畅跑Windows 11，OpenAI发布GPT-5.6但说需要美国政府批准才能给谁用，还有Notion Mail要关停等几条科技简讯。\n\n【详细讲给你听】\n这条内容来自少数派的早报合集，核心是几条科技新闻。第一条是微软改口，之前Windows 11推荐16GB内存，现在说8GB就够了。这背后可能是微软优化了系统内存管理，或者为了兼容更多低配置设备，对普通用户是好事，但开发者得注意应用在低内存环境的表现。第二条是OpenAI发布GPT-5.6，但强调需要美国政府批准才能确定提供对象。这延续了AI大模型出口管制的趋势，意味着国内企业想用最新模型会更难，也影响你所在公司做决策智能平台时依赖的底层模型选择。第三条是Notion Mail宣布关闭，说明邮件赛道竞争激烈，独立工具产品生存不易。其他还有央视报道网络测评乱象、苹果奥迪前员工做豪华电瓶车、俄罗斯应用被苹果下架等，属于行业动态。整体看，这条内容信息密度高，但每条都很短，适合快速扫一眼。\n\n【关键术语小词典】\n- GPT-5.6 / 生成式预训练变换器5.6版：OpenAI最新的大语言模型，能力比前代更强，但受出口管制。\n- Notion Mail / Notion邮件：Notion公司推出的邮件客户端，现已宣布关闭。\n- 豪华电瓶车 / 高端电动自行车：苹果和奥迪前员工创业推出的高价电动自行车产品。\n\n【对你有啥用】\n1. 微软改口8GB内存这事，对你做工业软件产品有启发。工业客户现场设备配置往往不高，8GB是常见下限。如果微软能优化系统让8GB流畅跑，你设计排程算法或决策智能平台时，也可以考虑在低配硬件上做轻量化部署，降低客户IT门槛，这能成为跟电池、钢铁厂客户沟通时的卖点。\n2. GPT-5.6的发布和出口管制，直接关系到你公司决策智能平台的技术路线。如果依赖OpenAI模型，未来可能受限，建议你关注国产大模型（如DeepSeek、通义千问）在供应链优化场景的适配性，或者研究小模型+本地部署方案，这能提升产品自主可控性，也是跟客户谈数据安全时的加分项。\n3. Notion Mail关停提醒你，做工具产品要关注商业模式和用户粘性。你在做工业软件+AI产品时，可以思考如何让排程算法或决策平台形成数据闭环和迁移成本，避免客户轻易替换。另外，这条早报的聚合形式，也值得你学习做内容产出——每周整理几条AI+供应链动态发给客户，能建立专业形象。\n\n【想深入可以搜】\n- Windows 11 8GB内存优化原理\n- GPT-5.6 出口管制影响\n- Notion Mail 关闭原因分析\n\n【口播版】\n微软改口了，说8GB内存就能跑Windows 11，之前可是推荐16GB的。这对咱们做工业软件的来说是个信号，客户现场设备配置往往不高，8GB是常见下限。如果你能把排程算法或者决策平台也优化到能在低配硬件上流畅跑，那跟电池厂、钢铁厂客户聊的时候，这就是个实打实的卖点。然后OpenAI发布了GPT-5.6，但说要美国政府批准才能给谁用。这直接关系到你公司决策平台的技术路线，如果依赖OpenAI模型，未来可能受限。建议你开始研究国产大模型在供应链优化场景的适配，或者搞小模型本地部署，既能提升自主可控，也能跟客户强调数据安全。还有Notion Mail宣布关闭，提醒咱们做工具产品的一定要关注商业模式和用户粘性。你做的排程算法能不能形成数据闭环，让客户用了就离不开，这事儿挺值得琢磨。", "score": 6, "category": "AI大事", "date": "2026-06-30"}, {"title": "Librepods: AirPods liberated", "source": "HackerNews", "author": "rbanffy · 340 pts · 111 comments", "published": "2026-06-28T18:48:53Z", "url": "https://github.com/librepods-org/librepods", "summary": "【中文标题】Librepods：解放 AirPods\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】一个开源项目让 AirPods 在非苹果设备上也能用上空间音频、自动切换等高级功能，但苹果很可能后续会封堵。\n\n【详细讲给你听】背景是 AirPods 作为蓝牙耳机，在安卓、Windows 等非苹果设备上本来就能当普通耳机用，但苹果把空间音频、设备间自动切换、电量弹窗这些“真香”功能锁在了自家生态里。这个叫 Librepods 的开源项目，通过逆向工程实现了这些苹果专属接口，让 AirPods 在其他平台上也能获得接近苹果生态的体验。关键细节有三点：第一，项目在 HackerNews 上获得了 340 分和 111 条评论，说明开发者社区对“破解苹果围墙”有强烈兴趣；第二，有评论者明确指出苹果大概率会通过固件更新封堵这些漏洞，类似之前对 AirDrop 开源项目 OpenDrop 的做法；第三，项目本身是纯软件方案，不需要硬件改装，降低了使用门槛。影响方面，这本质是“硬件开放但软件封闭”的典型对抗——苹果用软件锁定硬件溢价，开源社区用逆向工程试图打破垄断，但商业公司有法律和技术双重手段反制。\n\n【关键术语小词典】\n- AirPods / 苹果无线耳机：苹果公司推出的真无线蓝牙耳机，与苹果设备有深度软硬件集成。\n- 逆向工程 / Reverse Engineering：通过分析成品来推导其设计原理和实现方法的技术手段。\n- OpenDrop / 开源隔空投送：一个试图逆向实现苹果 AirDrop 功能的开源项目，目前处于停滞状态。\n\n【对你有啥用】第一，这个案例直接映射工业软件领域的“平台锁定”问题。你做的排程算法和决策智能平台，如果只绑定特定数据库或云服务，客户会担心被锁定。Librepods 的教训是：硬件开放但软件封闭反而会激发开源替代，不如主动开放 API 建立生态。第二，下次跟电池或医药客户聊产品落地时，可以拿这个例子说明“封闭 vs 开放”的取舍。客户往往担心供应商跑路或技术不兼容，你可以强调你的平台支持标准接口和开源组件，降低他们的迁移成本。第三，这个项目展示了“逆向工程+社区协作”的产品化路径，对你学习 AI Agent 和开发者工具有启发——很多 LLM 应用也是通过逆向 ChatGPT 的 API 行为来构建的，但同样面临官方封堵风险，做产品时要评估这种“寄生式创新”的可持续性。\n\n【想深入可以搜】\n- Librepods GitHub 仓库\n- Apple AirPods 固件更新历史\n- 逆向工程在工业软件中的应用案例\n\n【口播版】今天聊一个挺有意思的开源项目叫 Librepods。说白了就是有人把 AirPods 在苹果设备上那些专属功能，比如空间音频、自动切换，给逆向工程出来了，让 AirPods 在安卓和 Windows 上也能用。但问题来了，苹果大概率会通过固件更新封堵这个漏洞。咱们做产品的，这个案例特别值得琢磨。它本质上就是平台锁定的问题。你做的排程算法和决策智能平台，如果只绑定特定数据库或者云服务，客户就会担心被锁定。Librepods 的教训是，硬件开放但软件封闭反而会逼出开源替代。下次跟电池或者医药客户聊产品落地，可以拿这个例子说明开放接口的重要性。另外，这个项目也提醒我们，做 AI Agent 或者 LLM 应用的时候，如果依赖逆向别人的 API，同样面临被官方封堵的风险。这事儿挺值得琢磨，尤其是咱们做工业软件和 AI 落地的。", "score": 6, "category": "技术圈", "date": "2026-06-29"}, {"title": "siyuan-note/siyuan 发布 SiYuan v3.7.0-rc.1", "source": "GitHubRelease", "author": "github-actions[bot]", "published": "2026-06-28T16:10:09Z", "url": "https://github.com/siyuan-note/siyuan/releases/tag/v3.7.0-rc.1", "summary": "【中文标题】思源笔记发布 v3.7.0-rc.1 版本\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】思源笔记发布了新版本，主要更新包括内核插件系统、命令行界面、新设置界面和默认主题，以及一些安全模式和同步优化。\n\n【详细讲给你听】思源笔记是一款开源的个人知识管理工具，类似 Notion 或 Obsidian。这次 v3.7.0-rc.1 是候选发布版，意味着功能基本稳定。核心变化有几个：一是引入了内核插件系统，这意味着开发者可以编写插件直接与笔记软件底层交互，扩展性大幅提升；二是增加了命令行界面，对开发者更友好，可以脚本化操作；三是全新的设置界面和默认主题，用户体验更现代。另外，桌面端新增安全模式启动，方便排查问题；Windows 下数据同步失败时会自动刷新本地 DNS 缓存并重试，这是针对网络不稳定场景的实用优化。整体看，这次更新偏向底层能力和开发者生态建设，而非面向普通用户的新功能。\n\n【关键术语小词典】\n- Kernel plugin system / 内核插件系统：允许插件直接访问软件核心功能的架构，比普通插件更强大。\n- CLI / 命令行界面：通过输入文字命令来操作软件，适合自动化脚本和开发者。\n- Safe Mode / 安全模式：启动软件时禁用所有插件和自定义设置，用于排查故障。\n\n【对你有啥用】第一，思源笔记的内核插件系统是一个很好的产品设计案例。你做的决策智能平台如果也想开放插件生态，可以研究它如何平衡核心稳定性和扩展性，这对你们平台的 API 设计有参考价值。第二，命令行界面的加入说明工具产品正在向“可编程”演进，你在做供应链排程产品时，也可以考虑给客户提供 CLI 或脚本接口，让技术用户能自动化批量操作，这会成为差异化卖点。第三，安全模式和 DNS 自动重试这类“防御性功能”值得注意，工业软件客户对稳定性极其敏感，下次跟客户聊产品可靠性时，可以举这类例子说明你们对异常场景的处理思路。\n\n【想深入可以搜】思源笔记插件开发文档；知识管理工具产品对比；工业软件 CLI 设计最佳实践\n\n【口播版】思源笔记发布了 v3.7.0 候选版，这次更新对普通用户来说可能只是界面变好看了，但对咱们做产品的来说，有几个点值得琢磨。它加入了内核插件系统和命令行界面，这意味着思源正在从个人笔记工具向可扩展平台转型。咱们做决策智能平台的，可以想想自己的产品是不是也需要类似的插件架构。另外，它加了安全模式和 DNS 自动重试，这些看似不起眼的功能，在工业客户眼里就是稳定性的保障。下次跟客户聊产品可靠性，可以拿这类细节举例。总的来说，一个开源笔记软件的版本更新，背后反映的是产品从工具到平台的进化逻辑，这事儿挺值得琢磨。", "score": 6, "category": "GitHub 动态", "date": "2026-06-29"}, {"title": "The curious case of the disappearing Polish S (2015)", "source": "HackerNews", "author": "colinprince · 227 pts · 74 comments", "published": "2026-06-28T12:44:24Z", "url": "https://aresluna.org/the-curious-case-of-the-disappearing-polish-s/", "summary": "【中文标题】波兰字母S消失的奇怪案例（2015）\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】一篇2015年的技术文章，讲波兰语字母“ś”在网页输入时经常被浏览器或软件拦截，导致用户无法正常输入，背后涉及键盘快捷键冲突、Unicode编码和开发者习惯问题。\n\n【详细讲给你听】背景是波兰语使用拉丁字母加变音符号，比如“ś”是s加一个尖音符。但在很多网页或应用中，用户按Alt+S或Ctrl+S时，浏览器或软件会优先触发“保存”或“另存为”等快捷键，导致“ś”无法输入。核心是开发者没有考虑非英语用户的输入需求，尤其是波兰语这种有变音字母的语言。关键细节：1）波兰语有9个特殊字母，其中8个在Unicode分解后会变成基础字母加组合变音符号，但“ł”是个例外，无法用标准方法去掉变音。2）评论区有人吐槽微软Copilot 365，每次打“Ć”就会弹出Copilot，得手动关掉。3）浏览器没有提供简单的方法让开发者检查按键组合，导致问题长期存在。影响是：这不仅是波兰语的问题，任何使用变音符号的语言（如法语、德语、西班牙语）都面临类似困境。对开发者来说，这是一个提醒：国际化输入需要更细致的处理，不能只考虑英语用户。\n\n【关键术语小词典】无特殊术语（但可提：Unicode Normalization Form Canonical Decomposition / Unicode规范化分解：把带变音符号的字母拆成基础字母和变音符号，用于文本标准化处理。）\n\n【对你有啥用】1. 产品设计启示：你做工业软件和决策智能平台，客户可能来自全球，包括波兰、德国等非英语国家。如果产品有输入框或快捷键，一定要测试变音字母输入，避免像Copilot那样干扰用户。2. 客户沟通素材：下次和欧洲制造业客户聊时，可以提这个案例，展示你对国际化细节的关注，能拉近关系。3. 学习路径：研究一下Unicode规范化（NFC/NFD）和输入法处理，这对AI Agent处理多语言数据很有用，比如供应链数据中的非英语字段。\n\n【想深入可以搜】Polish diacritics keyboard shortcut conflict；Unicode normalization NFC NFD difference；Internationalization input handling best practices\n\n【口播版】今天聊一个2015年的技术老帖，但问题到今天都没完全解决。波兰语字母“ś”在网页里经常打不出来，因为浏览器或软件把Alt+S或Ctrl+S抢去当快捷键用了。评论区有人吐槽，微软Copilot 365每次打“Ć”就弹出来，得手动关掉。这背后是开发者习惯只考虑英语用户，没处理变音符号输入。咱们做产品的，如果客户在欧洲，比如德国或波兰，输入框和快捷键一定要测一下变音字母。不然客户一边排产一边弹Copilot，体验直接崩。这事儿挺值得琢磨，国际化不只是翻译界面，得从按键级别开始想。", "score": 6, "category": "技术圈", "date": "2026-06-29"}, {"title": "给记忆一个归处：我为什么开始使用 Apple 手记", "source": "少数派", "author": "ElijahLee", "published": "2026-06-25T07:40:12", "url": "https://sspai.com/post/111421", "summary": "【中文标题】给记忆一个归处：我为什么开始使用 Apple 手记\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】作者分享了自己从抗拒到频繁使用 Apple 原生日记应用“手记”的过程，认为它通过低门槛的碎片记录和回顾功能，帮助自己对抗遗忘、培养反思习惯。\n\n【详细讲给你听】这篇文章的背景是 Apple 在 iOS 17.2 中推出了原生“手记”应用，但很多人（包括作者）一开始觉得它功能简单、不如第三方日记应用。核心转折是作者发现“手记”的核心价值不在于写长篇日记，而在于“随手记”和“自动回顾”。关键细节有三：第一，它利用手机里的照片、位置、音乐等数据自动生成“建议”，用户只需点一下就能记录，极大降低了启动成本。第二，作者强调“记录”比“写日记”更重要，因为大脑会遗忘，而手记充当了外部记忆库。第三，作者通过定期回顾（比如每周看一次）来强化对生活的感知，而不是追求每日更新。机制上，这其实利用了心理学中的“蔡格尼克效应”和“峰终定律”——记录下未完成或高光时刻，能减少认知负担并提升幸福感。对普通人来说，这提供了一个对抗数字碎片化、培养正念的轻量工具。\n\n【关键术语小词典】\n- 蔡格尼克效应：人对未完成任务的记忆比已完成任务更清晰的心理现象。\n- 峰终定律：人对一段体验的评价主要基于高峰时刻和结束时的感受。\n\n【对你有啥用】第一，这个思路可以迁移到你的产品设计里。如果你在做决策智能平台，可以考虑给用户提供“自动建议”功能，比如根据历史数据或操作日志，自动生成“决策回顾”或“异常快照”，降低用户记录和复盘的门槛。第二，作为 PM，你经常需要跟客户沟通“价值”，这篇文章的“低启动成本”逻辑可以直接用在产品推广话术里，强调“不用刻意操作，系统自动帮你沉淀经验”。第三，对你个人产能提升也有启发：可以用类似“手记”的逻辑，在 Cursor 或 Claude 里设置一个“每日工作日志”模板，每天花 30 秒记录一个关键决策或失败点，长期积累就是你的个人产品案例库。\n\n【想深入可以搜】\n- Apple 手记 应用 使用技巧\n- 蔡格尼克效应 产品设计\n- 数字日记 习惯养成 心理学\n\n【口播版】今天聊一篇少数派的文章，讲的是 Apple 原生的“手记”应用。作者一开始觉得这玩意儿功能太简单，但后来发现它的核心价值根本不是写日记，而是帮你随手记。怎么记呢？它自动抓你手机里的照片、位置、音乐，生成一个“建议”，你点一下就能存下来。说白了，就是把你从“我要写一篇好日记”的压力里解放出来。然后你每周翻一翻，就能对抗遗忘，还能培养反思习惯。咱们做产品的，这个思路其实挺值得琢磨。你想想，你的决策智能平台能不能也搞个“自动建议”功能？比如根据用户的操作日志，自动生成一个“决策回顾”或者“异常快照”，让用户不用刻意操作就能沉淀经验。这比你逼着客户写周报好用多了。另外，你自己也可以试试，在 Cursor 里设个模板，每天花 30 秒记一个关键决策或失败点，长期下来就是你的个人案例库。这事儿挺值得琢磨。", "score": 6, "category": "心理学", "date": "2026-06-28"}, {"title": "派早报：豆包推出专业版、GTA VI 开启预售等", "source": "少数派", "author": "少数派编辑部", "published": "2026-06-25T00:51:49", "url": "https://sspai.com/post/111476", "summary": "【中文标题】\n派早报：豆包推出专业版、GTA VI 开启预售等\n\n【相关性评分】\n6\n\n【一句话讲清楚它在说啥】\n少数派早报汇总了豆包推出付费专业版、GTA VI 开启预售、OpenAI 发布推理芯片 Jalapeño 等几条科技新闻，属于信息速览。\n\n【详细讲给你听】\n背景：少数派是中文科技媒体，每天会发早报汇总前一天的科技动态，方便读者快速了解行业新闻。核心是几条独立新闻的罗列：豆包（字节跳动的 AI 助手）推出了专业版，意味着从免费转向订阅制收费；GTA VI 开启预售，这是游戏圈大事件；OpenAI 发布了名为 Jalapeño 的 AI 推理芯片，说明他们开始自研硬件来降低推理成本。关键细节：豆包专业版的具体定价和功能差异没有在摘要里展开，但“专业版”三个字暗示了产品分层策略。OpenAI 的芯片消息是重点，Jalapeño 应该是针对推理场景优化的专用芯片，类似 Google 的 TPU 或 AWS 的 Trainium。影响：对开发者来说，OpenAI 自研芯片可能意味着未来 API 调用成本下降；对产品经理来说，豆包专业版是 AI 助手商业化的重要信号，值得关注定价模型和用户转化率。\n\n【关键术语小词典】\n- OpenAI：美国人工智能研究公司，开发了 GPT 系列模型。\n- Jalapeño：OpenAI 发布的 AI 推理芯片名称，用于加速模型运行。\n- 豆包：字节跳动推出的 AI 对话助手，类似 ChatGPT。\n- GTA VI：游戏《侠盗猎车手 VI》，知名开放世界游戏系列新作。\n\n【对你有啥用】\n1. 豆包推出专业版，说明国内 AI 助手开始走订阅制路线。你作为决策智能平台的产品经理，可以关注字节的定价策略和功能分层，下次跟客户聊 AI 产品商业化时，拿这个案例说明“免费+付费”的可行性。\n2. OpenAI 自研推理芯片，意味着未来 API 成本可能下降。这对你公司做 AI 决策平台是利好，因为底层推理成本降低后，你们可以给客户报更低的价格，或者把省下来的钱投入算法优化。建议你跟进 Jalapeño 的性能数据，评估是否会影响你们的模型部署策略。\n3. 这条早报本身信息密度低，但“GTA VI 预售”这种跨行业新闻值得留意。游戏行业的预售模式（限量版、预购奖励）可以启发你设计工业软件的产品发布策略，比如给早期客户提供“决策智能平台抢先体验版”或“排程算法定制服务”。\n\n【想深入可以搜】\n- 豆包专业版 定价 功能对比\n- OpenAI Jalapeño 芯片 性能 成本\n- GTA VI 预售 商业模式 分析\n\n【口播版】\n今天少数派早报里几条新闻值得你扫一眼。豆包出专业版了，字节的 AI 助手开始搞订阅制，说明免费模式撑不住了，得靠付费功能赚钱。咱们做产品的可以琢磨一下，他们怎么设计功能分层，哪些能力放免费版，哪些放付费版。另一个重点是 OpenAI 发了自己的推理芯片，叫 Jalapeño。这玩意儿要是真能降成本，对你们公司做决策平台是直接利好，API 调用费低了，客户更愿意用。至于 GTA VI 预售，虽然跟工业软件不沾边，但游戏行业的预售策略，比如限量版、预购奖励，其实能启发你怎么设计工业软件的首发方案。给客户一个“早期合作者专属排程算法包”，说不定能提高转化率。这条早报信息比较碎，但里面藏着产品商业化的信号，值得你花十分钟深挖一下豆包专业版的定价细节。", "score": 6, "category": "AI大事", "date": "2026-06-27"}, {"title": "Sex and gender classification in clinical decision-support tools: a cross-sectional review of tools on MDCalc.", "source": "PubMed", "author": "Brototo Deb, Timothy Lim, Ian K Everitt, Carl G Streed", "published": "2026", "url": "https://pubmed.ncbi.nlm.nih.gov/42366422/", "summary": "【中文标题】临床决策支持工具中的性别分类：MDCalc 工具横断面研究\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇论文检查了 MDCalc 网站上 84 个临床决策工具，发现五分之一工具在“生理性别”和“社会性别”的标签、选项和底层数据之间存在混淆，可能影响 AI 诊断的准确性和公平性。\n\n【详细讲给你听】背景是现在越来越多的临床决策工具开始用算法和 AI 来辅助医生做判断，比如根据病人的性别、年龄等变量给出诊断建议。但问题来了：这些工具里“sex”（生理性别，男/女）和“gender”（社会性别，男性/女性）经常被混用。核心发现是：研究者扫了 MDCalc 上 821 个工具，只有 84 个（10.2%）用了性别变量。其中 98.8% 的工具只给二元选项（男/女或男性/女性），但 19% 的工具存在标签和选项不匹配——比如标签写“sex”但选项是“man/woman”。更关键的是，有 25.7% 的工具在引用原始研究时，原始数据收集方式（比如是问生理性别还是自我认同的性别）跟工具界面上的标签也对不上。这些工具中 84.5% 被评估为有中到高临床影响。机制上，这种混淆会导致算法输入变量定义不清晰，比如一个工具把“女性”当成生理性别，但底层数据其实是基于社会性别收集的，那模型输出的风险评分就可能不准，尤其对跨性别或非二元性别群体影响更大。说白了，这不是咬文嚼字，而是变量规格错误，会直接污染 AI 模型的训练和推理。\n\n【关键术语小词典】\n- Sex / 生理性别：基于生物学特征（染色体、激素）的男/女分类。\n- Gender / 社会性别：基于社会角色、身份认同的男性/女性/非二元分类。\n- MDCalc：一个医生常用的在线临床决策工具数据库，类似医疗界的“计算器库”。\n- Sex-gender conflation / 性别混淆：工具中生理性别和社会性别的标签、选项或数据来源不一致。\n\n【对你有啥用】第一，你做供应链排程算法，客户数据里可能也有类似问题。比如工厂的“物料类别”标签（原材料 vs 半成品）和实际数据采集方式（是仓库扫码还是人工录入）如果不一致，你的 AI 模型就会学偏。下次跟客户聊数据治理时，可以拿这个研究当案例，强调“变量定义一致性”对算法落地的关键性。第二，你关注 AI Agent 应用，这提醒你：任何 AI 工具在接入真实业务数据时，必须做“变量规格审计”。比如你给电池厂做排产，如果“设备状态”这个字段有的来自传感器（连续值）、有的来自人工填报（离散值），那你的 Agent 在推理时就会产生歧义。第三，从产品角度，这篇论文展示了“界面设计”如何影响算法公平性。你在设计决策智能平台时，用户输入界面的标签、选项和底层数据模型必须严格对齐，否则用户（比如计划员）可能无意中输错数据，导致排程结果偏差。\n\n【想深入可以搜】\n- sex vs gender variable specification in clinical AI\n- MDCalc sex gender conflation study\n- 变量定义一致性 算法公平性 工业软件\n\n【口播版】今天聊一篇关于临床决策工具的论文，但我觉得对咱们做工业软件和 AI 产品的也很有启发。研究者检查了 MDCalc 上 84 个工具，发现五分之一存在性别变量混淆的问题。比如标签写的是生理性别，但选项却是社会性别的叫法，或者底层数据来源跟界面标签对不上。这听起来像文字游戏，但问题很实在：变量定义不一致，AI 模型就会学偏。咱们做供应链排程的，想想看，如果物料类别字段，有的来自传感器自动采集，有的来自人工录入，那算法输出的排产建议能准吗？所以这篇论文的核心结论是，变量规格审计必须前置。下次你跟客户聊数据治理时，完全可以拿这个当案例，强调标签、选项和底层数据三者的对齐。这对你设计决策智能平台的用户界面也有直接参考：输入框的标签和下拉选项，必须跟后端数据模型严格对应，否则用户一个误操作，整个排程结果就偏了。这事儿挺值得琢磨，尤其你今年想深化工业软件加 AI 的产品理解，变量定义一致性就是个容易被忽略但很关键的切入点。", "score": 6, "category": "心理学", "date": "2026-06-29"}, {"title": "A fellows first night on call: managing the chaos in the storm.", "source": "PubMed", "author": "Daniel B Hanna, Douglas W Harrington, Sankalp Patel, Mazen Albaghdadi", "published": "2026", "url": "https://pubmed.ncbi.nlm.nih.gov/42374426/", "summary": "【中文标题】心脏科住院总医师首个夜班：在风暴中管理混乱\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇论文讲的是用高仿真模拟训练让新来的心脏科住院总医师提前体验夜班高压场景，结果发现这种训练能显著提升他们在紧急情况下的决策和领导能力。\n\n【详细讲给你听】背景是传统的心脏科岗前培训很少让新人直接面对高认知负荷下的夜间紧急决策，这就像让一个刚拿到驾照的人直接上高速开夜车，风险很高。核心是研究者设计了一套多场景、高保真的“夜班模拟训练”，让新住院总医师在模拟环境中处理一连串急性心血管急症，旁边有模拟护士和标准化病人配合，结束后用PEARLS框架进行结构化复盘。关键细节有三：一是只有五位住院总医师参与，样本很小但效果明显；二是训练后所有领域的信心都提升了，其中决策和领导力提升最大；三是带教老师观察到随着场景推进，学员的情境意识和优先级排序能力在增强。影响在于这种模拟训练被证明是可行、可复制的，能作为高效的岗前培训模型，让带教老师提前发现学员的薄弱点，给出个性化反馈，从而帮助学员更快达到“掌握学习”水平，为真正的夜班责任做好准备。\n\n【关键术语小词典】\n- PEARLS框架：一种结构化复盘方法，用于引导学员反思和总结模拟训练中的经验教训。\n- 高保真模拟：高度还原真实临床环境的模拟训练，包括设备、场景和人员互动。\n- 掌握学习：一种教学理念，确保学员在进入下一阶段前完全掌握当前内容。\n\n【对你有啥用】1. 这个“高保真模拟+结构化复盘”的思路，可以直接搬到工业软件的产品演示或客户培训中。比如给电池厂客户演示排程算法时，不要只讲PPT，而是搭建一个模拟产线故障的沙盘环境，让客户亲自操作并复盘决策，这比任何文档都更能建立信任。2. 你关注AI Agent在供应链中的应用，这篇论文里“多场景连续压力测试”的方法，可以借鉴来设计Agent的评估体系。别只测单点任务，要模拟一连串突发状况（比如原料断供+设备故障+订单加急），看Agent如何动态调整排产策略，这才能真正验证产品在客户现场的鲁棒性。3. 从产品经理视角看，这篇论文展示了“如何用低成本、高复用的方式解决高风险的培训问题”。你在做决策智能平台时，可以思考能否把这种“模拟环境”做成产品的一个模块，让客户自己用历史数据跑“如果-那么”场景，这既是卖点，也是降低客户决策门槛的工具。\n\n【想深入可以搜】\n- PEARLS debriefing framework healthcare\n- high-fidelity simulation cardiology training\n- mastery learning in medical education\n\n【口播版】今天聊一篇心理学方向的论文，讲的是怎么让心脏科住院总医师在真正值夜班之前，先在高仿真模拟环境里经历一场“风暴”。传统培训很少让新人直接面对高认知负荷的紧急决策，就像让新手直接上高速。研究者设计了一套多场景的夜班模拟训练，让学员连续处理急性心血管急症，结束后用PEARLS框架做结构化复盘。结果呢，虽然只有五个学员参与，但训练后他们在决策和领导力上的信心提升最大。带教老师还观察到，随着场景推进，学员的情境意识和优先级排序能力在增强。说白了，这种模拟训练不仅可行，还能让老师提前发现每个人的薄弱点，给出个性化反馈。咱们做产品的可以想想，给客户演示排程算法时，能不能也搭一个模拟产线故障的沙盘环境，让客户亲手操作并复盘。这比任何PPT都更能建立信任。另外，你关注AI Agent在供应链中的应用，这篇论文里“多场景连续压力测试”的思路，完全可以用来设计Agent的评估体系。别只测单点任务，要模拟一连串突发状况，看Agent怎么动态调整。这事儿挺值得琢磨。", "score": 6, "category": "心理学", "date": "2026-06-30"}, {"title": "Implicit gender bias modulates lateral prefrontal cortex activity and rejection of female advice during cooperative decision making.", "source": "PubMed", "author": "Serra Yağış, Duygu Salman, Harun Emre Yıldız, Burak Güçlü", "published": "2026", "url": "https://pubmed.ncbi.nlm.nih.gov/42380222/", "summary": "【中文标题】合作决策中内隐性别偏见调节外侧前额叶活动与对女性建议的拒绝\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇研究用脑电图发现，男性在合作中拒绝女性建议时，内隐性别偏见高的人大脑特定区域活动不同，且更容易做出错误决策。\n\n【详细讲给你听】背景是职场里女性领导力常被低估，即使有平等政策，隐性偏见仍在起作用。之前研究多靠问卷或行为实验，但这篇用上了脑电图和偶极子定位，想看看实时合作中大脑怎么处理性别偏见。核心是让男性作为决策者，评估女性搭档的建议并决定是否采纳。关键细节有三：第一，高偏见组拒绝女性建议的比例是57%，低偏见组是55%，表面差不多。第二，但高偏见组拒绝后导致错误决策的比例高达54%，低偏见组只有34%，说明高偏见组的拒绝更“非理性”、更“代价高昂”。第三，脑电图显示，高偏见组在决策时，中额回（MFG）活动更低，而额下回（IFG）活动更高，且IFG的活动强度与内隐偏见分数直接相关。机制上，MFG通常负责理性控制和冲突解决，活动低意味着高偏见者更少动用理性思考；IFG与社交认知和冲动抑制有关，活动高可能代表他们在处理偏见引发的情绪冲突。简单说，高偏见者不是更频繁拒绝，而是拒绝时更不理智，大脑的“理性刹车”没踩住。\n\n【关键术语小词典】\n- MFG / 中额回：大脑前额叶区域，负责工作记忆、决策和冲突监控，像理性思考的“控制中心”。\n- IFG / 额下回：大脑前额叶区域，与语言、社交认知和抑制控制有关，像处理社交信号的“调节器”。\n- IAT / 内隐联想测验：测量人们无意识偏见的心理测试，通过反应时差异判断自动联想。\n- BRI / 偏见拒绝指数：本研究提出的新指标，专门衡量“代价高昂的拒绝行为”，即拒绝正确建议导致错误。\n\n【对你有啥用】第一，做决策智能产品时，这个“代价高昂的拒绝”概念可以迁移到排产算法里。比如客户工厂里，老员工可能无意识拒绝AI推荐的优化方案，导致效率损失。你可以用类似BRI的指标，量化“非理性拒绝”的成本，作为产品价值点跟客户沟通。第二，这篇研究用的是脑电图实时追踪决策过程，对你理解“人机协作中的信任与偏见”有启发。如果你在开发AI辅助决策工具，用户对AI建议的拒绝可能也受隐性偏见影响，比如对“算法不透明”的刻板印象。第三，内容产出上，你可以写一篇“为什么你的客户总拒绝AI建议？大脑机制告诉你答案”，把这篇心理学研究翻译成工业软件场景的洞察，能帮你建立专业形象。\n\n【想深入可以搜】\n- 内隐偏见 决策 神经机制\n- 代价高昂的拒绝 行为经济学\n- EEG 合作决策 前额叶\n\n【口播版】今天聊一篇心理学研究，讲的是合作决策里内隐性别偏见怎么影响大脑活动。简单说就是，让男性当决策者，评估女性搭档的建议，然后决定要不要采纳。结果发现，内隐偏见高的人拒绝女性建议的比例跟低偏见的人差不多，都是55%到57%左右。但问题来了，高偏见组的拒绝导致错误决策的比例高达54%，低偏见组只有34%。说白了，高偏见者不是更爱拒绝，而是拒绝得更不理性，代价更高。脑电图也证实了这一点，高偏见者在决策时，负责理性控制的中额回活动更弱，而处理社交冲突的额下回活动更强。这跟咱们做产品的有什么关系呢。如果你在做AI决策工具，客户工厂里老员工可能也会无意识拒绝AI推荐，导致效率损失。你可以用类似“代价高昂的拒绝”这个指标，量化这种非理性行为，直接跟客户讲清楚价值。这事儿挺值得琢磨。", "score": 6, "category": "心理学", "date": "2026-07-01"}, {"title": "Case studies on predictive maintenance of aircraft large-opening panels using integrated planar electromagnetic sensing and dynamic Bayesian networks.", "source": "PubMed", "author": "Shuyang He, Xin Qi, Biao Li", "published": "2026", "url": "https://pubmed.ncbi.nlm.nih.gov/42380170/", "summary": "【中文标题】飞机大开口蒙皮预测性维护案例研究：集成平面电磁传感与动态贝叶斯网络\n\n【相关性评分】6\n\n【一句话讲清楚它在说啥】这篇论文讲的是用柔性电磁传感器阵列实时监测飞机蒙皮裂纹，结合动态贝叶斯网络预测裂纹生长，从而决定什么时候修、怎么修，比传统方法更准更省钱。\n\n【详细讲给你听】背景是飞机结构上有大开口（比如检修口），这些地方容易疲劳开裂，传统检测靠定期人工检查，要么漏检要么过度维修。这篇研究搞了一套新方案：先用一种柔性平面涡流传感器阵列贴在蒙皮上，能实时监测裂纹，最小能测到0.3毫米的裂纹，空间分辨率2毫米，相当于在关键位置装了个“皮肤贴片”随时看。然后核心是算法部分——他们用动态贝叶斯网络结合粒子滤波和Walker裂纹增长模型，把传感器数据不断喂进去，动态更新裂纹生长的概率预测。实验证明，这套方法比传统的确定性模型（比如固定公式算寿命）不确定性大幅降低，预测更准。最后基于预测的裂纹演化，建立了一个健康指数驱动的维护策略，能智能选择是简单修补还是换板子，以及最佳维修时机。说白了，就是把“修飞机”从“定时修”变成了“按需修”，既安全又省钱。\n\n【关键术语小词典】\n- Dynamic Bayesian Network / 动态贝叶斯网络：一种能随时间更新概率预测的模型，适合处理裂纹这种不确定过程。\n- Particle Filter / 粒子滤波：一种用一堆“猜测点”来逼近真实状态的算法，常用于机器人定位、故障预测。\n- Eddy Current Sensor / 涡流传感器：通过电磁感应检测金属表面裂纹的传感器，不接触也能测。\n- Condition-Based Maintenance / 基于状态的维护：根据设备实际健康状态决定何时维修，而不是固定时间。\n\n【对你有啥用】\n1. 这套“传感器实时监测 + 概率预测模型 + 维护决策”的框架，跟你做的供应链排程/决策智能平台逻辑高度相似。你可以思考：在电池产线或钢铁产线里，能不能用类似思路——用IoT传感器数据（温度、振动、电流）实时监测设备健康，然后用贝叶斯网络预测故障概率，最后动态调整排产计划或维护计划。这能直接跟客户聊“从被动维修到主动维护”的价值。\n2. 动态贝叶斯网络在处理不确定性方面比传统规则模型强，你可以在跟客户沟通时提这个概念：工业场景里很多变量（如原材料批次差异、设备老化）是不确定的，用概率模型比确定性模型更接近真实世界。这能提升你作为PM在技术对话中的专业度。\n3. 这篇论文来自PubMed（心理学方向），但实际是工程+AI交叉。这说明跨学科文献能给你带来产品灵感。建议你定期扫一下其他领域的顶会/期刊（如IEEE可靠性、机械工程学报），找“预测+决策”的案例，直接复用思路到供应链优化。\n\n【想深入可以搜】\n- Dynamic Bayesian network predictive maintenance industrial\n- Condition-based maintenance decision framework manufacturing\n- Eddy current sensor array crack monitoring\n\n【口播版】今天聊一篇飞机蒙皮预测性维护的论文，但别被标题吓到，它背后的思路跟你做供应链决策平台直接相关。核心就三件事：用柔性传感器实时监测裂纹，用动态贝叶斯网络预测裂纹怎么长，然后根据预测结果决定什么时候修、怎么修。说白了，就是把“定时修”变成“按需修”。这套框架跟你做的排产算法很像，都是拿实时数据喂模型，动态输出决策。而且它用概率模型而不是固定公式，处理不确定性更准。下次跟电池或钢铁客户聊设备维护，你可以提这个思路：能不能用IoT传感器加贝叶斯网络，把故障预测和排产联动起来？这事儿挺值得琢磨。", "score": 6, "category": "心理学", "date": "2026-07-01"}];

  if(e.key==='Escape'){if(String(view).startsWith('item:')){view=prevView;render();}else{qI.value='';query='';render();qI.blur();}}
});

function esc(t){return(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(t){t=esc(t);if(!query)return t;try{const r=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return t.replace(r,'<mark>$1</mark>');}catch(e){return t;}}
function hhmm(p){const m=String(p||'').match(/T(\d{2}:\d{2})/)||String(p||'').match(/\b(\d{2}:\d{2})\b/);return m?m[1]:'';}
function fmtDate(d){const m=/(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?`${+m[2]}月${+m[3]}日 · ${m[1]}`:(d||'');}
/* 来源头像：按来源名确定性配柔和色 + 取首字 */
const AV=[['#fdebd6','#b25e16'],['#e4edfb','#3560a8'],['#e5f4ec','#1f7a4d'],['#efe8fb','#6b46c1'],['#fde7ef','#bd3b6e'],['#e2f2f5','#0e7490'],['#f1ece2','#7d6a44']];
function avatar(d,cls){
  const s=String(d.source||d.author||'·').trim();
  let ini;
  if(/^[A-Za-z]/.test(s)) ini=(s.match(/[A-Za-z]+/)[0]).slice(0,2).toUpperCase();
  else{const c=s.match(/[一-龥]/);ini=c?c[0]:s.slice(0,2);}
  let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  const [bg,fg]=AV[h%AV.length];
  return `<span class="av ${cls||''}" style="background:${bg};color:${fg}">${esc(ini)}</span>`;
}
/* 相关性分数徽标（琥珀色，醒目但不抢戏）*/
function scoreBadge(d,cls){
  if(!d.score)return '';
  return `<span class="sb ${cls||''}"><svg viewBox="0 0 24 24"><path d="M13 2L4.5 13h6l-1 9L19 11h-6z"/></svg>${d.score}</span>`;
}

/* ---- reading drawer ---- */
let idIndex={}, prevView='star';
function openItem(uid){
  if(!String(view).startsWith('item:')) prevView=view;
  view='item:'+uid; render();
  try{window.scrollTo(0,0);}catch(e){}
}
function rsec(l,v,c){return `<div class="rsec ${c||''}"><div class="lbl">${esc(l)}</div><div class="val">${esc(v)}</div></div>`;}
function renderItem(uid){
  const d=idIndex[uid];
  if(!d){view=prevView;return render();}
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const detail=PICK(p,'详细讲给你听','详细'),terms=PICK(p,'关键术语小词典','关键术语'),useful=PICK(p,'对你有啥用'),dig=PICK(p,'想深入可以搜'),spoken=PICK(p,'口播版'),one=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  const heat=d.score?`<span class="heat"><svg viewBox="0 0 24 24"><path d="M12 2s5 4 5 9a5 5 0 01-10 0c0-1 .3-2 .8-2.8C8 9 9 8 9 8s-.3 2 .7 2.8C10 9 12 6 12 6s-1 3 .5 4.2C13 9 13 7 13 7s2 2 2 4a3 3 0 01-6 0"/></svg>${d.score}</span>`:'';
  let h=`<div class="article"><div class="backlink" id="backlink">← 返回</div>`;
  h+=`<div class="amenu">${avatar(d,'lg')}<span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span><span>${esc(d.source||'')}</span>${d.author?`<span>· ${esc(d.author)}</span>`:''}<span>· ${esc((d.published||d.date||'').replace('T',' ').slice(0,16))}</span>${scoreBadge(d,'lg')}</div>`;
  h+=`<h2 class="atitle">${esc(PICK(p,'中文标题')||d.title)}</h2>`;
  if(one)h+=`<div class="lede">${esc(one)}</div>`;
  if(detail)h+=rsec('详细',detail);
  if(terms)h+=rsec('关键术语',terms);
  if(useful)h+=rsec('对你有啥用',useful,'use');
  if(dig)h+=rsec('想深入可以搜',dig);
  h+=`<div class="rlinks"><a class="btn pri" href="${esc(d.url)}" target="_blank" rel="noopener">↗ 看原文</a>`;
  if(spoken)h+=`<span class="btn" id="spokenBtn">🎧 口播版</span>`;
  h+=`</div>`;
  if(spoken)h+=`<div class="spoken rsec" id="spokenBox"><div class="lbl">口播版</div><div class="val">${esc(spoken)}</div></div>`;
  h+=`</div>`;
  content.innerHTML=h;
  document.getElementById('backlink').onclick=()=>{view=prevView;render();};
  const sb=document.getElementById('spokenBtn');if(sb)sb.onclick=()=>document.getElementById('spokenBox').classList.toggle('show');
}

/* ---- 精选：按领域分版块的精华（不是时间流）---- */
function featLead(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="feat-lead" data-uid="${d._uid}">
    <div class="fl-title">${hl(title)}</div>
    ${teaser?`<div class="fl-teaser">${hl(teaser)}</div>`:''}
    <div class="fl-meta">${avatar(d)}<span>${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</span>${scoreBadge(d)}</div>
  </div>`;
}
function featRow(d){
  const p=parseSummary(d.summary);
  const title=PICK(p,'中文标题')||d.title;
  return `<div class="frow" data-uid="${d._uid}">
    ${avatar(d,'sm')}
    <div class="fcol"><h4>${hl(title)}</h4><div class="fmeta">${esc(d.source||'')}${d.category?' · '+esc(d.category):''}</div></div>
    ${scoreBadge(d)}
  </div>`;
}
function renderFeatured(){
  document.getElementById('ttl').textContent='精选';
  let rows=DATA.filter(d=>(d.score||0)>=STAR);
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));
  document.getElementById('sub').textContent='各领域最值得看的 · '+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  idIndex={};rows.forEach((d,i)=>{d._uid='f'+i;idIndex['f'+i]=d;});
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的精选，换个关键词试试。</div>';return;}
  const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
  const pool=rows.filter(d=>d.date===latest);
  const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
  const lp=parseSummary(lead.summary);
  let html=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(lp,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  const K=7;  // 1 头条 + 6 紧凑
  GROUPS2.forEach(g=>{
    const items=rows.filter(d=>g.cats.includes(d.category)).sort((a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''));
    if(!items.length)return;
    html+=`<div class="feat-sec"><div class="feat-head"><span class="feat-ic">${g.ic}</span><span class="feat-name">${esc(g.label)}</span><span class="feat-count">${items.length} 条</span>`+
      (items.length>K?`<span class="feat-more" data-go="group:${g.key}">查看全部 →</span>`:'')+
      `</div>`+featLead(items[0]);
    const rest=items.slice(1,K);
    if(rest.length)html+=`<div class="feat-items">`+rest.map(featRow).join('')+`</div>`;
    html+=`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-go]').forEach(el=>el.onclick=(e)=>{e.stopPropagation();view=el.dataset.go;render();try{window.scrollTo(0,0);}catch(x){}});
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}

/* ---- render ---- */
const content=document.getElementById('content');
function render(){
  nav.querySelectorAll('.item').forEach(el=>el.classList.toggle('on',el.dataset.key===view));
  const isItem=String(view).startsWith('item:');
  document.getElementById('tools').style.display=(view==='about'||isItem)?'none':'';
  document.getElementById('ttl').style.display=isItem?'none':'';
  document.getElementById('sub').style.display=isItem?'none':'';
  // 精选按版块固定排（领域 + 相关性），排序选择器在这页无意义 → 隐藏（搜索保留）
  document.getElementById('sortSel').style.display=(view==='star')?'none':'';
  if(isItem)return renderItem(view.slice(5));
  if(view==='about')return renderAbout();
  if(view==='star')return renderFeatured();

  let rows=DATA.slice();let t='精选',s='相关性高的动态（评分 ≥ '+STAR+'）';
  if(view==='star'){rows=rows.filter(d=>(d.score||0)>=STAR);}
  else if(view==='all'){t='全部动态';s='按时间倒序的所有抓取条目';}
  else if(view.startsWith('group:')){const g=GROUPS2.find(x=>x.key===view.slice(6));const cs=g?g.cats:[];rows=rows.filter(d=>cs.includes(d.category));t=g?g.label:'领域';s='领域聚合 · '+(g?g.cats.filter(c=>allCats.includes(c)).join(' / '):'');}
  else if(view.startsWith('cat:')){const c=view.slice(4);rows=rows.filter(d=>d.category===c);t=c;s='方向：'+c;}
  if(query)rows=rows.filter(d=>((d.title||'')+' '+(d.summary||'')+' '+(d.source||'')).toLowerCase().includes(query));

  document.getElementById('ttl').textContent=t;
  document.getElementById('sub').textContent=s+'　·　'+rows.length+' 条'+(query?'（匹配“'+query+'”）':'');
  if(!rows.length){content.innerHTML='<div class="empty">没有匹配的内容，换个关键词或领域试试。</div>';return;}

  // index for reader
  idIndex={};rows.forEach((d,i)=>{d._uid='u'+i;idIndex['u'+i]=d;});

  let leadHtml='';
  if((view==='star'||view==='all')&&!query){
    const latest=rows.map(d=>d.date).filter(Boolean).sort().reverse()[0];
    const pool=rows.filter(d=>d.date===latest);const lead=(pool.length?pool:rows).slice().sort((a,b)=>(b.score||0)-(a.score||0))[0];
    const p=parseSummary(lead.summary);
    leadHtml=`<div class="lead" data-uid="${lead._uid}"><span class="bolt">⚡</span><div><div class="t">${esc(PICK(p,'中文标题')||lead.title)}</div><div class="m">最新热点 · ${esc(fmtDate(lead.date))} · ${esc(lead.category)}${lead.score?' · 相关性 '+lead.score:''}</div></div></div>`;
  }
  const useScore=sortBy==='score'||(sortBy==='auto'&&view==='star');
  const cmp=useScore?(a,b)=>(b.score||0)-(a.score||0)||(b.published||'').localeCompare(a.published||''):(a,b)=>(b.published||'').localeCompare(a.published||'');

  const groups={};rows.forEach(d=>{(groups[d.date||'未注明']=groups[d.date||'未注明']||[]).push(d);});
  let html=leadHtml;
  Object.keys(groups).sort().reverse().forEach(date=>{
    html+=`<div class="daterow"><span class="d">${esc(fmtDate(date))}</span><span class="ln"></span></div>`;
    html+=`<div class="daygroup">`+groups[date].sort(cmp).map(rowHtml).join('')+`</div>`;
  });
  content.innerHTML=html;
  content.querySelectorAll('[data-uid]').forEach(el=>el.onclick=()=>openItem(el.dataset.uid));
}
function rowHtml(d){
  const p=parseSummary(d.summary),[bg,fg]=tint(d.category);
  const title=PICK(p,'中文标题')||d.title;
  const teaser=PICK(p,'一句话讲清楚它在说啥','一句话讲清楚','一句话');
  return `<div class="row" data-uid="${d._uid}">
    <div class="time">${hhmm(d.published)}</div>
    <div class="col">
      <div class="meta">
        ${avatar(d,'sm')}
        <span class="src">${hl(d.source||'')}</span>
        ${d.author?`<span class="au">${hl(d.author)}</span>`:''}
        <span class="right">
          <span class="pill" style="background:${bg};color:${fg}">${esc(d.category)}</span>
          ${scoreBadge(d)}
        </span>
      </div>
      <h3>${hl(title)}</h3>
      ${teaser?`<div class="teaser">${hl(teaser)}</div>`:''}
    </div></div>`;
}
function renderAbout(){
  document.getElementById('ttl').textContent='关于';document.getElementById('sub').textContent='本地情报流 · 数据来自 web-intel-bot';
  content.innerHTML=`<div class="about">
  <p>把 web-intel-bot 抓取并 AI 摘要打分后的内容，做成一个 <b>能翻、能筛、能搜</b> 的情报流。形式参考 aihot，但数据是你自己的。</p>
  <p><b>怎么读不累：</b>列表只给标题 + 一句话，点任意一条 → 右侧滑出阅读面板看全文（详细 / 术语 / 对你有啥用 / 口播版）。列表永远清爽。</p>
  <p><b>分类：</b>bot 的话题桶归成 3 个领域（AI·技术 / 行业·世界 / 认知·个人），卡片上仍保留精确分类。</p>
  <p>刷新：<code>python feed_build.py</code> 或双击 <code>看情报流.bat</code>。</p>
  <p style="color:var(--dim)">共 ${DATA.length} 条 / ${dates.length} 天 / ${allCats.length} 个方向${GEN?('，更新于 '+GEN):''}。</p></div>`;
}
render();
</script>
</body>
</html>
