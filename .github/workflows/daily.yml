name: Daily Brief (Phase 2 · 真发邮件)

# Phase 2：每天 9:30 真跑 + 真发邮件。
# 出问题想紧急回 Phase 1（不发邮件）→ 把下面 run 命令加上 --dry-run 即可。

on:
  # 北京时间 9:30 = UTC 1:30
  schedule:
    - cron: "30 1 * * *"

  # 网页上手动触发按钮
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 强制 UTF-8（中文不乱码）
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r 04-采集脚本/requirements.txt

      - name: 跑 Brief（agent-mode · 真发邮件）
        env:
          # ===== LLM =====
          LLM_PROVIDER: deepseek
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # ===== YouTube（可选）=====
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # ===== SMTP 邮件 =====
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          cd 04-采集脚本
          python daily_digest.py --profile kizty --max-per-topic 3 --no-cache --agent-mode

      - name: 上传 HTML 备份给你（artifact · 保留 7 天）
        if: always()  # 即使发邮件挂了也上传 HTML，方便看
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            05-数据样本/**/digest.html
            05-数据样本/**/digest_lite.html
            05-数据样本/**/items.json
          if-no-files-found: warn
          retention-days: 7
