name: Daily Brief (Phase 2 · 真发邮件)

# Phase 2：每天 9:30 真跑 + 真发邮件。
# 出问题想紧急回 Phase 1（不发邮件）→ 把下面 run 命令加上 --dry-run 即可。

on:
  # 北京时间 9:30 = UTC 1:30
  schedule:
    - cron: "30 1 * * *"

  # 网页上手动触发按钮
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # gh-pages 部署需要 contents: write 推 gh-pages 分支（v2.7 · 抄自 Horizon-main/.github/workflows/daily-summary.yml）
    permissions:
      contents: write

    # 强制 UTF-8（中文不乱码）
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r 04-采集脚本/requirements.txt

      # v2.7.2 · 从 GitHub Secret 注入 KIzty 个人 profile
      # 原因：repo 改 public 后，profile（含真公司名 / 副业意图）不能进 git history
      # secret 内容 = kizty.yaml 的 base64 编码（多行 YAML 用 base64 比裸字符串稳）
      - name: 注入 kizty profile（不入仓库）
        env:
          PROFILE_B64: ${{ secrets.KIZTY_PROFILE_B64 }}
        run: |
          if [ -z "$PROFILE_B64" ]; then
            echo "❌ secret KIZTY_PROFILE_B64 未配置，跳过 profile 注入"
            exit 1
          fi
          mkdir -p 04-采集脚本/profiles
          echo "$PROFILE_B64" | base64 -d > 04-采集脚本/profiles/kizty.yaml
          echo "  ✅ profile 已注入：$(wc -l < 04-采集脚本/profiles/kizty.yaml) 行"

      - name: 跑 Brief（agent-mode · 真发邮件）
        env:
          # ===== LLM =====
          LLM_PROVIDER: deepseek
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # ===== YouTube（可选）=====
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # ===== SMTP 邮件 =====
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          cd 04-采集脚本
          # v2.8.2 · max-per-topic 3 → 10（不再硬限条数，让优质内容都进 brief，靠 min_score=6 把关质量）
          python daily_digest.py --profile kizty --max-per-topic 10 --no-cache --agent-mode

      - name: 上传 HTML 备份给你（artifact · 保留 7 天）
        if: always()  # 即使发邮件挂了也上传 HTML，方便看
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            05-数据样本/**/digest.html
            05-数据样本/**/digest_lite.html
            05-数据样本/**/items.json
          if-no-files-found: warn
          retention-days: 7

      # v2.7 · 抄自 Horizon-main/.github/workflows/daily-summary.yml @ peaceiris/actions-gh-pages
      # 把 digest.html 推到 gh-pages 分支，解决 163/Outlook 在线预览砍 inline CSS 的问题
      # 客户邮件里点链接 → 浏览器开 GitHub Pages → CSS 完美渲染
      - name: 准备 Pages 内容（只 HTML，不带 MP3 / items.json）
        if: success()
        run: |
          set -e
          rm -rf _pages
          mkdir -p _pages
          if [ -d "05-数据样本" ]; then
            cd 05-数据样本
            find . -name 'digest*.html' -print0 | while IFS= read -r -d '' f; do
              rel="${f#./}"
              target="../_pages/${rel}"
              mkdir -p "$(dirname "$target")"
              cp "$f" "$target"
              echo "  staged: $rel"
            done
          else
            echo "⚠️  05-数据样本/ 不存在，跳过 Pages 部署"
          fi

      - name: 部署到 GitHub Pages（gh-pages 分支 · 累积保留历史）
        if: success() && hashFiles('_pages/**/digest*.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages
          publish_branch: gh-pages
          keep_files: true             # 累积历史，不覆盖之前的 brief
          enable_jekyll: false         # 纯静态 HTML，不要 Jekyll 处理（避免奇怪的渲染）
          commit_message: "📝 daily digest · run #${{ github.run_number }}"
