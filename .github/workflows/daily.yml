name: Daily Brief (拉取优先 · 不发邮件)

# 每天 9:30 抓取 + 摘要 + 更新 gh-pages / latest.md。
# 默认 --dry-run：不发邮件。高分警报走 Server酱（见下方 push_alert 步骤）。

on:
  # 北京时间 9:30 = UTC 1:30
  schedule:
    - cron: "30 1 * * *"

  # 网页上手动触发按钮
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # gh-pages 部署需要 contents: write 推 gh-pages 分支（v2.7 · 抄自 Horizon-main/.github/workflows/daily-summary.yml）
    permissions:
      contents: write

    # 强制 UTF-8（中文不乱码）
    env:
      PYTHONIOENCODING: utf-8
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r 04-采集脚本/requirements.txt

      # v2.7.2 · 从 GitHub Secret 注入 KIzty 个人 profile
      # 原因：repo 改 public 后，profile（含真公司名 / 副业意图）不能进 git history
      # secret 内容 = kizty.yaml 的 base64 编码（多行 YAML 用 base64 比裸字符串稳）
      - name: 注入 kizty profile（不入仓库）
        env:
          PROFILE_B64: ${{ secrets.KIZTY_PROFILE_B64 }}
        run: |
          if [ -z "$PROFILE_B64" ]; then
            echo "❌ secret KIZTY_PROFILE_B64 未配置，跳过 profile 注入"
            exit 1
          fi
          mkdir -p 04-采集脚本/profiles
          echo "$PROFILE_B64" | base64 -d > 04-采集脚本/profiles/kizty.yaml
          echo "  ✅ profile 已注入：$(wc -l < 04-采集脚本/profiles/kizty.yaml) 行"

      - name: 跑 Brief（agent-mode · dry-run 不发邮件）
        env:
          # ===== LLM =====
          LLM_PROVIDER: deepseek
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # ===== YouTube（可选）=====
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # ===== SMTP（保留 secret，但 --dry-run 不会发）=====
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.SMTP_USER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # v3.2 · GitHub Release API 限速：用 Actions 内置 GITHUB_TOKEN 提到 5000/h
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd 04-采集脚本
          # --dry-run：停每日邮件；抓取 / 摘要 / items / meta / HTML 照常产出
          python daily_digest.py --profile kizty --max-per-topic 10 --no-cache --agent-mode --dry-run

      - name: 上传 HTML 备份给你（artifact · 保留 7 天）
        if: always()  # 即使发邮件挂了也上传 HTML，方便看
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: |
            05-数据样本/**/digest.html
            05-数据样本/**/digest_lite.html
            05-数据样本/**/items.json
            05-数据样本/**/meta.json
            05-数据样本/**/all_fetched.json
          if-no-files-found: warn
          retention-days: 7

      # v3.6 · 取 gh-pages 上累积的历史 items.json（feed 需要全部历史才能"翻"）
      - name: 取 gh-pages 历史数据
        if: success()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _ghpages_prev

      # v2.7 · 抄自 Horizon-main/.github/workflows/daily-summary.yml @ peaceiris/actions-gh-pages
      # 把 digest.html 推到 gh-pages 分支，解决 163/Outlook 在线预览砍 inline CSS 的问题
      # 客户邮件里点链接 → 浏览器开 GitHub Pages → CSS 完美渲染
      - name: 准备 Pages 内容（只 HTML，不带 MP3 / items.json）
        if: success()
        run: |
          set -e
          rm -rf _pages
          mkdir -p _pages
          if [ -d "05-数据样本" ]; then
            cd 05-数据样本
            find . -name 'digest*.html' -print0 | while IFS= read -r -d '' f; do
              rel="${f#./}"
              target="../_pages/${rel}"
              mkdir -p "$(dirname "$target")"
              cp "$f" "$target"
              echo "  staged: $rel"
            done
          else
            echo "⚠️  05-数据样本/ 不存在，跳过 Pages 部署"
          fi

      # v3.6 · 累积历史数据 + 生成 aihot 式情报流 feed（自包含 index.html）
      - name: 生成情报流 feed（index.html）
        if: success()
        continue-on-error: true
        run: |
          set -e
          mkdir -p _feeddata _pages/data
          # 1) 历史：之前 gh-pages 累积的 items.json
          if [ -d _ghpages_prev/data ]; then
            cp -r _ghpages_prev/data/* _feeddata/ 2>/dev/null || true
          fi
          # 2) 今天：本次 digest 刚产出的 items.json（同时推到 gh-pages 持久化）
          find 05-数据样本 -name items.json | while IFS= read -r f; do
            d=$(echo "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n1)
            [ -z "$d" ] && continue
            mkdir -p "_feeddata/$d" "_pages/data/$d"
            cp "$f" "_feeddata/$d/items.json"
            cp "$f" "_pages/data/$d/items.json"
            dir=$(dirname "$f")
            [ -f "$dir/meta.json" ] && cp "$dir/meta.json" "_feeddata/$d/meta.json" "_pages/data/$d/meta.json"
            [ -f "$dir/all_fetched.json" ] && cp "$dir/all_fetched.json" "_feeddata/$d/all_fetched.json" "_pages/data/$d/all_fetched.json"
          done
          # 3) 生成自包含 feed（近 21 天内嵌 + latest.md/json）
          FEED_DATA_DIR="$GITHUB_WORKSPACE/_feeddata" \
          FEED_OUT="$GITHUB_WORKSPACE/_pages/index.html" \
          FEED_LATEST_MD="$GITHUB_WORKSPACE/_pages/latest.md" \
          FEED_LATEST_JSON="$GITHUB_WORKSPACE/_pages/latest.json" \
          FEED_INDEX_JSON="$GITHUB_WORKSPACE/_pages/data/index.json" \
          FEED_EMBED_DAYS=21 \
          python 04-采集脚本/feed_build.py
          echo "  ✅ 已生成 _pages/index.html（$(du -h _pages/index.html | cut -f1)）"
          [ -f _pages/latest.md ] && echo "  ✅ latest.md（微信 bot 固定拉取）"

      - name: 高分警报（Server酱 · 仅 ≥9 分）
        if: success()
        continue-on-error: true
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          ALERT_MIN_SCORE: "9"
          ALERT_FEED_URL: https://kkkyi7.github.io/web-intel-bot-v2/index.html
        run: |
          python 04-采集脚本/push_alert.py

      - name: 部署到 GitHub Pages（gh-pages 分支 · 累积保留历史）
        if: success() && hashFiles('_pages/**/digest*.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_pages
          publish_branch: gh-pages
          keep_files: true             # 累积历史，不覆盖之前的 brief
          enable_jekyll: false         # 纯静态 HTML，不要 Jekyll 处理（避免奇怪的渲染）
          commit_message: "📝 daily digest · run #${{ github.run_number }}"
